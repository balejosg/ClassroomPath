<div id="register-screen" class="screen hidden">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🎓</div>
            <h1>ClassroomPath</h1>
            <p>Crear una cuenta nueva</p>
        </div>
        <div class="login-form">
            <div id="google-signup-btn" class="google-btn-container"></div>

            <div class="login-separator">
                <span>o con tu email</span>
            </div>

            <form id="email-register-form" novalidate>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required placeholder="profesor@colegio.es" autocomplete="email"
                           aria-describedby="register-email-error" aria-invalid="false">
                    <small id="register-email-error" class="field-error" role="alert" aria-live="polite"></small>
                </div>
                <div class="form-group">
                    <label for="register-name">Nombre</label>
                    <input type="text" id="register-name" required placeholder="Tu nombre" autocomplete="name" minlength="2"
                           aria-describedby="register-name-error" aria-invalid="false">
                    <small id="register-name-error" class="field-error" role="alert" aria-live="polite"></small>
                </div>
                <div class="form-group">
                    <label for="register-password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password" required minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                               aria-describedby="register-password-hint register-password-error password-requirements" aria-invalid="false">
                        <button type="button" id="toggle-register-password" class="password-toggle" aria-label="Mostrar contraseña" title="Mostrar contraseña">👁️</button>
                    </div>
                    <div class="password-strength-indicator">
                        <div class="strength-bar" id="password-strength-bar"></div>
                        <span class="strength-label" id="password-strength-label"></span>
                    </div>
                    <ul class="password-requirements" id="password-requirements" aria-label="Requisitos de contraseña">
                        <li id="req-length" class="requirement unmet">✗ Mínimo 8 caracteres</li>
                        <li id="req-upper" class="requirement unmet">✗ Una mayúscula</li>
                        <li id="req-lower" class="requirement unmet">✗ Una minúscula</li>
                        <li id="req-number" class="requirement unmet">✗ Un número</li>
                    </ul>
                    <small id="register-password-error" class="field-error" role="alert" aria-live="polite"></small>
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Confirmar contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password-confirm" required minlength="8" placeholder="Repetir contraseña" autocomplete="new-password"
                               aria-describedby="register-password-confirm-error" aria-invalid="false">
                        <button type="button" id="toggle-register-password-confirm" class="password-toggle" aria-label="Mostrar contraseña" title="Mostrar contraseña">👁️</button>
                    </div>
                    <small id="register-password-confirm-error" class="field-error" role="alert" aria-live="polite"></small>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="register-terms" required aria-describedby="register-terms-error">
                        <span>Acepto los <a href="/terms" target="_blank" rel="noopener">Términos de Servicio</a> y la <a href="/privacy" target="_blank" rel="noopener">Política de Privacidad</a></span>
                    </label>
                    <small id="register-terms-error" class="field-error" role="alert" aria-live="polite"></small>
                </div>
                <button type="submit" id="email-register-btn" class="btn btn-primary btn-block" disabled>
                    Crear cuenta
                </button>
            </form>

            <div id="register-error" class="error-message" role="alert" aria-live="assertive"></div>

            <p class="login-info">
                ¿Ya tienes cuenta? <a href="#" id="goto-login-link">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>
