name: 'Setup Node.js'
description: 'Configure Node.js with npm cache'

inputs:
  cache-dependency-path:
    description: 'Lockfiles used for npm cache keys'
    required: false
    default: 'package-lock.json'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
