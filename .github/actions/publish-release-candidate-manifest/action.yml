name: 'Publish Release Candidate Manifest'
description: 'Publish the release-candidate image tag and emit the canonical image ref'

inputs:
  build-required:
    description: 'Whether the manifest must be rebuilt from the server image digests'
    required: true
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  tag:
    description: 'Manifest tag to publish'
    required: true
  image-repo:
    description: 'Image repository used for digest addressing'
    required: true
  amd64-digest:
    description: 'amd64 image digest'
    required: false
    default: ''
  arm64-digest:
    description: 'arm64 image digest'
    required: false
    default: ''
  previous-image:
    description: 'Previously published image ref to reuse when no rebuild is needed'
    required: true
  output-name:
    description: 'Output variable name for the published image ref'
    required: true
  openpath-source-sha:
    description: 'Exact OpenPath source SHA required on the image config'
    required: true
  openpath-contract-sha256:
    description: 'SHA-256 of the exact OpenPath promotion contract required on the image config'
    required: true

outputs:
  image:
    description: 'Canonical image ref for downstream jobs'
    value: ${{ steps.publish.outputs.image }}

runs:
  using: 'composite'
  steps:
    - name: Setup Docker build
      uses: ./.github/actions/setup-docker-build
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Publish multiarch image tag
      if: ${{ inputs.build-required == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        test -n "${{ inputs.amd64-digest }}"
        test -n "${{ inputs.arm64-digest }}"

        docker buildx imagetools create \
          --tag "${{ inputs.tag }}" \
          "${{ inputs.image-repo }}@${{ inputs.amd64-digest }}" \
          "${{ inputs.image-repo }}@${{ inputs.arm64-digest }}"

    - name: Publish manifest output
      id: publish
      shell: bash
      run: |
        set -euo pipefail

        if [ "${{ inputs.build-required }}" = 'true' ]; then
          manifest_digest=''
          for attempt in $(seq 1 36); do
            if manifest_digest="$(docker buildx imagetools inspect "${{ inputs.tag }}" 2>/dev/null | awk '/^Digest:/ {print $2; exit}')" && [ -n "$manifest_digest" ]; then
              echo "Resolved manifest digest for ${{ inputs.tag }} on attempt ${attempt}."
              break
            fi

            manifest_digest=''
            echo "Waiting for manifest digest for ${{ inputs.tag }} (attempt ${attempt}/36)..." >&2
            if [ "$attempt" -lt 36 ]; then
              sleep 5
            fi
          done

          if [ -z "$manifest_digest" ]; then
            echo "::error::Timed out waiting for manifest digest for ${{ inputs.tag }} after 36 attempts." >&2
            exit 1
          fi
          image="${{ inputs.image-repo }}@$manifest_digest"
        else
          image="${{ inputs.previous-image }}"
        fi

        echo "${{ inputs.output-name }}=$image" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Verify published image provenance
      shell: bash
      env:
        EXPECTED_OPENPATH_SOURCE_SHA: ${{ inputs.openpath-source-sha }}
        EXPECTED_OPENPATH_CONTRACT_SHA256: ${{ inputs.openpath-contract-sha256 }}
      run: |
        set -euo pipefail

        image="${{ steps.publish.outputs.image }}"
        if [[ ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::Release candidate image must be digest-pinned: $image" >&2
          exit 1
        fi

        command -v jq >/dev/null 2>&1
        index_json="$(docker buildx imagetools inspect --raw "$image")"
        for platform in linux/amd64 linux/arm64; do
          os="${platform%/*}"
          architecture="${platform#*/}"
          child_digest="$(printf '%s\n' "$index_json" | jq -er --arg os "$os" --arg architecture "$architecture" '
            [.manifests[]? | select(.platform.os == $os and .platform.architecture == $architecture)]
            | if length == 1 then .[0].digest else error("required platform manifest is missing or duplicated") end
          ')"
          if [[ ! "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Manifest child digest for $platform is invalid: $child_digest" >&2
            exit 1
          fi

          child_ref="${image%@*}@${child_digest}"
          child_manifest="$(docker buildx imagetools inspect --raw "$child_ref")"
          child_config_digest="$(printf '%s\n' "$child_manifest" | jq -er '.config.digest')"
          if [[ ! "$child_config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Manifest child config digest for $platform is invalid: $child_config_digest" >&2
            exit 1
          fi

          docker pull "$child_ref"
          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$child_ref")"
          if [ "$actual_platform" != "$platform" ]; then
            echo "::error::Published image platform mismatch. expected=$platform actual=$actual_platform" >&2
            exit 1
          fi
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$child_ref")"
          contract_sha256="$(docker image inspect --format '{{ index .Config.Labels "eu.classroompath.openpath.contract-sha256" }}' "$child_ref")"

          if [ "$revision" != "$EXPECTED_OPENPATH_SOURCE_SHA" ]; then
            echo "::error::Image OpenPath source provenance mismatch for $platform. expected=$EXPECTED_OPENPATH_SOURCE_SHA actual=$revision" >&2
            exit 1
          fi
          if [ "$contract_sha256" != "$EXPECTED_OPENPATH_CONTRACT_SHA256" ]; then
            echo "::error::Image OpenPath contract provenance mismatch for $platform. expected=$EXPECTED_OPENPATH_CONTRACT_SHA256 actual=$contract_sha256" >&2
            exit 1
          fi
        done
