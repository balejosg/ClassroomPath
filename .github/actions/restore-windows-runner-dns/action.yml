name: Restore Windows Runner DNS
description: Restore external DNS on the persistent Windows runner and verify GitHub connectivity.

inputs:
  dns-servers:
    description: Comma-separated DNS servers to apply to active non-loopback adapters.
    default: 1.1.1.1,8.8.8.8
  require-github-connectivity:
    description: Whether to fail when github.com cannot be reached after DNS restore.
    default: 'true'
  connectivity-hosts:
    description: Comma-separated hosts that must resolve and accept TCP/443 after DNS restore.
    default: github.com,pipelines.actions.githubusercontent.com

runs:
  using: composite
  steps:
    - name: Restore DNS client servers
      shell: pwsh
      run: |
        $dnsServers = '${{ inputs.dns-servers }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
        $connectivityHosts = '${{ inputs.connectivity-hosts }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
        $requireConnectivity = '${{ inputs.require-github-connectivity }}' -eq 'true'
        & "$env:GITHUB_WORKSPACE\scripts\Restore-WindowsRunnerDns.ps1" `
          -DnsServers $dnsServers `
          -ConnectivityHosts $connectivityHosts `
          -RequireConnectivity $requireConnectivity
