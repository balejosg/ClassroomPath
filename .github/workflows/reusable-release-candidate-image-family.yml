name: Reusable Release Candidate Image Family

on:
  workflow_call:
    inputs:
      build_required:
        description: Whether this image family should build fresh multi-arch images.
        required: true
        type: boolean
      context:
        description: Docker build context.
        required: true
        type: string
      file:
        description: Dockerfile path.
        required: true
        type: string
      image_repo:
        description: OCI repository for push-by-digest builds.
        required: true
        type: string
      tag:
        description: Multi-arch manifest tag.
        required: true
        type: string
      previous_image:
        description: Previously published manifest image reference.
        required: false
        type: string
        default: ''
      output_name:
        description: Logical output name for the publish action.
        required: true
        type: string
      amd64_cache_scope:
        description: Cache scope for the amd64 build.
        required: true
        type: string
      arm64_cache_scope:
        description: Cache scope for the arm64 build.
        required: true
        type: string
      artifact_name:
        description: Optional artifact to download before building.
        required: false
        type: string
        default: ''
      artifact_path:
        description: Optional destination path for the downloaded artifact.
        required: false
        type: string
        default: ''
      verify_paths:
        description: Optional newline-delimited paths that must exist before building.
        required: false
        type: string
        default: ''
      checkout_submodules:
        description: Whether the build jobs should checkout git submodules recursively.
        required: false
        type: boolean
        default: true
      display_name:
        description: Human-readable family name for job titles.
        required: true
        type: string
    secrets:
      ghcr_password:
        description: Token used to authenticate to GHCR.
        required: true
    outputs:
      image:
        description: Published multi-arch image reference for this family.
        value: ${{ jobs.publish-manifest.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: Build ${{ inputs.display_name }} (amd64)
    if: inputs.build_required
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout
        if: ${{ !inputs.checkout_submodules }}
        uses: actions/checkout@v6

      - name: Checkout with submodules
        if: inputs.checkout_submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push amd64 image
        id: build-image
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_password }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          outputs: type=image,name=${{ inputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: ${{ inputs.amd64_cache_scope }}
          artifact-name: ${{ inputs.artifact_name }}
          artifact-path: ${{ inputs.artifact_path }}
          verify-paths: ${{ inputs.verify_paths }}

  build-arm64:
    name: Build ${{ inputs.display_name }} (arm64)
    if: inputs.build_required
    runs-on: ubuntu-24.04-arm
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout
        if: ${{ !inputs.checkout_submodules }}
        uses: actions/checkout@v6

      - name: Checkout with submodules
        if: inputs.checkout_submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push arm64 image
        id: build-image
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_password }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/arm64
          outputs: type=image,name=${{ inputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: ${{ inputs.arm64_cache_scope }}
          artifact-name: ${{ inputs.artifact_name }}
          artifact-path: ${{ inputs.artifact_path }}
          verify-paths: ${{ inputs.verify_paths }}

  publish-manifest:
    name: Publish ${{ inputs.display_name }} Manifest
    runs-on: ubuntu-latest
    if: ${{ always() && (!inputs.build_required || (needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success')) }}
    needs:
      - build-amd64
      - build-arm64
    outputs:
      image: ${{ steps.publish-manifest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish image family manifest output
        id: publish-manifest
        uses: ./.github/actions/publish-release-candidate-manifest
        with:
          build-required: ${{ inputs.build_required }}
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_password }}
          tag: ${{ inputs.tag }}
          image-repo: ${{ inputs.image_repo }}
          amd64-digest: ${{ needs.build-amd64.outputs.image_digest }}
          arm64-digest: ${{ needs.build-arm64.outputs.image_digest }}
          previous-image: ${{ inputs.previous_image }}
          output-name: ${{ inputs.output_name }}
