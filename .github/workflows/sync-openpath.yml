name: Sync OpenPath

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'How to publish a verified OpenPath submodule update'
        required: false
        default: 'direct-main'
        type: choice
        options:
          - direct-main
          - pull-request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openpath
  cancel-in-progress: true

jobs:
  sync:
    name: Check and Sync OpenPath
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Check sync lock
        id: lock
        run: |
          if [ -f ".openpath-sync-lock" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "locked=true" >> $GITHUB_OUTPUT
            echo "OpenPath sync is locked via .openpath-sync-lock (scheduled run skipped)."
            exit 0
          fi
          echo "locked=false" >> $GITHUB_OUTPUT

      - name: Resolve sync mode
        id: mode
        if: steps.lock.outputs.locked != 'true'
        run: |
          mode="${{ github.event.inputs.mode || 'direct-main' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode="direct-main"
          fi

          case "$mode" in
            direct-main|pull-request)
              echo "mode=$mode" >> "$GITHUB_OUTPUT"
              echo "OpenPath sync mode: $mode"
              ;;
            *)
              echo "::error::Unsupported OpenPath sync mode: $mode"
              exit 1
              ;;
          esac

      - name: Check for OpenPath updates
        id: check
        if: steps.lock.outputs.locked != 'true'
        run: |
          cd upstream/openpath
          git fetch origin main

          CURRENT_SHA=$(git rev-parse HEAD)
          LATEST_SHA=$(git rev-parse origin/main)

          echo "current=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_SHA" >> $GITHUB_OUTPUT

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "OpenPath has updates: $CURRENT_SHA -> $LATEST_SHA"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "OpenPath is up to date"
          fi

      - name: Verify OpenPath upstream checks
        id: verify
        if: steps.lock.outputs.locked != 'true' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENPATH_BASE_SHA: ${{ steps.check.outputs.current }}
          OPENPATH_SHA: ${{ steps.check.outputs.latest }}
        run: |
          echo "Verifying OpenPath checks for $OPENPATH_SHA"
          OPENPATH_REQUIRED_CHECKS_TIMEOUT_SECONDS=2400 \
          OPENPATH_REQUIRED_CHECKS_INTERVAL_SECONDS=10 \
          OPENPATH_REQUIRED_CHECKS_FAIL_FAST=true \
            node scripts/openpath-required-checks.mjs wait

      - name: Verify OpenPath Linux agent APT installability
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome == 'success' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          linux_agent_env="$(mktemp)"
          node scripts/resolve-openpath-linux-agent-version.mjs \
            --openpath-dir upstream/openpath > "$linux_agent_env"
          cat "$linux_agent_env"
          # shellcheck disable=SC1090
          . "$linux_agent_env"

          OPENPATH_LINUX_AGENT_VERSION="$version" \
          OPENPATH_LINUX_AGENT_APT_SUITE="$apt_suite" \
            node scripts/resolve-openpath-linux-agent-version.mjs verify-runtime-pin

          OPENPATH_LINUX_AGENT_VERSION="$version" \
          OPENPATH_LINUX_AGENT_APT_SUITE="$apt_suite" \
            node scripts/resolve-openpath-linux-agent-version.mjs install-probe-script \
            | docker run --rm -i ubuntu:24.04 bash

      - name: Update submodule
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome == 'success' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          cd upstream/openpath
          git checkout origin/main
          cd ../..
          git add upstream/openpath

      - name: Commit and push direct sync
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome == 'success' && steps.mode.outputs.mode == 'direct-main' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        env:
          CLASSROOMPATH_SYNC_TOKEN: ${{ secrets.CLASSROOMPATH_SYNC_TOKEN }}
        run: |
          if [ -z "$CLASSROOMPATH_SYNC_TOKEN" ]; then
            echo "::error::CLASSROOMPATH_SYNC_TOKEN is required for direct OpenPath handoff so the resulting push triggers ClassroomPath CI."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "OpenPath submodule already points at ${{ steps.check.outputs.latest }}."
            exit 0
          fi

          git config user.name "classroompath-openpath-sync"
          git config user.email "classroompath-openpath-sync@users.noreply.github.com"
          git commit -m "chore: update openpath submodule to ${{ steps.check.outputs.latest }}"
          git push "https://x-access-token:${CLASSROOMPATH_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Open Pull Request
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome == 'success' && steps.mode.outputs.mode == 'pull-request' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update openpath submodule to ${{ steps.check.outputs.latest }}'
          branch: 'chore/sync-openpath'
          title: 'chore: sync OpenPath submodule'
          body: |
            Automated sync of the OpenPath submodule.

            - Previous: ${{ steps.check.outputs.current }}
            - Latest:   ${{ steps.check.outputs.latest }}

            Notes:
            - This workflow was run in pull-request mode.
            - Staging deployment must still be run locally via `npm run deploy:staging` after merge.

      - name: Deploy note
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome == 'success' && steps.mode.outputs.mode == 'pull-request' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          echo "OpenPath submodule sync PR created/updated. Staging deployment must be run locally via npm run deploy:staging (after merge)."

      - name: Blocked note
        if: steps.lock.outputs.locked != 'true' && steps.verify.outcome != 'success' && (steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          echo "OpenPath sync blocked: upstream required checks are not green for ${{ steps.check.outputs.latest }}."

      - name: Locked note
        if: steps.lock.outputs.locked == 'true'
        run: |
          echo "Sync skipped: .openpath-sync-lock present (scheduled run)."
