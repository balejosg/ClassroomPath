name: Sync OpenPath

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Check and Sync OpenPath
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for OpenPath updates
        id: check
        run: |
          cd upstream/openpath
          git fetch origin main

          CURRENT_SHA=$(git rev-parse HEAD)
          LATEST_SHA=$(git rev-parse origin/main)

          echo "current=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "latest=$LATEST_SHA" >> $GITHUB_OUTPUT

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "OpenPath has updates: $CURRENT_SHA -> $LATEST_SHA"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "OpenPath is up to date"
          fi

      - name: Update submodule
        if: steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd upstream/openpath
          git checkout origin/main
          cd ../..

          git add upstream/openpath
          if ! git diff --cached --quiet; then
            git commit -m "chore: update openpath submodule to ${{ steps.check.outputs.latest }}"
            git push
            echo "Submodule updated"
          else
            echo "No changes to commit"
          fi

      - name: Deploy note
        if: steps.check.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Submodule synced. Staging deployment must be run locally via npm run deploy:staging."
