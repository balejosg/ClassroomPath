name: Cleanup Staging Containers

on:
  workflow_dispatch:

jobs:
  cleanup-staging:
    name: Cleanup Staging Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Resolve staging host
        id: resolve
        run: |
          HOST="${{ secrets.STAGING_DEPLOY_HOST }}"
          PORT="${{ secrets.STAGING_DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "STAGING_DEPLOY_HOST not configured"
            exit 1
          fi

          # Resolve hostname
          IP=$(getent hosts "$HOST" 2>/dev/null | awk '{print $1}' | head -1)

          if [ -z "$IP" ]; then
            IP=$(dig +short "$HOST" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi

          if [ -z "$IP" ]; then
            echo "Could not resolve $HOST"
            exit 1
          fi

          echo "Resolved $HOST to $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT

      - name: Cleanup containers via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo "🧹 Cleaning up Docker containers and resources..."

            cd /opt/classroompath/app/docker

            # Stop all containers (both old naming and new naming)
            echo "Stopping containers..."
            docker stop classroompath-gateway classroompath-api classroompath-spa 2>/dev/null || true
            docker stop classroompath-staging-gateway-1 classroompath-staging-api-1 classroompath-staging-spa-1 2>/dev/null || true

            # Remove all containers
            echo "Removing containers..."
            docker rm -f classroompath-gateway classroompath-api classroompath-spa 2>/dev/null || true
            docker rm -f classroompath-staging-gateway-1 classroompath-staging-api-1 classroompath-staging-spa-1 2>/dev/null || true

            # Clean up with docker compose
            export COMPOSE_PROJECT_NAME=classroompath-staging
            docker compose down --remove-orphans --volumes 2>/dev/null || true

            # Remove any dangling containers
            echo "Removing dangling containers..."
            docker ps -a --filter "name=classroompath" --format "{{.Names}}" | xargs -r docker rm -f 2>/dev/null || true

            # Prune unused resources
            echo "Pruning unused Docker resources..."
            docker system prune -af --volumes || true

            echo "✅ Cleanup complete!"
            echo ""
            echo "Current Docker status:"
            docker ps -a | grep classroompath || echo "No classroompath containers found"
