name: Staging Disk Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  cleanup-staging:
    name: Check and Clean Staging Disk
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve staging host
        id: resolve
        shell: bash
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${STAGING_DEPLOY_HOST:-}" ]; then
            echo "STAGING_DEPLOY_HOST not configured"
            exit 1
          fi

          bash scripts/resolve-ssh-host.sh "$STAGING_DEPLOY_HOST" "${STAGING_DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Check and clean staging disk via SSH
        shell: bash
        env:
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_PORT: ${{ steps.resolve.outputs.port }}
          STAGING_DEPLOY_IP: ${{ steps.resolve.outputs.ip }}
          STAGING_DISK_WARNING_THRESHOLD: '80'
          STAGING_DISK_CRITICAL_THRESHOLD: '90'
        run: |
          set -euo pipefail

          if [ -z "${STAGING_DEPLOY_USER:-}" ] || [ -z "${STAGING_DEPLOY_SSH_KEY:-}" ]; then
            echo "Missing staging SSH credentials"
            exit 1
          fi

          key_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$key_file" "$output_file"' EXIT
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh_opts=(
            -i "$key_file"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -p "${STAGING_DEPLOY_PORT:-22}"
          )

          ssh_reachable="false"
          disk_before=""
          disk_after=""
          cleanup_ran="false"
          failure_boundary="none"

          if ssh "${ssh_opts[@]}" "${STAGING_DEPLOY_USER}@${STAGING_DEPLOY_IP}" true >/dev/null 2>&1; then
            ssh_reachable="true"
          else
            failure_boundary="staging-ssh-unreachable"
            echo "::error::Unable to reach staging host over SSH"
          fi

          if [ "$ssh_reachable" = "true" ]; then
            ssh "${ssh_opts[@]}" "${STAGING_DEPLOY_USER}@${STAGING_DEPLOY_IP}" \
              "STAGING_DISK_WARNING_THRESHOLD='${STAGING_DISK_WARNING_THRESHOLD}' STAGING_DISK_CRITICAL_THRESHOLD='${STAGING_DISK_CRITICAL_THRESHOLD}' bash -s" \
              >"$output_file" <<'REMOTE_SCRIPT'
          set -euo pipefail

          warning_threshold="${STAGING_DISK_WARNING_THRESHOLD:-80}"
          critical_threshold="${STAGING_DISK_CRITICAL_THRESHOLD:-90}"

          disk_usage_percent() {
            df / | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }'
          }

          before="$(disk_usage_percent)"
          cleaned="false"

          printf 'DISK_BEFORE=%s\n' "$before"
          docker system df || true

          if [ "$before" -ge "$warning_threshold" ]; then
            cleaned="true"
            docker system prune -af || true
            docker builder prune -af || true
          fi

          after="$(disk_usage_percent)"
          printf 'DISK_AFTER=%s\n' "$after"
          printf 'CLEANUP_RAN=%s\n' "$cleaned"
          printf 'WARNING_THRESHOLD=%s\n' "$warning_threshold"
          printf 'CRITICAL_THRESHOLD=%s\n' "$critical_threshold"
          docker system df || true
          REMOTE_SCRIPT

            cat "$output_file"

            disk_before="$(awk -F= '/^DISK_BEFORE=/{print $2}' "$output_file" | tail -1)"
            disk_after="$(awk -F= '/^DISK_AFTER=/{print $2}' "$output_file" | tail -1)"
            cleanup_ran="$(awk -F= '/^CLEANUP_RAN=/{print $2}' "$output_file" | tail -1)"

            if [ -z "${disk_after:-}" ]; then
              failure_boundary="disk-metrics-unavailable"
              echo "::error::Unable to determine staging disk usage after cleanup"
            elif [ "$disk_after" -ge "$STAGING_DISK_CRITICAL_THRESHOLD" ]; then
              failure_boundary="disk-critical"
              echo "::error::Staging disk usage remains above critical threshold (${disk_after}% >= ${STAGING_DISK_CRITICAL_THRESHOLD}%)"
            elif [ "$disk_after" -ge "$STAGING_DISK_WARNING_THRESHOLD" ]; then
              echo "::warning::Staging disk usage remains at ${disk_after}% after Docker cleanup"
            fi
          fi

          {
            echo "### Staging disk maintenance"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Host | ${STAGING_DEPLOY_IP} |"
            echo "| sshReachable | ${ssh_reachable} |"
            echo "| diskBefore | ${disk_before:-unknown}% |"
            echo "| diskAfter | ${disk_after:-unknown}% |"
            echo "| cleanupRan | ${cleanup_ran:-false} |"
            echo "| failureBoundary | ${failure_boundary} |"
            echo "| Warning threshold | ${STAGING_DISK_WARNING_THRESHOLD}% |"
            echo "| Critical threshold | ${STAGING_DISK_CRITICAL_THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failure_boundary" != "none" ]; then
            exit 1
          fi
