name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-config-scan:
    name: Docker Config Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: classroompath-trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('classroompath-trivy-results.sarif') != ''
        with:
          sarif_file: classroompath-trivy-results.sarif

      - name: Run Trivy table output
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig
          severity: HIGH,CRITICAL,MEDIUM
          format: table
          output: classroompath-trivy-results.txt

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: classroompath-trivy-docker-scan
          path: |
            classroompath-trivy-results.sarif
            classroompath-trivy-results.txt
          if-no-files-found: ignore
          retention-days: 30

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "Running npm audit for the ClassroomPath workspace lockfile..."
          npm audit --audit-level=high || true
          npm audit --json > classroompath-audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: classroompath-npm-audit
          path: classroompath-audit-report.json
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          version: 8.30.1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.gitleaks.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.gitleaks.outputs.sarif }}

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy-config-scan, npm-audit, secret-scan]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker config scan (Trivy) | ${{ needs.trivy-config-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret scanning | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: Trivy SARIF/table output and the root npm audit report are uploaded with this workflow." >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.trivy-config-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Critical security issues detected." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scans complete" >> $GITHUB_STEP_SUMMARY
