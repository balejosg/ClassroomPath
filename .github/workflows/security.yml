name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  trivy-config-scan:
    name: Docker Config Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: classroompath-trivy-results.sarif
          cache: false

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('classroompath-trivy-results.sarif') != ''
        with:
          sarif_file: classroompath-trivy-results.sarif

      - name: Run Trivy table output
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig
          severity: HIGH,CRITICAL,MEDIUM
          format: table
          output: classroompath-trivy-results.txt
          cache: false

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: classroompath-trivy-docker-scan
          path: |
            classroompath-trivy-results.sarif
            classroompath-trivy-results.txt
          if-no-files-found: ignore
          retention-days: 30

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "Running npm audit for the ClassroomPath workspace lockfile..."
          npm audit --audit-level=high --json > classroompath-audit-report.json || true
          node scripts/check-npm-audit-critical.mjs classroompath-audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: classroompath-npm-audit
          path: classroompath-audit-report.json
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"

          curl -fsSL "${release_url}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "${release_url}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          (
            cd /tmp
            grep " ${asset}$" gitleaks_checksums.txt | sha256sum -c -
          )

          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run Gitleaks
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          current_sha="${GITHUB_SHA_VALUE}"
          before_sha="${GITHUB_BEFORE_SHA}"
          pr_base_sha="${PR_BASE_SHA}"
          pr_head_sha="${PR_HEAD_SHA}"
          zero_sha="0000000000000000000000000000000000000000"

          case "$event_name" in
            pull_request)
              log_range="${pr_base_sha}..${pr_head_sha}"
              ;;
            push)
              if [ -n "$before_sha" ] && [ "$before_sha" != "$zero_sha" ]; then
                log_range="${before_sha}..${current_sha}"
              else
                log_range="${current_sha}^..${current_sha}"
              fi
              ;;
            *)
              log_range="${current_sha}^..${current_sha}"
              ;;
          esac

          echo "Running Gitleaks for commit range: ${log_range}"
          /tmp/gitleaks detect \
            --source . \
            --verbose \
            --redact \
            --report-format sarif \
            --report-path results.sarif \
            --log-opts "$log_range"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, trivy-config-scan, npm-audit, secret-scan]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker config scan (Trivy) | ${{ needs.trivy-config-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret scanning | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: Trivy SARIF/table output and the root npm audit report are uploaded with this workflow." >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.codeql.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy-config-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.npm-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Critical security issues detected." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scans complete" >> $GITHUB_STEP_SUMMARY
