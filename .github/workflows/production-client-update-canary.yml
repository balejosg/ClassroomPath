name: Production Client Update Canary

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      production_base_url:
        description: Optional production public base URL override to exercise.
        default: ''
        required: false
        type: string
      target_platform:
        description: Platform canary to run for manual diagnostics.
        default: both
        required: false
        type: choice
        options:
          - both
          - download
          - linux
          - windows

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: production-client-update-canary-${{ github.run_id }}
  cancel-in-progress: false

# Evidence states emitted by this workflow:
# live-tested, skipped-duplicate, manual-dispatch-required, skipped-by-billing-mode, advisory-only, failed

jobs:
  ci-signal-policy:
    name: CI signal policy guard
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.duplicate.outputs.should_skip }}
      reason: ${{ steps.duplicate.outputs.reason }}
      matching_run_url: ${{ steps.duplicate.outputs.matching_run_url }}
      last_live_tested_at: ${{ steps.duplicate.outputs.last_live_tested_at }}
      evidence_state: ${{ steps.duplicate.outputs.evidence_state }}
      evidenceLevel: ${{ steps.duplicate.outputs.evidenceLevel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Evaluate scheduled duplicate policy
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SIGNAL_CLASS: post-release health
          CI_TARGET_ENVIRONMENT: production
          CI_RELEASE_EVIDENCE_AFFECTED: no; production release evidence uses preproduction installed-client gates.
          CI_NEXT_ACTION: Scheduled duplicates may skip; manual dispatch remains available for diagnostics.
          CI_DUPLICATE_POLICY: same workflow success or deploy evidence + same SHA within 60m
          CI_DUPLICATE_FRESHNESS_WINDOW: 60m
          CI_WORKFLOW_NAME: Production Client Update Canary
          CI_SIGNAL_POLICY_EVIDENCE_PATH: ci-signal-policy-evidence.json
        run: node scripts/ci-signal-policy.mjs duplicate-suppression

      - name: Report stale scheduled workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_HYGIENE_MODE: dry-run
          CI_WORKFLOW_HYGIENE_STALE_AFTER: 90m
          CI_WORKFLOW_HYGIENE_WORKFLOWS: Production Client Update Canary,Sync OpenPath
          CI_WORKFLOW_HYGIENE_EVIDENCE_PATH: ci-workflow-hygiene-report.json
        run: node scripts/ci-workflow-hygiene.mjs report-stale-runs

      - name: Upload CI signal policy evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-signal-policy-evidence
          path: ci-signal-policy-evidence.json
          if-no-files-found: error

      - name: Upload CI workflow hygiene report
        uses: actions/upload-artifact@v7
        with:
          name: ci-workflow-hygiene-report
          path: ci-workflow-hygiene-report.json
          if-no-files-found: error

  production-enrollment-download-canary:
    name: Production Enrollment Download Canary
    needs: [ci-signal-policy]
    if: >-
      needs.ci-signal-policy.outputs.should_skip != 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.production_base_url || vars.PRODUCTION_PUBLIC_URL || secrets.PRODUCTION_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production enrollment download canary" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production enrollment download canary" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-enrollment-canary

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-enrollment-canary \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production Linux enrollment runtime
        id: read-linux-runtime
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          linux_agent_version="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-enrollment-canary \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            OPENPATH_LINUX_AGENT_VERSION)"
          linux_agent_apt_suite="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-enrollment-canary \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            OPENPATH_LINUX_AGENT_APT_SUITE)"

          echo "linux_agent_version=$linux_agent_version" >> "$GITHUB_OUTPUT"
          echo "linux_agent_apt_suite=${linux_agent_apt_suite:-stable}" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-enrollment-canary \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-enrollment-canary \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment canary
        id: provision
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ env.PRODUCTION_BASE_URL }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download live production enrollment scripts
        shell: bash
        env:
          PRODUCTION_ENROLLMENT_CANARY_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
          CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision.outputs.enrollment_token }}
          OPENPATH_LINUX_AGENT_VERSION: ${{ steps.read-linux-runtime.outputs.linux_agent_version }}
          PRODUCTION_ENROLLMENT_CANARY_OUTPUT: production-enrollment-download-canary.json
        run: |
          set -euo pipefail
          node scripts/production-enrollment-download-canary.mjs
          test -f production-enrollment-download-canary.json

      - name: Upload routine production enrollment download canary artifact
        if: ${{ github.event_name == 'schedule' && success() }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: production-enrollment-download-canary
          path: |
            production-enrollment-download-canary.json
            production-windows-bootstrap-canary.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload diagnostic production enrollment download canary artifact
        if: ${{ always() && (github.event_name != 'schedule' || !success()) }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: production-enrollment-download-canary
          path: |
            production-enrollment-download-canary.json
            production-windows-bootstrap-canary.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Create issue on production enrollment download failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_TITLE: Production Enrollment Download Canary Failed
          ISSUE_LABELS: enrollment-canary-failure,production,automated,priority-high
          SMOKE_ENVIRONMENT: production-enrollment-download
          SMOKE_PUBLIC_URL: ${{ env.PRODUCTION_BASE_URL }}
          SMOKE_READY_URL: ${{ env.PRODUCTION_BASE_URL }}/readyz
          SMOKE_API_HEALTH_URL: ${{ env.PRODUCTION_BASE_URL }}/api/health
          SMOKE_API_CONFIG_URL: ${{ env.PRODUCTION_BASE_URL }}/api/config
        run: node scripts/report-smoke-failure.mjs

      - name: Close production enrollment download issue on recovery
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_LABELS: enrollment-canary-failure,production,automated,priority-high
          SMOKE_ENVIRONMENT: production-enrollment-download
        run: node scripts/close-smoke-recovery.mjs

  windows-client-self-update-canary:
    name: Windows Client Self-Update Canary
    needs: [ci-signal-policy]
    if: >-
      (
        github.event_name == 'schedule' &&
        github.event.schedule == '17 3 * * *'
      ) ||
      (
        needs.ci-signal-policy.outputs.should_skip != 'true' &&
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.target_platform != 'download' &&
        github.event.inputs.target_platform != 'linux'
      )
    runs-on: [self-hosted, Windows, X64, proxmox, classroompath]
    timeout-minutes: 35
    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.production_base_url || vars.PRODUCTION_PUBLIC_URL || secrets.PRODUCTION_PUBLIC_URL }}

    steps:
      - name: Restore Windows runner DNS before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $dnsServers = @('1.1.1.1', '8.8.8.8')
          $activeAdapters = @(Get-NetAdapter -ErrorAction SilentlyContinue |
            Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -notlike '*Loopback*' })

          foreach ($adapter in $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          if (-not $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceAlias 'Ethernet' -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          Clear-DnsClientCache -ErrorAction SilentlyContinue
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          "RUNNER_DNS_BEFORE_RESET=$runnerDnsServersJson" >> $env:GITHUB_ENV

          $githubProbe = Test-NetConnection github.com -Port 443 -WarningAction SilentlyContinue
          if (-not $githubProbe.NameResolutionSucceeded -or -not $githubProbe.TcpTestSucceeded) {
            throw "GitHub connectivity failed before checkout. NameResolution=$($githubProbe.NameResolutionSucceeded) Tcp443=$($githubProbe.TcpTestSucceeded)"
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Restore Windows runner DNS before dependency install
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Install Windows AJAX canary dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_status=1
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts; then
              install_status=0
              break
            fi

            install_status=$?
            if [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "::warning::npm ci failed on attempt ${attempt}; retrying after npm cache verification"
            npm cache verify || true
            sleep $((attempt * 10))
          done

          if [ "$install_status" -ne 0 ]; then
            exit "$install_status"
          fi

          node -e "Promise.all([import('selenium-webdriver'), import('selenium-webdriver/firefox.js')])"

      - name: Assert destructive Windows runner is available
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-destructive-runner-available.mjs

      - name: Record Windows runner health before reset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-runner-health-evidence.mjs \
            --artifact production-windows-runner-health.json \
            --phase pre-reset \
            --dns-servers-json "${RUNNER_DNS_BEFORE_RESET:-[]}" \
            --target-url "$PRODUCTION_BASE_URL"

      - name: Reset persistent Windows canary state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $openPathRoot = 'C:\OpenPath'
          $uninstallPath = Join-Path $openPathRoot 'Uninstall-OpenPath.ps1'
          if (Test-Path $uninstallPath) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstallPath
          }

          Get-ScheduledTask -TaskName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $acrylicService = Get-Service -Name 'AcrylicDNSProxySvc' -ErrorAction SilentlyContinue
          if ($acrylicService) {
            Stop-Service -Name $acrylicService.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $acrylicService.Name | Out-Null
          }

          foreach ($acrylicPath in @(
            (Join-Path ${env:ProgramFiles(x86)} 'Acrylic DNS Proxy'),
            (Join-Path ${env:ProgramFiles} 'Acrylic DNS Proxy')
          )) {
            $acrylicServicePath = Join-Path $acrylicPath 'AcrylicService.exe'
            if (Test-Path $acrylicServicePath) {
              & $acrylicServicePath /UNINSTALL 2>$null
            }
            Remove-Item -LiteralPath $acrylicPath -Recurse -Force -ErrorAction SilentlyContinue
          }

          foreach ($policyPath in @(
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\distribution\policies.json'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\distribution\policies.json')
          )) {
            Remove-Item -LiteralPath $policyPath -Force -ErrorAction SilentlyContinue
          }

          Remove-Item -LiteralPath 'C:\OpenPath' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore Windows runner DNS after reset
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Record Windows runner health after reset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          node scripts/write-runner-health-evidence.mjs `
            --artifact production-windows-runner-health.json `
            --phase post-reset `
            --dns-servers-json "$runnerDnsServersJson" `
            --target-url "$env:PRODUCTION_BASE_URL"

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production canaries" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production canaries" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-release

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment canary
        id: provision
        shell: bash
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ env.PRODUCTION_BASE_URL }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download and run live Windows enrollment script
        shell: pwsh
        env:
          CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision.outputs.enrollment_token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'GitHub Actions runner is not elevated enough to execute windows.ps1'
          }

          $workspace = Join-Path $env:RUNNER_TEMP 'windows-client-self-update-canary'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $headers = @{ Authorization = "Bearer $env:ENROLLMENT_TOKEN" }
          $windowsScriptUrl = "$env:PRODUCTION_BASE_URL/api/enroll/$env:CLASSROOM_ID/windows.ps1"
          $windowsScriptPath = Join-Path $workspace 'windows.ps1'

          Invoke-WebRequest -Uri $windowsScriptUrl -Headers $headers -OutFile $windowsScriptPath
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $windowsScriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "windows.ps1 exited with code $LASTEXITCODE"
          }

      - name: Force installed Windows client self-update
        shell: pwsh
        env:
          EXPECTED_AGENT_VERSION: ${{ steps.provision.outputs.bootstrap_manifest_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:EXPECTED_AGENT_VERSION) {
            throw 'Provisioning helper did not expose bootstrap_manifest_version'
          }

          $openPathRoot = 'C:\OpenPath'
          $configPath = Join-Path $openPathRoot 'data\config.json'
          if (-not (Test-Path $configPath)) {
            throw 'Installed Windows client config.json was not found'
          }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $installedVersion = [string]$config.version
          if (-not $installedVersion) {
            throw 'Installed Windows client config did not include a version'
          }

          $config.version = '0.0.0'
          if ($config.PSObject.Properties['lastAgentUpdateAt']) {
            $config.lastAgentUpdateAt = ''
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path $configPath -Encoding UTF8

          $updateLogPath = Join-Path $env:RUNNER_TEMP 'windows-client-self-update.log'
          Remove-Item $updateLogPath -ErrorAction SilentlyContinue

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $openPathRoot 'OpenPath.ps1') self-update --silent *>&1 |
            Tee-Object -FilePath $updateLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "OpenPath.ps1 self-update --silent exited with code $LASTEXITCODE"
          }

          $updatedConfig = Get-Content $configPath -Raw | ConvertFrom-Json
          if ([string]$updatedConfig.version -ne $env:EXPECTED_AGENT_VERSION) {
            throw "Windows self-update left version $($updatedConfig.version), expected $env:EXPECTED_AGENT_VERSION"
          }

          if (-not $updatedConfig.PSObject.Properties['lastAgentUpdateAt'] -or -not $updatedConfig.lastAgentUpdateAt) {
            throw 'Windows self-update did not record lastAgentUpdateAt'
          }

          $agentUpdateTask = Get-ScheduledTask -TaskName 'OpenPath-AgentUpdate' -ErrorAction SilentlyContinue
          if (-not $agentUpdateTask) {
            throw 'OpenPath-AgentUpdate scheduled task was not installed'
          }

          Write-Host "Windows client self-update restored $installedVersion via manifest version $env:EXPECTED_AGENT_VERSION"
          $openPathStatus = @{
            previousVersion = $installedVersion
            currentVersion = [string]$updatedConfig.version
            lastAgentUpdateAt = [string]$updatedConfig.lastAgentUpdateAt
            scheduledTasks = @(Get-ScheduledTask -TaskName 'OpenPath-*' -ErrorAction SilentlyContinue | ForEach-Object { $_.TaskName })
            services = @(Get-Service -Name 'AcrylicDNSProxySvc' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Status)" })
          }
          $openPathStatusJson = ConvertTo-Json -Compress -Depth 6 -InputObject $openPathStatus
          "OPENPATH_STATUS_JSON=$openPathStatusJson" >> $env:GITHUB_ENV

      - name: Record Windows runner health after OpenPath update
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-runner-health-evidence.mjs \
            --artifact production-windows-runner-health.json \
            --phase post-install \
            --openpath-status-json "${OPENPATH_STATUS_JSON:-{}}" \
            --target-url "$PRODUCTION_BASE_URL"

      - name: Verify Windows AJAX auto-allow canary
        shell: pwsh
        env:
          WINDOWS_AJAX_AUTO_ALLOW_CANARY_GROUP_ID: ${{ steps.provision.outputs.group_id }}
          WINDOWS_AJAX_AUTO_ALLOW_CANARY_ADMIN_TOKEN: ${{ env.PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN }}
          WINDOWS_AJAX_AUTO_ALLOW_CANARY_API_URL: ${{ env.PRODUCTION_BASE_URL }}
          WINDOWS_AJAX_AUTO_ALLOW_FIREFOX_MODE: selenium
          EXPECTED_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/windows-ajax-auto-allow-canary.mjs

      - name: Summarize Windows AJAX auto-allow evidence
        id: ajax-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/summarize-windows-ajax-auto-allow-evidence.mjs \
            --artifact production-windows-ajax-auto-allow-canary.json

      - name: Write Windows client canary evidence
        if: always()
        id: evidence
        shell: bash
        env:
          CLIENT_CANARY_PLATFORM: windows
          CLIENT_CANARY_JOB_STATUS: ${{ job.status }}
          CLIENT_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
          CLIENT_CANARY_LIVE_STEPS_EXECUTED: true
          CLIENT_CANARY_API_URL: ${{ steps.provision.outputs.api_url }}
          CLIENT_CANARY_CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          CLIENT_CANARY_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          CLIENT_CANARY_EXTENSION_VERSION: ${{ steps.provision.outputs.extension_version }}
          CLIENT_CANARY_BOOTSTRAP_MANIFEST_VERSION: ${{ steps.provision.outputs.bootstrap_manifest_version }}
          CLIENT_CANARY_EVIDENCE_PATH: production-client-canary-evidence-windows.json
        run: node scripts/write-production-client-canary-evidence.mjs

      - name: Ensure Windows self-update artifact files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'production-windows-ajax-auto-allow-canary.json')) {
            $ajaxFallbackEvidence = [ordered]@{
              success = $false
              failureBoundary = [ordered]@{
                id = 'blocked-page-unblock-request'
                message = 'Windows AJAX auto-allow canary did not create evidence before artifact upload.'
                recommendedNextAction = 'Inspect the Windows client self-update log and rerun the Windows AJAX canary.'
              }
              diagnosticPhases = @(
                [ordered]@{
                  id = 'artifact-written'
                  status = 'failure'
                  evidence = [ordered]@{
                    artifactWritten = $false
                  }
                }
              )
            }
            $ajaxFallbackEvidence |
              ConvertTo-Json -Depth 10 |
              Set-Content -Path 'production-windows-ajax-auto-allow-canary.json' -Encoding UTF8
          }

          foreach ($requiredPath in @(
            'production-windows-bootstrap-canary.json',
            'production-client-canary-evidence-windows.json',
            'production-windows-ajax-auto-allow-canary.json',
            'production-windows-runner-health.json'
          )) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required Windows canary artifact was not created: $requiredPath"
            }
          }

          $logPath = Join-Path $env:RUNNER_TEMP 'windows-client-self-update.log'
          if (-not (Test-Path $logPath)) {
            'Windows self-update log was not created before artifact upload.' |
              Set-Content -Path $logPath -Encoding UTF8
          }

          $archivePath = 'production-windows-client-self-update-canary.zip'
          if (Test-Path $archivePath) {
            Remove-Item -Path $archivePath -Force
          }

          Compress-Archive -Path @(
            'production-windows-bootstrap-canary.json',
            'production-client-canary-evidence-windows.json',
            'production-windows-ajax-auto-allow-canary.json',
            'production-windows-runner-health.json',
            $logPath
          ) -DestinationPath $archivePath -Force

          if (-not (Test-Path $archivePath)) {
            throw "Required Windows canary artifact archive was not created: $archivePath"
          }

      - name: Restore Windows runner DNS before artifact upload
        if: always()
        continue-on-error: true
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Record Windows runner health before artifact upload
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          $artifactProbe = Test-NetConnection pipelines.actions.githubusercontent.com -Port 443 -WarningAction SilentlyContinue
          $artifactReachable = ($artifactProbe.NameResolutionSucceeded -and $artifactProbe.TcpTestSucceeded).ToString().ToLowerInvariant()
          node scripts/write-runner-health-evidence.mjs `
            --artifact production-windows-runner-health.json `
            --phase pre-upload `
            --dns-servers-json "$runnerDnsServersJson" `
            --artifact-endpoint-reachable "$artifactReachable" `
            --failure-boundary-id "windows-client-self-update" `
            --failure-boundary-message "Windows client self-update canary reached artifact upload." `
            --target-url "$env:PRODUCTION_BASE_URL"

      - name: Upload Windows self-update artifacts
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: production-windows-client-self-update-canary
          path: |
            production-windows-client-self-update-canary.zip
            production-windows-runner-health.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  linux-client-self-update-canary:
    name: Linux Client Self-Update Canary
    needs: [ci-signal-policy]
    if: >-
      needs.ci-signal-policy.outputs.should_skip != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target_platform != 'download' &&
      github.event.inputs.target_platform != 'windows'
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 35
    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.production_base_url || vars.PRODUCTION_PUBLIC_URL || secrets.PRODUCTION_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Reset persistent Linux canary state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          restore_linux_canary_external_dns() {
            if command -v resolvectl >/dev/null 2>&1 && systemctl is-active --quiet systemd-resolved; then
              default_interface="$(ip route show default 2>/dev/null | awk '{print $5; exit}')"
              if [ -n "$default_interface" ]; then
                sudo resolvectl dns "$default_interface" 1.1.1.1 8.8.8.8 || true
              fi
              sudo resolvectl flush-caches || true
            else
              printf '%s\n' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf >/dev/null || true
            fi
          }

          sudo systemctl stop openpath-sse-listener || true
          sudo systemctl stop captive-portal-detector || true
          sudo systemctl stop openpath-agent-update.timer || true
          sudo systemctl stop openpath-dnsmasq.timer || true
          sudo systemctl stop dnsmasq-watchdog.timer || true
          sudo systemctl stop dnsmasq || true
          sudo systemctl reset-failed dnsmasq || true

          if [ -x /usr/local/lib/openpath/uninstall.sh ]; then
            sudo /usr/local/lib/openpath/uninstall.sh --auto-yes || true
          elif command -v openpath >/dev/null 2>&1; then
            sudo openpath disable || true
          fi

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get purge -y openpath-dnsmasq || true

          sudo rm -rf \
            "/usr/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384}/monitor-bloqueos@openpath" \
            "/usr/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384}/monitor-bloqueos@whitelist-system" \
            /usr/share/openpath/firefox-release \
            /var/lib/openpath \
            /etc/openpath \
            /usr/local/lib/openpath || true
          sudo rm -f \
            /etc/firefox/policies/policies.json \
            /usr/lib/mozilla/native-messaging-hosts/whitelist_native_host.json \
            /etc/chromium/native-messaging-hosts/openpath_native_host.json \
            /etc/opt/chrome/native-messaging-hosts/openpath_native_host.json \
            /etc/opt/edge/native-messaging-hosts/openpath_native_host.json || true
          sudo rm -f \
            /etc/systemd/system/dnsmasq.service.d/openpath-override.conf \
            /etc/systemd/system/dnsmasq.service.d/whitelist-override.conf \
            /etc/dnsmasq.d/openpath.conf \
            /etc/tmpfiles.d/openpath-dnsmasq.conf || true
          sudo rmdir /etc/systemd/system/dnsmasq.service.d 2>/dev/null || true
          sudo systemctl daemon-reload || true
          sudo systemctl reset-failed dnsmasq || true

          restore_linux_canary_external_dns

      - name: Verify Linux runner DNS before enrollment
        shell: bash
        run: |
          set -euo pipefail

          restore_linux_canary_external_dns() {
            if command -v resolvectl >/dev/null 2>&1 && systemctl is-active --quiet systemd-resolved; then
              default_interface="$(ip route show default 2>/dev/null | awk '{print $5; exit}')"
              if [ -n "$default_interface" ]; then
                sudo resolvectl dns "$default_interface" 1.1.1.1 8.8.8.8 || true
              fi
              sudo resolvectl flush-caches || true
            else
              printf '%s\n' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf >/dev/null || true
            fi
          }

          if ! getent hosts raw.githubusercontent.com >/dev/null 2>&1; then
            restore_linux_canary_external_dns
            sleep 2
          fi

          if ! getent hosts raw.githubusercontent.com >/dev/null 2>&1; then
            echo "::error::Linux canary runner DNS is not healthy before enrollment"
            echo "--- /etc/resolv.conf ---"
            cat /etc/resolv.conf || true
            echo "--- dnsmasq service status ---"
            sudo systemctl status dnsmasq --no-pager || true
            echo "--- systemd-resolved status ---"
            sudo systemctl status systemd-resolved --no-pager || true
            exit 1
          fi

      - name: Install Linux Firefox canary dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production canaries" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production canaries" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-release

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment canary
        id: provision
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ env.PRODUCTION_BASE_URL }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download and run live Linux enrollment script
        env:
          CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision.outputs.enrollment_token }}
        run: |
          set -euo pipefail

          workspace="$RUNNER_TEMP/linux-client-self-update-canary"
          mkdir -p "$workspace"
          enroll_script="$workspace/enroll.sh"
          download_headers="$RUNNER_TEMP/linux-client-enrollment-download.headers"
          download_body="$RUNNER_TEMP/linux-client-enrollment-download.body"
          download_meta="$RUNNER_TEMP/linux-client-enrollment-download.json"
          enrollment_log="$RUNNER_TEMP/linux-client-enrollment.log"
          : > "$enrollment_log"

          collect_linux_dnsmasq_diagnostics() {
            local reason="${1:-unknown}"
            set +e
            {
              echo "===== Linux dnsmasq diagnostics: $reason ====="
              date -u
              echo "--- /etc/resolv.conf ---"
              cat /etc/resolv.conf
              echo "--- /run/dnsmasq/resolv.conf ---"
              sudo cat /run/dnsmasq/resolv.conf
              echo "--- /etc/dnsmasq.d ---"
              sudo find /etc/dnsmasq.d -maxdepth 1 -type f -print -exec sed -n '1,220p' {} \;
              echo "--- dnsmasq service status ---"
              sudo systemctl status dnsmasq --no-pager
              echo "--- dnsmasq journal ---"
              sudo journalctl -u dnsmasq -n 120 --no-pager
              echo "--- dnsmasq config test ---"
              sudo dnsmasq --test
              echo "--- port 53 sockets ---"
              sudo ss -tulpn | grep ':53 ' || true
            } 2>&1 | tee -a "$enrollment_log"
            set -e
          }

          http_status="$(
            curl -sS -L \
              -D "$download_headers" \
              -o "$download_body" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $ENROLLMENT_TOKEN" \
              "$PRODUCTION_BASE_URL/api/enroll/$CLASSROOM_ID"
          )"

          node -e '
            const fs = require("node:fs");
            const [status, headersPath, bodyPath, outputPath] = process.argv.slice(1);
            const headers = fs.existsSync(headersPath) ? fs.readFileSync(headersPath, "utf8") : "";
            const body = fs.existsSync(bodyPath) ? fs.readFileSync(bodyPath, "utf8") : "";
            fs.writeFileSync(outputPath, `${JSON.stringify({
              status: Number(status),
              headers,
              bodyPreview: body.slice(0, 4000)
            }, null, 2)}\n`);
          ' "$http_status" "$download_headers" "$download_body" "$download_meta"

          if [ "$http_status" != "200" ]; then
            echo "::error::Linux enrollment script download returned HTTP $http_status"
            cat "$download_meta"
            exit 1
          fi

          cp "$download_body" "$enroll_script"
          chmod 700 "$enroll_script"

          enrollment_status=1
          for attempt in 1 2 3; do
            echo "===== Linux enrollment attempt $attempt =====" | tee -a "$enrollment_log"
            if sudo timeout --kill-after=30s 10m bash "$enroll_script" 2>&1 | tee -a "$enrollment_log"; then
              enrollment_status=0
              break
            else
              enrollment_status="${PIPESTATUS[0]}"
            fi

            echo "::warning::Linux enrollment attempt $attempt failed with status $enrollment_status"
            collect_linux_dnsmasq_diagnostics "attempt $attempt failed with status $enrollment_status"
            if [ "$attempt" != "3" ]; then
              sleep "$((attempt * 10))"
            fi
          done

          if [ "$enrollment_status" -ne 0 ]; then
            exit "$enrollment_status"
          fi

      - name: Verify Linux Firefox blocked page canary
        shell: bash
        env:
          EXPECTED_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_URL: https://www.mozilla.org/
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_OUTPUT: production-linux-firefox-block-page-canary.json
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_DIAGNOSTICS_DIR: ${{ runner.temp }}/linux-firefox-block-page-canary
        run: |
          set -euo pipefail

          block_page_log="$RUNNER_TEMP/linux-firefox-block-page-canary.log"
          : > "$block_page_log"

          set +e
          timeout --kill-after=30s 3m node scripts/linux-firefox-block-page-canary.mjs 2>&1 | tee "$block_page_log"
          canary_status="${PIPESTATUS[0]}"
          set -e

          if [ "$canary_status" -ne 0 ]; then
            if [ "$canary_status" -eq 124 ] || [ "$canary_status" -eq 137 ]; then
              printf '%s\n' '{"status":"failed","error":"Linux Firefox blocked-page canary timed out"}' > production-linux-firefox-block-page-canary.json
              echo "::error title=Linux Firefox blocked-page canary::Timed out after 3 minutes"
            fi
            exit "$canary_status"
          fi

      - name: Force installed Linux client self-update
        run: |
          set -euo pipefail

          if [ ! -x /usr/local/bin/openpath-agent-update.sh ]; then
            echo "::error::Installed Linux client update wrapper is missing"
            exit 1
          fi

          if [ ! -r /usr/local/lib/openpath/VERSION ]; then
            echo "::error::Installed Linux client VERSION file is missing"
            exit 1
          fi

          expected_version="$(tr -d '\r\n' < /usr/local/lib/openpath/VERSION)"
          if [ -z "$expected_version" ]; then
            echo "::error::Installed Linux client VERSION is empty"
            exit 1
          fi

          update_log="$RUNNER_TEMP/linux-client-self-update.log"
          sudo /usr/local/bin/openpath-agent-update.sh --force | tee "$update_log"

          actual_version="$(tr -d '\r\n' < /usr/local/lib/openpath/VERSION)"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::Linux self-update left version $actual_version, expected $expected_version"
            exit 1
          fi

          if ! systemctl list-timers --all openpath-agent-update.timer >/dev/null 2>&1; then
            echo "::error::openpath-agent-update.timer was not installed"
            exit 1
          fi

          if [ ! -s /var/lib/openpath/agent-update-state.json ]; then
            echo "::error::Linux self-update did not write agent-update-state.json"
            exit 1
          fi

          echo "Linux client self-update force-verified version $actual_version"

      - name: Write Linux client canary evidence
        if: always()
        id: evidence
        env:
          CLIENT_CANARY_PLATFORM: linux
          CLIENT_CANARY_JOB_STATUS: ${{ job.status }}
          CLIENT_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
          CLIENT_CANARY_LIVE_STEPS_EXECUTED: true
          CLIENT_CANARY_API_URL: ${{ steps.provision.outputs.api_url }}
          CLIENT_CANARY_CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          CLIENT_CANARY_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          CLIENT_CANARY_EXTENSION_VERSION: ${{ steps.provision.outputs.extension_version }}
          CLIENT_CANARY_BOOTSTRAP_MANIFEST_VERSION: ${{ steps.provision.outputs.bootstrap_manifest_version }}
          CLIENT_CANARY_EVIDENCE_PATH: production-client-canary-evidence-linux.json
        run: node scripts/write-production-client-canary-evidence.mjs

      - name: Ensure Linux self-update artifact files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for required_path in \
            production-windows-bootstrap-canary.json \
            production-client-canary-evidence-linux.json
          do
            if [ ! -f "$required_path" ]; then
              echo "::error::Required Linux canary artifact was not created: $required_path"
              exit 1
            fi
          done

          log_path="$RUNNER_TEMP/linux-client-self-update.log"
          if [ ! -f "$log_path" ]; then
            printf '%s\n' 'Linux self-update log was not created before artifact upload.' > "$log_path"
          fi

          enrollment_log_path="$RUNNER_TEMP/linux-client-enrollment.log"
          if [ ! -f "$enrollment_log_path" ]; then
            printf '%s\n' 'Linux enrollment log was not created before artifact upload.' > "$enrollment_log_path"
          fi

          enrollment_download_meta_path="$RUNNER_TEMP/linux-client-enrollment-download.json"
          if [ ! -f "$enrollment_download_meta_path" ]; then
            printf '%s\n' '{"status":null,"headers":"","bodyPreview":"Linux enrollment download diagnostics were not created before artifact upload."}' > "$enrollment_download_meta_path"
          fi

          enrollment_download_headers_path="$RUNNER_TEMP/linux-client-enrollment-download.headers"
          if [ ! -f "$enrollment_download_headers_path" ]; then
            printf '%s\n' 'Linux enrollment download headers were not created before artifact upload.' > "$enrollment_download_headers_path"
          fi

          enrollment_download_body_path="$RUNNER_TEMP/linux-client-enrollment-download.body"
          if [ ! -f "$enrollment_download_body_path" ]; then
            printf '%s\n' 'Linux enrollment download body was not created before artifact upload.' > "$enrollment_download_body_path"
          fi

          block_page_log_path="$RUNNER_TEMP/linux-firefox-block-page-canary.log"
          if [ ! -f "$block_page_log_path" ]; then
            printf '%s\n' 'Linux Firefox blocked-page canary log was not created before artifact upload.' > "$block_page_log_path"
          fi

          diagnostics_dir="$RUNNER_TEMP/linux-firefox-block-page-canary"
          mkdir -p "$diagnostics_dir"

          if [ ! -f production-linux-firefox-block-page-canary.json ]; then
            printf '%s\n' '{"status":"failed","error":"Linux Firefox blocked-page canary did not create evidence before artifact upload"}' > production-linux-firefox-block-page-canary.json
          fi

          archive_path="production-linux-client-self-update-canary.tar.gz"
          rm -f "$archive_path"
          tar -czf "$archive_path" \
            production-windows-bootstrap-canary.json \
            production-client-canary-evidence-linux.json \
            production-linux-firefox-block-page-canary.json \
            -C "$RUNNER_TEMP" \
            linux-client-enrollment.log \
            linux-client-enrollment-download.json \
            linux-client-enrollment-download.headers \
            linux-client-enrollment-download.body \
            linux-client-self-update.log \
            linux-firefox-block-page-canary.log \
            linux-firefox-block-page-canary

          if [ ! -s "$archive_path" ]; then
            echo "::error::Required Linux canary artifact archive was not created: $archive_path"
            exit 1
          fi

      - name: Restore Linux runner DNS before artifact upload
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          restore_linux_canary_external_dns() {
            if command -v resolvectl >/dev/null 2>&1 && systemctl is-active --quiet systemd-resolved; then
              default_interface="$(ip route show default 2>/dev/null | awk '{print $5; exit}')"
              if [ -n "$default_interface" ]; then
                sudo resolvectl dns "$default_interface" 1.1.1.1 8.8.8.8 || true
              fi
              sudo resolvectl flush-caches || true
            else
              printf '%s\n' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf >/dev/null || true
            fi
          }

          sudo systemctl stop openpath-sse-listener || true
          sudo systemctl stop captive-portal-detector || true
          sudo systemctl stop openpath-agent-update.timer || true
          sudo systemctl stop openpath-dnsmasq.timer || true
          sudo systemctl stop dnsmasq-watchdog.timer || true
          sudo systemctl stop dnsmasq || true
          sudo systemctl reset-failed dnsmasq || true

          if [ -x /usr/local/lib/openpath/uninstall.sh ]; then
            sudo /usr/local/lib/openpath/uninstall.sh --auto-yes || true
          fi

          if command -v openpath >/dev/null 2>&1; then
            sudo openpath disable || true
          fi

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get purge -y openpath-dnsmasq || true

          sudo rm -rf \
            "/usr/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384}/monitor-bloqueos@openpath" \
            "/usr/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384}/monitor-bloqueos@whitelist-system" \
            /usr/share/openpath/firefox-release \
            /var/lib/openpath \
            /etc/openpath \
            /usr/local/lib/openpath || true
          sudo rm -f \
            /etc/firefox/policies/policies.json \
            /usr/lib/mozilla/native-messaging-hosts/whitelist_native_host.json \
            /etc/chromium/native-messaging-hosts/openpath_native_host.json \
            /etc/opt/chrome/native-messaging-hosts/openpath_native_host.json \
            /etc/opt/edge/native-messaging-hosts/openpath_native_host.json || true
          sudo rm -f \
            /etc/systemd/system/dnsmasq.service.d/openpath-override.conf \
            /etc/systemd/system/dnsmasq.service.d/whitelist-override.conf \
            /etc/dnsmasq.d/openpath.conf \
            /etc/tmpfiles.d/openpath-dnsmasq.conf || true
          sudo rmdir /etc/systemd/system/dnsmasq.service.d 2>/dev/null || true
          sudo systemctl daemon-reload || true
          sudo systemctl reset-failed dnsmasq || true

          restore_linux_canary_external_dns

      - name: Upload Linux self-update artifacts
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: production-linux-client-self-update-canary
          path: production-linux-client-self-update-canary.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
