name: Promote Current Staging Candidate

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: promote-current-staging-candidate
  cancel-in-progress: false

jobs:
  tag-current-staging-candidate:
    name: Tag current staging candidate
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 45

    steps:
      - name: Reset OpenPath submodule checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE:-}" in
            ""|"/")
              echo "Refusing to reset OpenPath submodule checkout with unsafe GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-<empty>}" >&2
              exit 1
              ;;
          esac
          rm -rf "$GITHUB_WORKSPACE/upstream/openpath"
          rm -rf "$GITHUB_WORKSPACE/.git/modules/upstream/openpath"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Create promotion GitHub App token
        id: promotion-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLASSROOMPATH_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLASSROOMPATH_PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Prepare SSH keys
        shell: bash
        env:
          STAGING_SSH_KEY_SECRET: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY_SECRET"
          test -n "$DEPLOY_SSH_KEY_SECRET"
          install -m 700 -d "$RUNNER_TEMP/classroompath-ssh"
          printf '%s\n' "$STAGING_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/staging"
          printf '%s\n' "$DEPLOY_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/production"
          chmod 600 "$RUNNER_TEMP/classroompath-ssh/staging" "$RUNNER_TEMP/classroompath-ssh/production"
          echo "STAGING_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/staging" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/production" >> "$GITHUB_ENV"
          # The promotion scripts resolve the stage hosts from the repository
          # secrets; without these exports the wrapper falls back to the
          # placeholder staging-host.example.invalid.
          # Resolve the staging deploy host the same way the nightly candidate
          # workflow does: the LAN address is the authoritative deploy host
          # that owns /srv/classroompath/release-state.
          echo "STAGING_HOST=${{ secrets.STAGING_DEPLOY_LAN_HOST || secrets.STAGING_DEPLOY_HOST }}" >> "$GITHUB_ENV"
          echo "STAGING_USER=${{ secrets.STAGING_DEPLOY_USER }}" >> "$GITHUB_ENV"
          echo "STAGING_PORT=${{ secrets.STAGING_DEPLOY_LAN_PORT || secrets.STAGING_DEPLOY_PORT }}" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${{ secrets.DEPLOY_USER }}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${{ secrets.DEPLOY_PORT }}" >> "$GITHUB_ENV"

      - name: Export deploy target configuration
        shell: bash
        env:
          CLASSROOMPATH_STAGING_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_PUBLIC_URL }}
          CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL }}
          CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL }}
          CLASSROOMPATH_STAGING_READY_URL: ${{ vars.CLASSROOMPATH_STAGING_READY_URL }}
          CLASSROOMPATH_STAGING_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_API_HEALTH_URL }}
          CLASSROOMPATH_STAGING_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_STAGING_API_CONFIG_URL }}
          CLASSROOMPATH_STAGING_CONTAINER_PLATFORM: ${{ vars.CLASSROOMPATH_STAGING_CONTAINER_PLATFORM }}
          CLASSROOMPATH_PRODUCTION_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL }}
          CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL }}
          CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL }}
          CLASSROOMPATH_PRODUCTION_READY_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_READY_URL }}
          CLASSROOMPATH_PRODUCTION_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_HEALTH_URL }}
          CLASSROOMPATH_PRODUCTION_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_CONFIG_URL }}
        run: |
          set -euo pipefail
          # The promotion orchestrator resolves deploy targets from the
          # CLASSROOMPATH_<ENV>_<FIELD> environment overrides; map the public
          # repository variables so CI does not fall back to the .invalid
          # placeholders in config/deploy-targets.json.
          for name in \
            CLASSROOMPATH_STAGING_PUBLIC_URL \
            CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL \
            CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL \
            CLASSROOMPATH_STAGING_READY_URL \
            CLASSROOMPATH_STAGING_API_HEALTH_URL \
            CLASSROOMPATH_STAGING_API_CONFIG_URL \
            CLASSROOMPATH_STAGING_CONTAINER_PLATFORM \
            CLASSROOMPATH_PRODUCTION_PUBLIC_URL \
            CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL \
            CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL \
            CLASSROOMPATH_PRODUCTION_READY_URL \
            CLASSROOMPATH_PRODUCTION_API_HEALTH_URL \
            CLASSROOMPATH_PRODUCTION_API_CONFIG_URL; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Ensure GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: 2.83.0
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              gh_arch="amd64"
              ;;
            aarch64|arm64)
              gh_arch="arm64"
              ;;
            *)
              echo "Unsupported GitHub CLI architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          gh_dir="$RUNNER_TEMP/gh-cli"
          rm -rf "$gh_dir"
          mkdir -p "$gh_dir"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_${gh_arch}.tar.gz" \
            -o "$gh_dir/gh.tar.gz"
          tar -xzf "$gh_dir/gh.tar.gz" -C "$gh_dir" --strip-components=1
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve and delegate current staging candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_TAG_PUSH_TOKEN: ${{ steps.promotion-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The compatibility wrapper resolves only the current staging RC;
          # release:promote owns all readiness, approval, tag, and deploy steps.
          bash scripts/promote-current-staging-candidate.sh
