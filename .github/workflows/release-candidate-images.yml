name: Release Candidate Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

concurrency:
  group: release-candidate-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  derive-release-image-refs:
    name: Derive Release Image Refs
    runs-on: ubuntu-latest
    needs:
      - detect-release-candidate-components
      - resolve-previous-release-candidate-manifest
    outputs:
      repository_owner: ${{ steps.image-refs.outputs.repository_owner }}
      gateway_repo: ${{ steps.image-refs.outputs.gateway_repo }}
      migrations_repo: ${{ steps.image-refs.outputs.migrations_repo }}
      openpath_firefox_assets_repo: ${{ steps.image-refs.outputs.openpath_firefox_assets_repo }}
      openpath_api_repo: ${{ steps.image-refs.outputs.openpath_api_repo }}
      spa_repo: ${{ steps.image-refs.outputs.spa_repo }}
      verifier_repo: ${{ steps.image-refs.outputs.verifier_repo }}
      openpath_sha: ${{ steps.openpath.outputs.sha }}
      openpath_version: ${{ steps.linux-agent.outputs.openpath_version }}
      openpath_linux_agent_version: ${{ steps.linux-agent.outputs.version }}
      openpath_linux_agent_apt_suite: ${{ steps.linux-agent.outputs.apt_suite }}
      gateway_tag: ${{ steps.image-refs.outputs.gateway_tag }}
      migrations_tag: ${{ steps.image-refs.outputs.migrations_tag }}
      openpath_firefox_assets_tag: ${{ steps.image-refs.outputs.openpath_firefox_assets_tag }}
      openpath_api_tag: ${{ steps.image-refs.outputs.openpath_api_tag }}
      spa_tag: ${{ steps.image-refs.outputs.spa_tag }}
      verifier_tag: ${{ steps.image-refs.outputs.verifier_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Derive release image refs
        id: image-refs
        run: |
          node scripts/release-images.mjs outputs \
            --sha "${{ github.sha }}" \
            --owner "${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenPath SHA
        id: openpath
        run: |
          echo "sha=$(git rev-parse HEAD:upstream/openpath)" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenPath Linux agent version
        id: linux-agent
        env:
          OPENPATH_LINUX_AGENT_REQUIRED: ${{ needs.detect-release-candidate-components.outputs.openpath_linux_agent_required }}
          PREVIOUS_OPENPATH_VERSION: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_version }}
          PREVIOUS_OPENPATH_LINUX_AGENT_VERSION: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_linux_agent_version }}
          PREVIOUS_OPENPATH_LINUX_AGENT_APT_SUITE: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_linux_agent_apt_suite }}
        run: |
          set -euo pipefail
          if [ "$OPENPATH_LINUX_AGENT_REQUIRED" != 'true' ]; then
            echo "OpenPath Linux agent promotion contract not required; reusing previous metadata when available."
            {
              echo "openpath_version=$PREVIOUS_OPENPATH_VERSION"
              echo "version=$PREVIOUS_OPENPATH_LINUX_AGENT_VERSION"
              echo "apt_suite=$PREVIOUS_OPENPATH_LINUX_AGENT_APT_SUITE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/resolve-openpath-linux-agent-version.mjs \
            --openpath-dir upstream/openpath >> "$GITHUB_OUTPUT"

  verify-openpath-prerelease-apt:
    name: Verify OpenPath Prerelease APT
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - detect-release-candidate-components

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Fetch release candidate diff base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/fetch-release-candidate-diff-base.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Wait for OpenPath prerelease APT publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENPATH_SHA: ${{ needs.derive-release-image-refs.outputs.openpath_sha }}
          OPENPATH_REQUIRED_CHECKS: Publish Prerelease to APT Repository / Publish to APT Repository (unstable)
          OPENPATH_PRERELEASE_RECOVERY_MODE: rerun-failed-once
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_linux_agent_required }}" != 'true' ]; then
            echo "OpenPath Linux agent promotion contract not required; skipping prerelease APT wait."
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -n "$before_sha" ] \
            && [ "$before_sha" != "0000000000000000000000000000000000000000" ] \
            && git diff --quiet "$before_sha" "${{ github.sha }}" -- upstream/openpath; then
            echo "OpenPath submodule unchanged; skipping prerelease APT wait."
            exit 0
          fi

          OPENPATH_REQUIRED_CHECKS_TIMEOUT_SECONDS=2400 \
          OPENPATH_REQUIRED_CHECKS_INTERVAL_SECONDS=10 \
          OPENPATH_REQUIRED_CHECKS_FAIL_FAST=true \
            node scripts/openpath-required-checks.mjs wait

      - name: Verify OpenPath Linux agent APT installability
        env:
          OPENPATH_LINUX_AGENT_VERSION: ${{ needs.derive-release-image-refs.outputs.openpath_linux_agent_version }}
          OPENPATH_LINUX_AGENT_APT_SUITE: ${{ needs.derive-release-image-refs.outputs.openpath_linux_agent_apt_suite }}
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_linux_agent_required }}" != 'true' ]; then
            echo "OpenPath Linux agent promotion contract not required; skipping installability probe."
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -n "$before_sha" ] \
            && [ "$before_sha" != "0000000000000000000000000000000000000000" ] \
            && git diff --quiet "$before_sha" "${{ github.sha }}" -- upstream/openpath; then
            echo "OpenPath submodule unchanged; skipping installability probe."
            exit 0
          fi

          node scripts/resolve-openpath-linux-agent-version.mjs verify-runtime-pin
          node scripts/resolve-openpath-linux-agent-version.mjs install-probe-script \
            | docker run --rm -i ubuntu:24.04 bash

  resolve-previous-release-candidate-manifest:
    name: Resolve Previous Release Candidate Manifest
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.export.outputs.available }}
      gateway_image: ${{ steps.export.outputs.gateway_image }}
      migrations_image: ${{ steps.export.outputs.migrations_image }}
      openpath_firefox_assets_image: ${{ steps.export.outputs.openpath_firefox_assets_image }}
      openpath_api_image: ${{ steps.export.outputs.openpath_api_image }}
      openpath_version: ${{ steps.export.outputs.openpath_version }}
      openpath_linux_agent_version: ${{ steps.export.outputs.linux_agent_version }}
      openpath_linux_agent_apt_suite: ${{ steps.export.outputs.linux_agent_apt_suite }}
      spa_image: ${{ steps.export.outputs.spa_image }}
      verifier_image: ${{ steps.export.outputs.verifier_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Resolve previous release candidate manifest
        id: resolve
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/resolve-latest-verifier-image.mjs > previous-release-candidate-images.env

      - name: Export previous release candidate manifest
        id: export
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.resolve.outcome }}" != 'success' ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'available=true' >> "$GITHUB_OUTPUT"
          cat previous-release-candidate-images.env >> "$GITHUB_OUTPUT"

  detect-release-candidate-components:
    name: Detect Release Candidate Components
    runs-on: ubuntu-latest
    outputs:
      gateway_changed: ${{ steps.detect.outputs.gateway_changed }}
      migrations_changed: ${{ steps.detect.outputs.migrations_changed }}
      openpath_firefox_assets_changed: ${{ steps.detect.outputs.openpath_firefox_assets_changed }}
      openpath_api_changed: ${{ steps.detect.outputs.openpath_api_changed }}
      openpath_linux_agent_required: ${{ steps.detect.outputs.openpath_linux_agent_required }}
      spa_changed: ${{ steps.detect.outputs.spa_changed }}
      verifier_changed: ${{ steps.detect.outputs.verifier_changed }}
      manifest_only: ${{ steps.detect.outputs.manifest_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Fetch release candidate diff base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/fetch-release-candidate-diff-base.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Detect changed release-candidate components
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/detect-release-candidate-components.sh "$BASE_SHA" "$HEAD_SHA"

  build-gateway-release-candidate:
    name: Build Gateway Release Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      display_name: Gateway Release Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.gateway_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: .
      file: docker/Dockerfile.cp-api
      image_repo: ${{ needs.derive-release-image-refs.outputs.gateway_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.gateway_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.gateway_image }}
      output_name: gateway_image
      amd64_cache_scope: release-candidate-gateway-amd64
      arm64_cache_scope: release-candidate-gateway-arm64
      checkout_submodules: true
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  build-migrations-release-candidate:
    name: Build Migrations Release Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      display_name: Migrations Release Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.migrations_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: .
      file: docker/Dockerfile.migrations
      image_repo: ${{ needs.derive-release-image-refs.outputs.migrations_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.migrations_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.migrations_image }}
      output_name: migrations_image
      amd64_cache_scope: release-candidate-migrations-amd64
      arm64_cache_scope: release-candidate-migrations-arm64
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  resolve-openpath-firefox-release-assets:
    name: Resolve OpenPath Firefox Release Assets
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/firefox-release-assets.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      build_required: ${{ needs.detect-release-candidate-components.outputs.openpath_firefox_assets_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      artifact_name: openpath-firefox-release-assets-${{ needs.derive-release-image-refs.outputs.openpath_sha }}
    secrets: inherit

  build-openpath-firefox-assets-release-candidate:
    name: Build OpenPath Firefox Assets Release Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - resolve-openpath-firefox-release-assets
    with:
      display_name: OpenPath Firefox Assets Release Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.openpath_firefox_assets_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: .
      file: docker/Dockerfile.openpath-firefox-assets
      image_repo: ${{ needs.derive-release-image-refs.outputs.openpath_firefox_assets_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.openpath_firefox_assets_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_firefox_assets_image }}
      output_name: openpath_firefox_assets_image
      amd64_cache_scope: release-candidate-openpath-firefox-assets-amd64
      arm64_cache_scope: release-candidate-openpath-firefox-assets-arm64
      artifact_name: openpath-firefox-release-assets-${{ needs.derive-release-image-refs.outputs.openpath_sha }}
      artifact_path: ./upstream/openpath/firefox-extension
      verify_paths: |
        ./upstream/openpath/firefox-extension/build/firefox-release/metadata.json
        ./upstream/openpath/firefox-extension/build/firefox-release/openpath-firefox-extension.xpi
      checkout_submodules: true
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  build-openpath-api-release-candidate:
    name: Build OpenPath API Release Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      display_name: OpenPath API Release Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.openpath_api_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: ./upstream/openpath
      file: ./docker/Dockerfile.api
      image_repo: ${{ needs.derive-release-image-refs.outputs.openpath_api_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.openpath_api_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_api_image }}
      output_name: openpath_api_image
      amd64_cache_scope: release-candidate-openpath-api-amd64
      arm64_cache_scope: release-candidate-openpath-api-arm64
      openpath_sha: ${{ needs.derive-release-image-refs.outputs.openpath_sha }}
      checkout_submodules: true
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  build-spa-release-candidate:
    name: Build SPA Release Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      display_name: SPA Release Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.spa_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: .
      file: docker/Dockerfile.spa
      image_repo: ${{ needs.derive-release-image-refs.outputs.spa_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.spa_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.spa_image }}
      output_name: spa_image
      amd64_cache_scope: release-candidate-spa-amd64
      arm64_cache_scope: release-candidate-spa-arm64
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  build-verifier-release-candidate:
    name: Build Release Verifier Candidate
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    uses: ./.github/workflows/reusable-release-candidate-image-family.yml
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    with:
      display_name: Release Verifier Candidate
      build_required: ${{ needs.detect-release-candidate-components.outputs.verifier_changed == 'true' || needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' }}
      context: .
      file: docker/Dockerfile.release-verifier
      image_repo: ${{ needs.derive-release-image-refs.outputs.verifier_repo }}
      tag: ${{ needs.derive-release-image-refs.outputs.verifier_tag }}
      previous_image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.verifier_image }}
      output_name: verifier_image
      amd64_cache_scope: release-candidate-verifier-amd64
      arm64_cache_scope: release-candidate-verifier-arm64
    secrets:
      ghcr_password: ${{ secrets.GITHUB_TOKEN }}

  publish-release-candidate-manifest:
    name: Publish Release Candidate Manifest
    runs-on: ubuntu-latest
    if: ${{ needs.resolve-previous-release-candidate-manifest.outputs.available != 'true' || needs.detect-release-candidate-components.outputs.manifest_only != 'true' }}
    needs:
      - derive-release-image-refs
      - verify-openpath-prerelease-apt
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - resolve-openpath-firefox-release-assets
      - build-gateway-release-candidate
      - build-migrations-release-candidate
      - build-openpath-firefox-assets-release-candidate
      - build-openpath-api-release-candidate
      - build-spa-release-candidate
      - build-verifier-release-candidate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Persist release candidate image manifest
        run: |
          cat > release-candidate-images.env <<EOF
          APP_SHA=${{ github.sha }}
          CLASSROOMPATH_GATEWAY_IMAGE=${{ needs.build-gateway-release-candidate.outputs.image }}
          CLASSROOMPATH_MIGRATIONS_IMAGE=${{ needs.build-migrations-release-candidate.outputs.image }}
          OPENPATH_FIREFOX_ASSETS_IMAGE=${{ needs.build-openpath-firefox-assets-release-candidate.outputs.image }}
          OPENPATH_API_IMAGE=${{ needs.build-openpath-api-release-candidate.outputs.image }}
          OPENPATH_VERSION=${{ needs.derive-release-image-refs.outputs.openpath_version || needs.resolve-previous-release-candidate-manifest.outputs.openpath_version }}
          OPENPATH_LINUX_AGENT_VERSION=${{ needs.derive-release-image-refs.outputs.openpath_linux_agent_version || needs.resolve-previous-release-candidate-manifest.outputs.openpath_linux_agent_version }}
          OPENPATH_LINUX_AGENT_APT_SUITE=${{ needs.derive-release-image-refs.outputs.openpath_linux_agent_apt_suite || needs.resolve-previous-release-candidate-manifest.outputs.openpath_linux_agent_apt_suite }}
          CLASSROOMPATH_SPA_IMAGE=${{ needs.build-spa-release-candidate.outputs.image }}
          CLASSROOMPATH_VERIFIER_IMAGE=${{ needs.build-verifier-release-candidate.outputs.image }}
          EOF

      - name: Upload release candidate image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-images-${{ github.sha }}
          path: release-candidate-images.env
          retention-days: 7

      - name: Persist release candidate timing summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-candidate-timings.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "families": {
              "gateway": {
                "displayName": "Gateway",
                "buildRequired": ${{ needs.build-gateway-release-candidate.outputs.build_required }},
                "amd64DurationSeconds": ${{ needs.build-gateway-release-candidate.outputs.amd64_duration_seconds || 0 }},
                "arm64DurationSeconds": ${{ needs.build-gateway-release-candidate.outputs.arm64_duration_seconds || 0 }},
                "amd64ExecutionSeconds": ${{ needs.build-gateway-release-candidate.outputs.amd64_execution_seconds || 0 }},
                "arm64ExecutionSeconds": ${{ needs.build-gateway-release-candidate.outputs.arm64_execution_seconds || 0 }},
                "amd64QueueSeconds": ${{ needs.build-gateway-release-candidate.outputs.amd64_queue_seconds || 0 }},
                "arm64QueueSeconds": ${{ needs.build-gateway-release-candidate.outputs.arm64_queue_seconds || 0 }},
                "amd64CacheScope": "${{ needs.build-gateway-release-candidate.outputs.amd64_cache_scope }}",
                "arm64CacheScope": "${{ needs.build-gateway-release-candidate.outputs.arm64_cache_scope }}",
                "amd64BuildMode": "${{ needs.build-gateway-release-candidate.outputs.amd64_build_mode }}",
                "arm64BuildMode": "${{ needs.build-gateway-release-candidate.outputs.arm64_build_mode }}",
                "publishDurationSeconds": ${{ needs.build-gateway-release-candidate.outputs.publish_duration_seconds || 0 }},
                "familyDurationSeconds": ${{ needs.build-gateway-release-candidate.outputs.family_duration_seconds || 0 }}
              },
              "migrations": {
                "displayName": "Migrations",
                "buildRequired": ${{ needs.build-migrations-release-candidate.outputs.build_required }},
                "amd64DurationSeconds": ${{ needs.build-migrations-release-candidate.outputs.amd64_duration_seconds || 0 }},
                "arm64DurationSeconds": ${{ needs.build-migrations-release-candidate.outputs.arm64_duration_seconds || 0 }},
                "amd64ExecutionSeconds": ${{ needs.build-migrations-release-candidate.outputs.amd64_execution_seconds || 0 }},
                "arm64ExecutionSeconds": ${{ needs.build-migrations-release-candidate.outputs.arm64_execution_seconds || 0 }},
                "amd64QueueSeconds": ${{ needs.build-migrations-release-candidate.outputs.amd64_queue_seconds || 0 }},
                "arm64QueueSeconds": ${{ needs.build-migrations-release-candidate.outputs.arm64_queue_seconds || 0 }},
                "amd64CacheScope": "${{ needs.build-migrations-release-candidate.outputs.amd64_cache_scope }}",
                "arm64CacheScope": "${{ needs.build-migrations-release-candidate.outputs.arm64_cache_scope }}",
                "amd64BuildMode": "${{ needs.build-migrations-release-candidate.outputs.amd64_build_mode }}",
                "arm64BuildMode": "${{ needs.build-migrations-release-candidate.outputs.arm64_build_mode }}",
                "publishDurationSeconds": ${{ needs.build-migrations-release-candidate.outputs.publish_duration_seconds || 0 }},
                "familyDurationSeconds": ${{ needs.build-migrations-release-candidate.outputs.family_duration_seconds || 0 }}
              },
              "openpathFirefoxAssets": {
                "displayName": "OpenPath Firefox Assets",
                "buildRequired": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.build_required }},
                "amd64DurationSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.amd64_duration_seconds || 0 }},
                "arm64DurationSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.arm64_duration_seconds || 0 }},
                "amd64ExecutionSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.amd64_execution_seconds || 0 }},
                "arm64ExecutionSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.arm64_execution_seconds || 0 }},
                "amd64QueueSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.amd64_queue_seconds || 0 }},
                "arm64QueueSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.arm64_queue_seconds || 0 }},
                "amd64CacheScope": "${{ needs.build-openpath-firefox-assets-release-candidate.outputs.amd64_cache_scope }}",
                "arm64CacheScope": "${{ needs.build-openpath-firefox-assets-release-candidate.outputs.arm64_cache_scope }}",
                "amd64BuildMode": "${{ needs.build-openpath-firefox-assets-release-candidate.outputs.amd64_build_mode }}",
                "arm64BuildMode": "${{ needs.build-openpath-firefox-assets-release-candidate.outputs.arm64_build_mode }}",
                "publishDurationSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.publish_duration_seconds || 0 }},
                "familyDurationSeconds": ${{ needs.build-openpath-firefox-assets-release-candidate.outputs.family_duration_seconds || 0 }},
                "firefoxReleaseState": "${{ needs.resolve-openpath-firefox-release-assets.outputs.release-state }}",
