name: Release Candidate Images

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'react-spa/**'
      - 'docker/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'upstream/openpath'
      - '.github/workflows/release-candidate-images.yml'
      - '.github/workflows/firefox-release-assets.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-candidate-images-main
  cancel-in-progress: true

jobs:
  derive-release-image-refs:
    name: Derive Release Image Refs
    runs-on: ubuntu-latest
    outputs:
      repository_owner: ${{ steps.image-refs.outputs.repository_owner }}
      gateway_repo: ${{ steps.image-refs.outputs.gateway_repo }}
      migrations_repo: ${{ steps.image-refs.outputs.migrations_repo }}
      openpath_api_repo: ${{ steps.image-refs.outputs.openpath_api_repo }}
      spa_repo: ${{ steps.image-refs.outputs.spa_repo }}
      verifier_repo: ${{ steps.image-refs.outputs.verifier_repo }}
      openpath_sha: ${{ steps.openpath.outputs.sha }}
      gateway_tag: ${{ steps.image-refs.outputs.gateway_tag }}
      migrations_tag: ${{ steps.image-refs.outputs.migrations_tag }}
      openpath_api_tag: ${{ steps.image-refs.outputs.openpath_api_tag }}
      spa_tag: ${{ steps.image-refs.outputs.spa_tag }}
      verifier_tag: ${{ steps.image-refs.outputs.verifier_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Derive release image refs
        id: image-refs
        run: |
          node scripts/release-images.mjs outputs \
            --sha "${{ github.sha }}" \
            --owner "${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenPath SHA
        id: openpath
        run: |
          echo "sha=$(git -C upstream/openpath rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-gateway-release-candidate:
    name: Build Gateway Release Candidate
    runs-on: ubuntu-latest
    needs: derive-release-image-refs
    outputs:
      gateway_image: ${{ steps.publish-manifest.outputs.gateway_image }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        id: build-gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cp-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.derive-release-image-refs.outputs.gateway_tag }}
          cache-from: type=gha,scope=release-candidate-gateway
          cache-to: type=gha,mode=max,scope=release-candidate-gateway

      - name: Publish gateway manifest output
        id: publish-manifest
        run: |
          echo "gateway_image=${{ needs.derive-release-image-refs.outputs.gateway_repo }}@${{ steps.build-gateway.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-migrations-release-candidate:
    name: Build Migrations Release Candidate
    runs-on: ubuntu-latest
    needs: derive-release-image-refs
    outputs:
      migrations_image: ${{ steps.publish-manifest.outputs.migrations_image }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrations image
        id: build-migrations
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.migrations
          platforms: linux/amd64
          push: true
          tags: ${{ needs.derive-release-image-refs.outputs.migrations_tag }}
          cache-from: type=gha,scope=release-candidate-migrations
          cache-to: type=gha,mode=max,scope=release-candidate-migrations

      - name: Publish migrations manifest output
        id: publish-manifest
        run: |
          echo "migrations_image=${{ needs.derive-release-image-refs.outputs.migrations_repo }}@${{ steps.build-migrations.outputs.digest }}" >> "$GITHUB_OUTPUT"

  resolve-openpath-firefox-release-assets:
    name: Resolve OpenPath Firefox Release Assets
    runs-on: ubuntu-latest
    needs: derive-release-image-refs

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Resolve prebuilt Firefox release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p firefox-release-assets
          node scripts/wait-for-release-candidate.mjs resolve-firefox-assets \
            --openpath-sha "${{ needs.derive-release-image-refs.outputs.openpath_sha }}" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 900 \
            --interval-seconds 10 \
            --output-dir firefox-release-assets

      - name: Verify resolved Firefox release assets
        run: |
          test -f firefox-release-assets/dist/background.js
          test -f firefox-release-assets/build/firefox-release/metadata.json
          test -f firefox-release-assets/build/firefox-release/openpath-firefox-extension.xpi

      - name: Upload Firefox release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openpath-firefox-release-assets
          path: |
            firefox-release-assets/dist/**
            firefox-release-assets/build/firefox-release/**
          if-no-files-found: error

  build-openpath-api-release-candidate-amd64:
    name: Build OpenPath API Release Candidate (amd64)
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-openpath-firefox-release-assets
    outputs:
      image_digest: ${{ steps.build-openpath-api.outputs.digest }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Firefox release assets
        uses: actions/download-artifact@v5
        with:
          name: openpath-firefox-release-assets
          path: ./upstream/openpath/firefox-extension

      - name: Verify downloaded Firefox release assets
        run: |
          test -f ./upstream/openpath/firefox-extension/dist/background.js
          test -f ./upstream/openpath/firefox-extension/build/firefox-release/metadata.json
          test -f ./upstream/openpath/firefox-extension/build/firefox-release/openpath-firefox-extension.xpi

      - name: Build and push OpenPath API image
        id: build-openpath-api
        uses: docker/build-push-action@v7
        with:
          context: ./upstream/openpath
          file: ./docker/Dockerfile.api
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.openpath_api_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-candidate-openpath-api-amd64
          cache-to: type=gha,mode=max,scope=release-candidate-openpath-api-amd64

  build-openpath-api-release-candidate-arm64:
    name: Build OpenPath API Release Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    needs:
      - derive-release-image-refs
      - resolve-openpath-firefox-release-assets
    outputs:
      image_digest: ${{ steps.build-openpath-api.outputs.digest }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Firefox release assets
        uses: actions/download-artifact@v5
        with:
          name: openpath-firefox-release-assets
          path: ./upstream/openpath/firefox-extension

      - name: Verify downloaded Firefox release assets
        run: |
          test -f ./upstream/openpath/firefox-extension/dist/background.js
          test -f ./upstream/openpath/firefox-extension/build/firefox-release/metadata.json
          test -f ./upstream/openpath/firefox-extension/build/firefox-release/openpath-firefox-extension.xpi

      - name: Build and push OpenPath API image
        id: build-openpath-api
        uses: docker/build-push-action@v7
        with:
          context: ./upstream/openpath
          file: ./docker/Dockerfile.api
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.openpath_api_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-candidate-openpath-api-arm64
          cache-to: type=gha,mode=max,scope=release-candidate-openpath-api-arm64

  build-openpath-api-release-candidate:
    name: Publish OpenPath API Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - build-openpath-api-release-candidate-amd64
      - build-openpath-api-release-candidate-arm64
    outputs:
      openpath_api_image: ${{ steps.publish-manifest.outputs.openpath_api_image }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge OpenPath API per-architecture digests
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.derive-release-image-refs.outputs.openpath_api_tag }}" \
            "${{ needs.derive-release-image-refs.outputs.openpath_api_repo }}@${{ needs.build-openpath-api-release-candidate-amd64.outputs.image_digest }}" \
            "${{ needs.derive-release-image-refs.outputs.openpath_api_repo }}@${{ needs.build-openpath-api-release-candidate-arm64.outputs.image_digest }}"

      - name: Publish OpenPath API manifest output
        id: publish-manifest
        run: |
          manifest_digest="$(docker buildx imagetools inspect "${{ needs.derive-release-image-refs.outputs.openpath_api_tag }}" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$manifest_digest"
          echo "openpath_api_image=${{ needs.derive-release-image-refs.outputs.openpath_api_repo }}@$manifest_digest" >> "$GITHUB_OUTPUT"

  build-spa-release-candidate:
    name: Build SPA Release Candidate
    runs-on: ubuntu-latest
    needs: derive-release-image-refs
    outputs:
      spa_image: ${{ steps.publish-manifest.outputs.spa_image }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SPA image
        id: build-spa
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.spa
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.derive-release-image-refs.outputs.spa_tag }}
          cache-from: type=gha,scope=release-candidate-spa
          cache-to: type=gha,mode=max,scope=release-candidate-spa

      - name: Publish SPA manifest output
        id: publish-manifest
        run: |
          echo "spa_image=${{ needs.derive-release-image-refs.outputs.spa_repo }}@${{ steps.build-spa.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-verifier-release-candidate:
    name: Build Release Verifier Candidate
    runs-on: ubuntu-latest
    needs: derive-release-image-refs
    outputs:
      verifier_image: ${{ steps.publish-manifest.outputs.verifier_image }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verifier image
        id: build-verifier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.release-verifier
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.derive-release-image-refs.outputs.verifier_tag }}
          cache-from: type=gha,scope=release-candidate-verifier
          cache-to: type=gha,mode=max,scope=release-candidate-verifier

      - name: Publish verifier manifest output
        id: publish-manifest
        run: |
          echo "verifier_image=${{ needs.derive-release-image-refs.outputs.verifier_repo }}@${{ steps.build-verifier.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish-release-candidate-manifest:
    name: Publish Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - build-gateway-release-candidate
      - build-migrations-release-candidate
      - build-openpath-api-release-candidate
      - build-spa-release-candidate
      - build-verifier-release-candidate

    steps:
      - name: Persist release candidate image manifest
        run: |
          cat > release-candidate-images.env <<EOF
          APP_SHA=${{ github.sha }}
          CLASSROOMPATH_GATEWAY_IMAGE=${{ needs.build-gateway-release-candidate.outputs.gateway_image }}
          CLASSROOMPATH_MIGRATIONS_IMAGE=${{ needs.build-migrations-release-candidate.outputs.migrations_image }}
          OPENPATH_API_IMAGE=${{ needs.build-openpath-api-release-candidate.outputs.openpath_api_image }}
          CLASSROOMPATH_SPA_IMAGE=${{ needs.build-spa-release-candidate.outputs.spa_image }}
          CLASSROOMPATH_VERIFIER_IMAGE=${{ needs.build-verifier-release-candidate.outputs.verifier_image }}
          EOF

      - name: Upload release candidate image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-images-${{ github.sha }}
          path: release-candidate-images.env
          retention-days: 7
