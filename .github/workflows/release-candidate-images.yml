name: Release Candidate Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: release-candidate-images-main
  cancel-in-progress: true

jobs:
  derive-release-image-refs:
    name: Derive Release Image Refs
    runs-on: ubuntu-latest
    outputs:
      repository_owner: ${{ steps.image-refs.outputs.repository_owner }}
      gateway_repo: ${{ steps.image-refs.outputs.gateway_repo }}
      migrations_repo: ${{ steps.image-refs.outputs.migrations_repo }}
      openpath_api_repo: ${{ steps.image-refs.outputs.openpath_api_repo }}
      spa_repo: ${{ steps.image-refs.outputs.spa_repo }}
      verifier_repo: ${{ steps.image-refs.outputs.verifier_repo }}
      openpath_sha: ${{ steps.openpath.outputs.sha }}
      openpath_version: ${{ steps.linux-agent.outputs.version }}
      openpath_linux_agent_version: ${{ steps.linux-agent.outputs.version }}
      gateway_tag: ${{ steps.image-refs.outputs.gateway_tag }}
      migrations_tag: ${{ steps.image-refs.outputs.migrations_tag }}
      openpath_api_tag: ${{ steps.image-refs.outputs.openpath_api_tag }}
      spa_tag: ${{ steps.image-refs.outputs.spa_tag }}
      verifier_tag: ${{ steps.image-refs.outputs.verifier_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Derive release image refs
        id: image-refs
        run: |
          node scripts/release-images.mjs outputs \
            --sha "${{ github.sha }}" \
            --owner "${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenPath SHA
        id: openpath
        run: |
          echo "sha=$(git rev-parse HEAD:upstream/openpath)" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenPath Linux agent version
        id: linux-agent
        run: |
          node scripts/resolve-openpath-linux-agent-version.mjs \
            --openpath-dir upstream/openpath >> "$GITHUB_OUTPUT"

  resolve-previous-release-candidate-manifest:
    name: Resolve Previous Release Candidate Manifest
    runs-on: ubuntu-latest
    needs: derive-release-image-refs
    outputs:
      available: ${{ steps.export.outputs.available }}
      gateway_image: ${{ steps.export.outputs.gateway_image }}
      migrations_image: ${{ steps.export.outputs.migrations_image }}
      openpath_api_image: ${{ steps.export.outputs.openpath_api_image }}
      spa_image: ${{ steps.export.outputs.spa_image }}
      verifier_image: ${{ steps.export.outputs.verifier_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Resolve previous release candidate manifest
        id: resolve
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/resolve-latest-verifier-image.mjs > previous-release-candidate-images.env

      - name: Export previous release candidate manifest
        id: export
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.resolve.outcome }}" != 'success' ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'available=true' >> "$GITHUB_OUTPUT"
          cat previous-release-candidate-images.env >> "$GITHUB_OUTPUT"

  detect-release-candidate-components:
    name: Detect Release Candidate Components
    runs-on: ubuntu-latest
    outputs:
      gateway_changed: ${{ steps.detect.outputs.gateway_changed }}
      migrations_changed: ${{ steps.detect.outputs.migrations_changed }}
      openpath_api_changed: ${{ steps.detect.outputs.openpath_api_changed }}
      spa_changed: ${{ steps.detect.outputs.spa_changed }}
      verifier_changed: ${{ steps.detect.outputs.verifier_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed release-candidate components
        id: detect
        shell: bash
        run: bash scripts/detect-release-candidate-components.sh "${{ github.event.before }}" "${{ github.sha }}"

  build-gateway-release-candidate:
    name: Build Gateway Release Candidate
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      gateway_image: ${{ steps.publish-manifest.outputs.gateway_image }}

    steps:
      - name: Decide whether to build gateway image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.gateway_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push gateway image
        if: steps.mode.outputs.build_required == 'true'
        id: build-gateway
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.cp-api
          platforms: linux/amd64,linux/arm64
          push: 'true'
          tags: ${{ needs.derive-release-image-refs.outputs.gateway_tag }}
          cache-scope: release-candidate-gateway

      - name: Publish gateway manifest output
        id: publish-manifest
        run: |
          if [ "${{ steps.mode.outputs.build_required }}" = 'true' ]; then
            echo "gateway_image=${{ needs.derive-release-image-refs.outputs.gateway_repo }}@${{ steps.build-gateway.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "gateway_image=${{ needs.resolve-previous-release-candidate-manifest.outputs.gateway_image }}" >> "$GITHUB_OUTPUT"
          fi

  build-migrations-release-candidate-amd64:
    name: Build Migrations Release Candidate (amd64)
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-migrations.outputs.digest }}

    steps:
      - name: Decide whether to build the amd64 migrations image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.migrations_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push migrations image
        if: steps.mode.outputs.build_required == 'true'
        id: build-migrations
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.migrations
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.migrations_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-migrations-amd64

  build-migrations-release-candidate-arm64:
    name: Build Migrations Release Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-migrations.outputs.digest }}

    steps:
      - name: Decide whether to build the arm64 migrations image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.migrations_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push migrations image
        if: steps.mode.outputs.build_required == 'true'
        id: build-migrations
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.migrations
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.migrations_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-migrations-arm64

  build-migrations-release-candidate:
    name: Publish Migrations Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - build-migrations-release-candidate-amd64
      - build-migrations-release-candidate-arm64
    outputs:
      migrations_image: ${{ steps.publish-manifest.outputs.image }}

    steps:
      - name: Decide whether to build the migrations manifest
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.migrations_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish migrations manifest output
        id: publish-manifest
        uses: ./.github/actions/publish-release-candidate-manifest
        with:
          build-required: ${{ steps.mode.outputs.build_required }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.derive-release-image-refs.outputs.migrations_tag }}
          image-repo: ${{ needs.derive-release-image-refs.outputs.migrations_repo }}
          amd64-digest: ${{ needs.build-migrations-release-candidate-amd64.outputs.image_digest }}
          arm64-digest: ${{ needs.build-migrations-release-candidate-arm64.outputs.image_digest }}
          previous-image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.migrations_image }}
          output-name: migrations_image

  resolve-openpath-firefox-release-assets:
    name: Resolve OpenPath Firefox Release Assets
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components

    steps:
      - name: Decide whether to refresh Firefox release assets
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_api_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        if: steps.mode.outputs.build_required == 'true'
        uses: ./.github/actions/setup-node

      - name: Resolve prebuilt Firefox release assets
        if: steps.mode.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p firefox-release-assets
          node scripts/wait-for-release-candidate.mjs resolve-firefox-assets \
            --openpath-sha "${{ needs.derive-release-image-refs.outputs.openpath_sha }}" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 900 \
            --interval-seconds 10 \
            --output-dir firefox-release-assets

      - name: Verify resolved Firefox release assets
        if: steps.mode.outputs.build_required == 'true'
        run: |
          test -f firefox-release-assets/dist/background.js
          test -f firefox-release-assets/build/firefox-release/metadata.json
          test -f firefox-release-assets/build/firefox-release/openpath-firefox-extension.xpi

      - name: Upload Firefox release artifacts
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openpath-firefox-release-assets
          path: |
            firefox-release-assets/dist/**
            firefox-release-assets/build/firefox-release/**
          if-no-files-found: error

  build-openpath-api-release-candidate-amd64:
    name: Build OpenPath API Release Candidate (amd64)
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - resolve-openpath-firefox-release-assets
    outputs:
      image_digest: ${{ steps.build-openpath-api.outputs.digest }}

    steps:
      - name: Decide whether to build the amd64 OpenPath API image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_api_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push OpenPath API image
        if: steps.mode.outputs.build_required == 'true'
        id: build-openpath-api
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: ./upstream/openpath
          file: ./docker/Dockerfile.api
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.openpath_api_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-openpath-api-amd64
          artifact-name: openpath-firefox-release-assets
          artifact-path: ./upstream/openpath/firefox-extension
          verify-paths: |
            ./upstream/openpath/firefox-extension/dist/background.js
            ./upstream/openpath/firefox-extension/build/firefox-release/metadata.json
            ./upstream/openpath/firefox-extension/build/firefox-release/openpath-firefox-extension.xpi

  build-openpath-api-release-candidate-arm64:
    name: Build OpenPath API Release Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - resolve-openpath-firefox-release-assets
    outputs:
      image_digest: ${{ steps.build-openpath-api.outputs.digest }}

    steps:
      - name: Decide whether to build the arm64 OpenPath API image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_api_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push OpenPath API image
        if: steps.mode.outputs.build_required == 'true'
        id: build-openpath-api
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: ./upstream/openpath
          file: ./docker/Dockerfile.api
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.openpath_api_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-openpath-api-arm64
          artifact-name: openpath-firefox-release-assets
          artifact-path: ./upstream/openpath/firefox-extension
          verify-paths: |
            ./upstream/openpath/firefox-extension/dist/background.js
            ./upstream/openpath/firefox-extension/build/firefox-release/metadata.json
            ./upstream/openpath/firefox-extension/build/firefox-release/openpath-firefox-extension.xpi

  build-openpath-api-release-candidate:
    name: Publish OpenPath API Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - build-openpath-api-release-candidate-amd64
      - build-openpath-api-release-candidate-arm64
    outputs:
      openpath_api_image: ${{ steps.publish-manifest.outputs.image }}

    steps:
      - name: Decide whether to build the OpenPath API manifest
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.openpath_api_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish OpenPath API manifest output
        id: publish-manifest
        uses: ./.github/actions/publish-release-candidate-manifest
        with:
          build-required: ${{ steps.mode.outputs.build_required }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.derive-release-image-refs.outputs.openpath_api_tag }}
          image-repo: ${{ needs.derive-release-image-refs.outputs.openpath_api_repo }}
          amd64-digest: ${{ needs.build-openpath-api-release-candidate-amd64.outputs.image_digest }}
          arm64-digest: ${{ needs.build-openpath-api-release-candidate-arm64.outputs.image_digest }}
          previous-image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.openpath_api_image }}
          output-name: openpath_api_image

  build-spa-release-candidate-amd64:
    name: Build SPA Release Candidate (amd64)
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-spa.outputs.digest }}

    steps:
      - name: Decide whether to build SPA image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.spa_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push SPA image
        if: steps.mode.outputs.build_required == 'true'
        id: build-spa
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.spa
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.spa_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-spa-amd64

  build-spa-release-candidate-arm64:
    name: Build SPA Release Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-spa.outputs.digest }}

    steps:
      - name: Decide whether to build SPA image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.spa_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push SPA image
        if: steps.mode.outputs.build_required == 'true'
        id: build-spa
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.spa
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.spa_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-spa-arm64

  build-spa-release-candidate:
    name: Publish SPA Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - build-spa-release-candidate-amd64
      - build-spa-release-candidate-arm64
    outputs:
      spa_image: ${{ steps.publish-manifest.outputs.image }}

    steps:
      - name: Decide whether to build SPA manifest
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.spa_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish SPA manifest output
        id: publish-manifest
        uses: ./.github/actions/publish-release-candidate-manifest
        with:
          build-required: ${{ steps.mode.outputs.build_required }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.derive-release-image-refs.outputs.spa_tag }}
          image-repo: ${{ needs.derive-release-image-refs.outputs.spa_repo }}
          amd64-digest: ${{ needs.build-spa-release-candidate-amd64.outputs.image_digest }}
          arm64-digest: ${{ needs.build-spa-release-candidate-arm64.outputs.image_digest }}
          previous-image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.spa_image }}
          output-name: spa_image

  build-verifier-release-candidate-amd64:
    name: Build Release Verifier Candidate (amd64)
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-verifier.outputs.digest }}

    steps:
      - name: Decide whether to build verifier image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.verifier_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push verifier image
        if: steps.mode.outputs.build_required == 'true'
        id: build-verifier
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.release-verifier
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.verifier_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-verifier-amd64

  build-verifier-release-candidate-arm64:
    name: Build Release Verifier Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
    outputs:
      image_digest: ${{ steps.build-verifier.outputs.digest }}

    steps:
      - name: Decide whether to build verifier image
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.verifier_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push verifier image
        if: steps.mode.outputs.build_required == 'true'
        id: build-verifier
        uses: ./.github/actions/build-release-candidate-image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: docker/Dockerfile.release-verifier
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.derive-release-image-refs.outputs.verifier_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-scope: release-candidate-verifier-arm64

  build-verifier-release-candidate:
    name: Publish Release Verifier Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - resolve-previous-release-candidate-manifest
      - detect-release-candidate-components
      - build-verifier-release-candidate-amd64
      - build-verifier-release-candidate-arm64
    outputs:
      verifier_image: ${{ steps.publish-manifest.outputs.image }}

    steps:
      - name: Decide whether to build verifier manifest
        id: mode
        shell: bash
        run: |
          if [ "${{ needs.detect-release-candidate-components.outputs.verifier_changed }}" = 'true' ] || [ "${{ needs.resolve-previous-release-candidate-manifest.outputs.available }}" != 'true' ]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish verifier manifest output
        id: publish-manifest
        uses: ./.github/actions/publish-release-candidate-manifest
        with:
          build-required: ${{ steps.mode.outputs.build_required }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.derive-release-image-refs.outputs.verifier_tag }}
          image-repo: ${{ needs.derive-release-image-refs.outputs.verifier_repo }}
          amd64-digest: ${{ needs.build-verifier-release-candidate-amd64.outputs.image_digest }}
          arm64-digest: ${{ needs.build-verifier-release-candidate-arm64.outputs.image_digest }}
          previous-image: ${{ needs.resolve-previous-release-candidate-manifest.outputs.verifier_image }}
          output-name: verifier_image

  publish-release-candidate-manifest:
    name: Publish Release Candidate Manifest
    runs-on: ubuntu-latest
    needs:
      - derive-release-image-refs
      - build-gateway-release-candidate
      - build-migrations-release-candidate
      - build-openpath-api-release-candidate
      - build-spa-release-candidate
      - build-verifier-release-candidate

    steps:
      - name: Persist release candidate image manifest
        run: |
          cat > release-candidate-images.env <<EOF
          APP_SHA=${{ github.sha }}
          CLASSROOMPATH_GATEWAY_IMAGE=${{ needs.build-gateway-release-candidate.outputs.gateway_image }}
          CLASSROOMPATH_MIGRATIONS_IMAGE=${{ needs.build-migrations-release-candidate.outputs.migrations_image }}
          OPENPATH_API_IMAGE=${{ needs.build-openpath-api-release-candidate.outputs.openpath_api_image }}
          OPENPATH_VERSION=${{ needs.derive-release-image-refs.outputs.openpath_version }}
          OPENPATH_LINUX_AGENT_VERSION=${{ needs.derive-release-image-refs.outputs.openpath_linux_agent_version }}
          CLASSROOMPATH_SPA_IMAGE=${{ needs.build-spa-release-candidate.outputs.spa_image }}
          CLASSROOMPATH_VERIFIER_IMAGE=${{ needs.build-verifier-release-candidate.outputs.verifier_image }}
          EOF

      - name: Upload release candidate image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-images-${{ github.sha }}
          path: release-candidate-images.env
          retention-days: 7
