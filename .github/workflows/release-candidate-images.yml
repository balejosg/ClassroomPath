              "verifier": {
                "displayName": "Verifier",
                "buildRequired": false,
                "buildMode": "reused",
                "amd64DurationSeconds": 0,
                "arm64DurationSeconds": 0,
                "amd64ExecutionSeconds": 0,
                "arm64ExecutionSeconds": 0,
                "amd64QueueSeconds": 0,
                "arm64QueueSeconds": 0,
                "amd64CacheScope": "release-candidate-verifier-amd64",
                "arm64CacheScope": "release-candidate-verifier-arm64",
                "amd64BuildMode": "reused",
                "arm64BuildMode": "reused",
                "publishDurationSeconds": 0,
                "familyDurationSeconds": 0,
                "platforms": {
                  "amd64": { "platform": "amd64", "buildRequired": false, "buildMode": "reused", "cacheScope": "release-candidate-verifier-amd64", "queueSeconds": 0, "executionSeconds": 0 },
                  "arm64": { "platform": "arm64", "buildRequired": false, "buildMode": "reused", "cacheScope": "release-candidate-verifier-arm64", "queueSeconds": 0, "executionSeconds": 0 }
                }
              }
            }
          }
          EOF

      - name: Summarize release candidate timings
        shell: bash
        run: |
          {
            echo '## Release Candidate Timings'
            echo
            echo '### Manifest-Only Fast Path'
            echo
            echo 'Reused the previous release-candidate image manifest and refreshed the OpenPath version pins for this commit.'
            echo
            echo '### Gate Candidate'
            echo
            echo '```json'
            node scripts/measure-release-candidate-timings.mjs release-candidate-timings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate timing artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-timings-${{ github.sha }}
          path: release-candidate-timings.json
          retention-days: 7
