            echo "| SPA | ${{ needs.build-spa-release-candidate.outputs.build_required }} | ${{ needs.build-spa-release-candidate.outputs.amd64_build_mode }} | ${{ needs.build-spa-release-candidate.outputs.amd64_queue_seconds || 0 }} | ${{ needs.build-spa-release-candidate.outputs.amd64_execution_seconds || 0 }} | ${{ needs.build-spa-release-candidate.outputs.amd64_cache_scope }} | ${{ needs.build-spa-release-candidate.outputs.arm64_build_mode }} | ${{ needs.build-spa-release-candidate.outputs.arm64_queue_seconds || 0 }} | ${{ needs.build-spa-release-candidate.outputs.arm64_execution_seconds || 0 }} | ${{ needs.build-spa-release-candidate.outputs.arm64_cache_scope }} | ${{ needs.build-spa-release-candidate.outputs.publish_duration_seconds || 0 }} | ${{ needs.build-spa-release-candidate.outputs.family_duration_seconds || 0 }} |"
