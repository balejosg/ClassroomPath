name: Self-Hosted Windows Runner Smoke

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: self-hosted-windows-runner-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect-runner-registration:
    name: Inspect Windows runner registration
    runs-on: ubuntu-latest
    outputs:
      runner-online: ${{ steps.inspect.outputs.runner_online }}
    steps:
      - name: Inspect GitHub runner registration
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_NAME: ${{ vars.CLASSROOMPATH_WINDOWS_RUNNER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RUNNER_NAME" ]; then
            echo "::error::Set vars.CLASSROOMPATH_WINDOWS_RUNNER_NAME to a comma-separated list of private self-hosted Windows runner names."
            exit 1
          fi
          runner_json_path="$(mktemp)"
          runner_error_path="$(mktemp)"

          if ! gh api repos/${{ github.repository }}/actions/runners --paginate --jq '.runners[]' >"$runner_json_path" 2>"$runner_error_path"; then
            runner_error="$(cat "$runner_error_path")"
            if grep -q 'Resource not accessible by integration' "$runner_error_path"; then
              echo "::warning::GITHUB_TOKEN cannot inspect self-hosted runner registration; continuing with on-runner smoke. $runner_error"
              jq -n \
                --arg runner_name "$RUNNER_NAME" \
                --arg status "unknown" \
                --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg error "$runner_error" \
                '{
                  runner_name: $runner_name,
                  status: $status,
                  busy: null,
                  checked_at: $checked_at,
                  evidence_type: "runner-health-unavailable",
                  error: $error
                }' > runner-state.json
              echo "runner_online=unknown" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::Failed to inspect Windows runner registration: $runner_error"
            exit 1
          fi

          all_runners_json="$(cat "$runner_json_path")"
          all_online=true
          IFS=',' read -ra runner_names <<< "$RUNNER_NAME"
          for name in "${runner_names[@]}"; do
            name="$(echo "$name" | tr -d '[:space:]')"
            runner_json="$(jq -r --arg n "$name" 'select(.name == $n)' <<<"$all_runners_json")"

            if [ -z "$runner_json" ]; then
              echo "::error::Expected Windows runner is not registered: $name"
              all_online=false
              continue
            fi

            status="$(jq -r '.status' <<<"$runner_json")"
            busy="$(jq -r '.busy' <<<"$runner_json")"
            echo "Runner $name status=$status busy=$busy"

            if [ "$status" != "online" ]; then
              echo "::error::Windows runner is not online: $name"
              all_online=false
            fi

            if [ "$busy" = "true" ]; then
              echo "::warning::Windows runner is currently busy; smoke may queue behind active work: $name"
            fi
          done

          jq -n \
            --arg runner_name "$RUNNER_NAME" \
            --arg status "$([ "$all_online" = "true" ] && echo "online" || echo "degraded")" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              runner_name: $runner_name,
              status: $status,
              busy: null,
              checked_at: $checked_at,
              evidence_type: "runner-health"
            }' > runner-state.json

          if [ "$all_online" != "true" ]; then
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "runner_online=true" >> "$GITHUB_OUTPUT"

      - name: Upload runner state evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runner-state
          path: runner-state.json
          if-no-files-found: warn

  smoke:
    name: Windows runner smoke
    needs: [inspect-runner-registration]
    runs-on: [self-hosted, Windows, X64, proxmox, classroompath]
    timeout-minutes: 10
    steps:
      - name: Verify runner identity
        shell: pwsh
        env:
          EXPECTED_RUNNER_NAME: ${{ vars.CLASSROOMPATH_WINDOWS_RUNNER_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_RUNNER_NAME)) {
            throw "Set vars.CLASSROOMPATH_WINDOWS_RUNNER_NAME to a comma-separated list of private self-hosted Windows runner names."
          }
          $allowedRunners = $env:EXPECTED_RUNNER_NAME -split ',' | ForEach-Object { $_.Trim() }
          if ($allowedRunners -notcontains $env:RUNNER_NAME) {
            throw "Unexpected runner name: $env:RUNNER_NAME"
          }
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Unexpected runner OS: $env:RUNNER_OS"
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Unexpected runner arch: $env:RUNNER_ARCH"
          }

      - name: Restore Windows runner DNS before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $dnsServers = @('1.1.1.1', '8.8.8.8')
          $activeAdapters = @(Get-NetAdapter -ErrorAction SilentlyContinue |
            Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -notlike '*Loopback*' })

          foreach ($adapter in $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          if (-not $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceAlias 'Ethernet' -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          Clear-DnsClientCache -ErrorAction SilentlyContinue

          $githubProbe = Test-NetConnection github.com -Port 443 -WarningAction SilentlyContinue
          if (-not $githubProbe.NameResolutionSucceeded -or -not $githubProbe.TcpTestSucceeded) {
            throw "GitHub connectivity failed before checkout. NameResolution=$($githubProbe.NameResolutionSucceeded) Tcp443=$($githubProbe.TcpTestSucceeded)"
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore Windows runner DNS before smoke
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Verify GitHub network connectivity
        shell: pwsh
        run: |
          $githubProbe = Test-NetConnection github.com -Port 443 -WarningAction SilentlyContinue
          if (-not $githubProbe.NameResolutionSucceeded -or -not $githubProbe.TcpTestSucceeded) {
            throw "GitHub connectivity failed. NameResolution=$($githubProbe.NameResolutionSucceeded) Tcp443=$($githubProbe.TcpTestSucceeded)"
          }

      - name: Repository smoke
        shell: pwsh
        run: |
          if (-not (Test-Path package.json -PathType Leaf)) {
            throw 'package.json was not checked out'
          }
          if (-not (Test-Path .github/workflows -PathType Container)) {
            throw 'workflow directory was not checked out'
          }
          $workspace = (Get-Location).Path
          git config --global --add safe.directory $workspace
          git status --short
