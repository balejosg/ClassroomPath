name: Reusable Smoke Test

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      create_issue_on_failure:
        required: false
        type: boolean
        default: false
      close_issue_on_recovery:
        required: false
        type: boolean
        default: false
      create_issue_on_schedule_only:
        required: false
        type: boolean
        default: false
      verifier_image:
        required: true
        type: string
      issue_title:
        required: false
        type: string
        default: ''
      issue_labels:
        required: false
        type: string
        default: ''
    outputs:
      failure_boundary_id:
        description: Smoke failure boundary identifier.
        value: ${{ jobs.smoke.outputs.failure_boundary_id }}
      failure_boundary_message:
        description: Smoke failure boundary diagnostic message.
        value: ${{ jobs.smoke.outputs.failure_boundary_message }}

permissions:
  issues: write
  contents: read
  packages: read

jobs:
  smoke:
    name: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      failure_boundary_id: ${{ steps.failure-boundary.outputs.failure_boundary_id }}
      failure_boundary_message: ${{ steps.failure-boundary.outputs.failure_boundary_message }}

    env:
      CLASSROOMPATH_STAGING_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
      CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL || vars.STAGING_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
      CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL || vars.STAGING_GATEWAY_HEALTH_URL }}
      CLASSROOMPATH_STAGING_READY_URL: ${{ vars.CLASSROOMPATH_STAGING_READY_URL || vars.STAGING_READY_URL }}
      CLASSROOMPATH_STAGING_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_API_HEALTH_URL || vars.STAGING_API_HEALTH_URL }}
      CLASSROOMPATH_STAGING_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_STAGING_API_CONFIG_URL || vars.STAGING_API_CONFIG_URL }}
      CLASSROOMPATH_PRODUCTION_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
      CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL || vars.PRODUCTION_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
      CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL || vars.PRODUCTION_GATEWAY_HEALTH_URL }}
      CLASSROOMPATH_PRODUCTION_READY_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_READY_URL || vars.PRODUCTION_READY_URL }}
      CLASSROOMPATH_PRODUCTION_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_HEALTH_URL || vars.PRODUCTION_API_HEALTH_URL }}
      CLASSROOMPATH_PRODUCTION_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_CONFIG_URL || vars.PRODUCTION_API_CONFIG_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Load deploy target
        id: target
        run: node scripts/deploy-targets.mjs outputs "${{ inputs.environment_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for readiness
        id: readiness
        env:
          READY_URL: ${{ steps.target.outputs.ready_url }}
        run: |
          if bash scripts/wait-for-ready.sh "$READY_URL"; then
            exit 0
          fi

          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            'smoke-failure-boundary.json',
            `${JSON.stringify(
              {
                success: false,
                failureBoundary: {
                  id: 'readiness-timeout',
                  message: 'The target readiness endpoint did not become ready before smoke tests.',
                },
              },
              null,
              2
            )}\n`
          );
          NODE
          exit 1

      - name: Run smoke tests
        id: smoke
        env:
          SMOKE_TEST_URL: ${{ steps.target.outputs.public_url }}
          SMOKE_TEST_TIMEOUT: '30000'
          CLASSROOMPATH_VERIFIER_IMAGE: ${{ inputs.verifier_image }}
        run: |
          bash scripts/run-smoke-in-verifier.sh
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Publish smoke failure boundary
        id: failure-boundary
        if: always()
        run: |
          boundary_env="$(mktemp)"
          node <<'NODE' > "$boundary_env"
          const fs = require('node:fs');
          const fallback = {
            success: false,
            failureBoundary: {
              id: 'smoke-test-failed',
              message: 'Smoke workflow failed before a specific boundary artifact was written.',
            },
          };
          const artifact = fs.existsSync('smoke-failure-boundary.json')
            ? JSON.parse(fs.readFileSync('smoke-failure-boundary.json', 'utf8'))
            : fallback;
          const boundary = artifact.failureBoundary ?? fallback.failureBoundary;
          fs.writeFileSync(
            'smoke-failure-boundary.json',
            `${JSON.stringify({ ...artifact, failureBoundary: boundary }, null, 2)}\n`
          );
          console.log(`failure_boundary_id=${boundary.id ?? 'unknown'}`);
          console.log(`failure_boundary_message=${boundary.message ?? ''}`);
          NODE
          cat "$boundary_env" >> "$GITHUB_OUTPUT"
          failure_boundary_id="$(sed -n 's/^failure_boundary_id=//p' "$boundary_env" | head -n 1)"
          failure_boundary_message="$(sed -n 's/^failure_boundary_message=//p' "$boundary_env" | head -n 1)"

          {
            echo "### Smoke failure boundary"
            echo ""
            echo "- failureBoundary: \`$failure_boundary_id\`"
            echo "- message: $failure_boundary_message"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ inputs.environment_name }}-${{ github.run_id }}
          path: |
            smoke-results.txt
            smoke-failure-boundary.json
          retention-days: 7

      - name: Create issue on failure
        if: ${{ always() && (steps.readiness.outcome != 'success' || steps.smoke.outcome != 'success') && inputs.create_issue_on_failure && (!inputs.create_issue_on_schedule_only || github.event_name == 'schedule') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          SMOKE_ENVIRONMENT: ${{ inputs.environment_name }}
          SMOKE_PUBLIC_URL: ${{ steps.target.outputs.public_url }}
          SMOKE_READY_URL: ${{ steps.target.outputs.ready_url }}
          SMOKE_API_HEALTH_URL: ${{ steps.target.outputs.api_health_url }}
          SMOKE_API_CONFIG_URL: ${{ steps.target.outputs.api_config_url }}
          SMOKE_FAILURE_BOUNDARY_ID: ${{ steps.failure-boundary.outputs.failure_boundary_id }}
          SMOKE_FAILURE_BOUNDARY_MESSAGE: ${{ steps.failure-boundary.outputs.failure_boundary_message }}
        run: node scripts/report-smoke-failure.mjs

      - name: Close existing issue on recovery
        if: ${{ success() && inputs.close_issue_on_recovery }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          SMOKE_ENVIRONMENT: ${{ inputs.environment_name }}
        run: node scripts/close-smoke-recovery.mjs
