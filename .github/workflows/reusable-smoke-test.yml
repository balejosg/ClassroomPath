name: Reusable Smoke Test

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      create_issue_on_failure:
        required: false
        type: boolean
        default: false
      close_issue_on_recovery:
        required: false
        type: boolean
        default: false
      create_issue_on_schedule_only:
        required: false
        type: boolean
        default: false
      verifier_image:
        required: true
        type: string
      issue_title:
        required: false
        type: string
        default: ''
      issue_labels:
        required: false
        type: string
        default: ''

permissions:
  issues: write
  contents: read
  packages: read

jobs:
  smoke:
    name: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Load deploy target
        id: target
        run: node scripts/deploy-targets.mjs outputs "${{ inputs.environment_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for readiness
        env:
          READY_URL: ${{ steps.target.outputs.ready_url }}
        run: bash scripts/wait-for-ready.sh "$READY_URL"

      - name: Run smoke tests
        id: smoke
        env:
          SMOKE_TEST_URL: ${{ steps.target.outputs.public_url }}
          SMOKE_TEST_TIMEOUT: '30000'
          CLASSROOMPATH_VERIFIER_IMAGE: ${{ inputs.verifier_image }}
        run: |
          bash scripts/run-smoke-in-verifier.sh
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ inputs.environment_name }}-${{ github.run_id }}
          path: smoke-results.txt
          retention-days: 7

      - name: Create issue on failure
        if: ${{ failure() && inputs.create_issue_on_failure && (!inputs.create_issue_on_schedule_only || github.event_name == 'schedule') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          SMOKE_ENVIRONMENT: ${{ inputs.environment_name }}
          SMOKE_PUBLIC_URL: ${{ steps.target.outputs.public_url }}
          SMOKE_READY_URL: ${{ steps.target.outputs.ready_url }}
          SMOKE_API_HEALTH_URL: ${{ steps.target.outputs.api_health_url }}
          SMOKE_API_CONFIG_URL: ${{ steps.target.outputs.api_config_url }}
        run: node scripts/report-smoke-failure.mjs

      - name: Close existing issue on recovery
        if: ${{ success() && inputs.close_issue_on_recovery }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          SMOKE_ENVIRONMENT: ${{ inputs.environment_name }}
        run: node scripts/close-smoke-recovery.mjs
