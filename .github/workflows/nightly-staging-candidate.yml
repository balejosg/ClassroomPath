name: Nightly Staging Candidate

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  packages: read

concurrency:
  group: nightly-staging-candidate
  cancel-in-progress: false

env:
  CLASSROOMPATH_STAGING_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
  CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL || vars.STAGING_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
  CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL || vars.STAGING_GATEWAY_HEALTH_URL }}
  CLASSROOMPATH_STAGING_READY_URL: ${{ vars.CLASSROOMPATH_STAGING_READY_URL || vars.STAGING_READY_URL }}
  CLASSROOMPATH_STAGING_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_API_HEALTH_URL || vars.STAGING_API_HEALTH_URL }}
  CLASSROOMPATH_STAGING_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_STAGING_API_CONFIG_URL || vars.STAGING_API_CONFIG_URL }}
  CLASSROOMPATH_STAGING_CONTAINER_PLATFORM: ${{ vars.CLASSROOMPATH_STAGING_CONTAINER_PLATFORM || vars.STAGING_CONTAINER_PLATFORM }}
  CLASSROOMPATH_PRODUCTION_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
  CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL || vars.PRODUCTION_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
  CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL || vars.PRODUCTION_GATEWAY_HEALTH_URL }}
  CLASSROOMPATH_PRODUCTION_READY_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_READY_URL || vars.PRODUCTION_READY_URL }}
  CLASSROOMPATH_PRODUCTION_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_HEALTH_URL || vars.PRODUCTION_API_HEALTH_URL }}
  CLASSROOMPATH_PRODUCTION_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_CONFIG_URL || vars.PRODUCTION_API_CONFIG_URL }}

jobs:
  deploy-current-main-to-staging:
    name: Deploy current main to staging
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.release-candidate.outputs.sha }}
      release_candidate_run_id: ${{ steps.release-candidate.outputs.run_id }}
      staging_url: ${{ steps.nightly-staging.outputs.staging_url }}
      windows_firefox_high_risk: ${{ steps.nightly-staging.outputs.windows_firefox_high_risk }}

    steps:
      - name: Reset OpenPath submodule checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE:-}" in
            ""|"/")
              echo "Refusing to reset OpenPath submodule checkout with unsafe GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-<empty>}" >&2
              exit 1
              ;;
          esac
          rm -rf "$GITHUB_WORKSPACE/upstream/openpath"
          rm -rf "$GITHUB_WORKSPACE/.git/modules/upstream/openpath"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Ensure GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: 2.83.0
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              gh_arch="amd64"
              ;;
            aarch64|arm64)
              gh_arch="arm64"
              ;;
            *)
              echo "Unsupported GitHub CLI architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          gh_dir="$RUNNER_TEMP/gh-cli"
          rm -rf "$gh_dir"
          mkdir -p "$gh_dir"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_${gh_arch}.tar.gz" \
            -o "$gh_dir/gh.tar.gz"
          tar -xzf "$gh_dir/gh.tar.gz" -C "$gh_dir" --strip-components=1
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare SSH keys
        shell: bash
        env:
          STAGING_SSH_KEY_SECRET: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY_SECRET"
          test -n "$DEPLOY_SSH_KEY_SECRET"
          install -m 700 -d "$RUNNER_TEMP/classroompath-ssh"
          printf '%s\n' "$STAGING_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/staging"
          printf '%s\n' "$DEPLOY_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/production"
          chmod 600 "$RUNNER_TEMP/classroompath-ssh/staging" "$RUNNER_TEMP/classroompath-ssh/production"
          echo "STAGING_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/staging" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/production" >> "$GITHUB_ENV"

      - name: Resolve release-candidate bundle
        id: release-candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          bundle_outputs="$RUNNER_TEMP/release-candidate-bundle.outputs"
          node scripts/wait-for-release-candidate.mjs resolve-bundle \
            --sha "$target_sha" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 3600 \
            --interval-seconds 15 \
            --output-file release-candidate-images.env \
            --output-dir release-bundle \
            --legacy-manifest-file release-manifest.env > "$bundle_outputs"
          cat "$bundle_outputs" >> "$GITHUB_OUTPUT"
          release_id="$(awk -F= '$1 == "release_id" {print $2; exit}' "$bundle_outputs")"
          run_id="$(awk -F= '$1 == "release_bundle_run_id" {print $2; exit}' "$bundle_outputs")"
          test -n "$release_id"
          test -n "$run_id"
          echo "STAGING_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "STAGING_RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy staging
        id: deploy-staging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_LAN_HOST || secrets.STAGING_DEPLOY_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_LAN_PORT || secrets.STAGING_DEPLOY_PORT }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_GHCR_USERNAME: ${{ github.actor }}
          STAGING_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run deploy:staging:assume-yes
          status="$?"
          set -e

          if [ "$status" -ne 0 ]; then
            staging_url="$(node scripts/deploy-targets.mjs get staging publicUrl)"
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            {
              echo "## Nightly Staging Candidate"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| SHA | \`${{ steps.release-candidate.outputs.sha }}\` |"
              echo "| Release-candidate run | \`${{ steps.release-candidate.outputs.run_id }}\` |"
              echo "| Workflow run | $run_url |"
              echo "| Staging URL | $staging_url |"
              echo "| Staging deploy state | failed |"
              echo "| Release promotion state | blocked |"
              echo "| Promotion-ready preflight state | skipped |"
              echo
              echo "Staging deployment failed, so production promotion readiness was not checked. This scheduled red is an operational blocker until the deploy failure is fixed."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              issue_title="Nightly staging candidate failed for ${{ steps.release-candidate.outputs.sha }}"
              issue_body="$(mktemp)"
              {
                echo "## Nightly staging candidate failed"
                echo
                echo "| Field | Value |"
                echo "| --- | --- |"
                echo "| SHA | \`${{ steps.release-candidate.outputs.sha }}\` |"
                echo "| Release-candidate run | \`${{ steps.release-candidate.outputs.run_id }}\` |"
                echo "| Workflow run | $run_url |"
                echo "| Staging URL | $staging_url |"
                echo "| Failed step | Deploy staging |"
                echo "| Release promotion state | blocked |"
                echo
                echo "Scheduled nightly staging candidate failures block release promotion until fixed. Inspect the workflow run logs for the Deploy staging step; this workflow remains failed after writing this evidence."
              } > "$issue_body"
              existing_issue_url="$(
                gh issue list \
                  --state open \
                  --search "Nightly staging candidate failed in:title" \
                  --json url \
                  --jq '.[0].url // ""'
              )"
              if [ -n "$existing_issue_url" ]; then
                gh issue comment "$existing_issue_url" --body-file "$issue_body"
                echo "Updated existing nightly staging failure issue: $existing_issue_url" >> "$GITHUB_STEP_SUMMARY"
              else
                gh issue create \
                  --title "$issue_title" \
                  --body-file "$issue_body"
              fi
            fi
            exit "$status"
          fi

      - name: Resolve nightly staging outputs
        id: nightly-staging
        shell: bash
        run: |
          set -euo pipefail
          staging_url="$(node scripts/deploy-targets.mjs get staging publicUrl)"
          echo "staging_url=$staging_url" >> "$GITHUB_OUTPUT"
          echo "windows_firefox_high_risk=true" >> "$GITHUB_OUTPUT"

  windows-staging-bootstrap-canary:
    name: Windows Staging Bootstrap Canary
    needs: deploy-current-main-to-staging
    if: needs.deploy-current-main-to-staging.outputs.windows_firefox_high_risk == 'true'
    uses: ./.github/workflows/windows-production-bootstrap-canary.yml
    with:
      target_environment: staging
      base_url: ${{ needs.deploy-current-main-to-staging.outputs.staging_url }}
      diagnostic_mode: ${{ 'false' }}
    secrets: inherit

  persist-windows-staging-bootstrap-canary:
    name: Persist Windows staging bootstrap canary
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 20
    needs: [deploy-current-main-to-staging, windows-staging-bootstrap-canary]
    if: needs.deploy-current-main-to-staging.outputs.windows_firefox_high_risk == 'true' && needs.windows-staging-bootstrap-canary.result == 'success'

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Prepare staging SSH key
        shell: bash
        env:
          STAGING_SSH_KEY_SECRET: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY_SECRET"
          install -m 700 -d "$RUNNER_TEMP/classroompath-ssh"
          printf '%s\n' "$STAGING_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/staging"
          chmod 600 "$RUNNER_TEMP/classroompath-ssh/staging"
          echo "STAGING_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/staging" >> "$GITHUB_ENV"

      - name: Persist canary evidence to staging release state
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_LAN_HOST || secrets.STAGING_DEPLOY_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_LAN_PORT || secrets.STAGING_DEPLOY_PORT }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_WINDOWS_BOOTSTRAP_CANARY_RESULT: ${{ needs.windows-staging-bootstrap-canary.outputs.canary_result }}
          STAGING_WINDOWS_BOOTSTRAP_CANARY_APP_SHA: ${{ github.sha }}
          STAGING_WINDOWS_BOOTSTRAP_CANARY_RUN_ID: ${{ github.run_id }}
          STAGING_WINDOWS_BOOTSTRAP_CANARY_FAILURE_BOUNDARY_ID: ${{ needs.windows-staging-bootstrap-canary.outputs.failure_boundary_id || 'none' }}
          STAGING_WINDOWS_BOOTSTRAP_CANARY_FAILURE_BOUNDARY_MESSAGE: ${{ needs.windows-staging-bootstrap-canary.outputs.failure_boundary_message || 'Windows staging bootstrap canary completed successfully.' }}
        run: bash scripts/persist-staging-windows-bootstrap-canary.sh

  verify-production-promotion-readiness:
    name: Verify production promotion readiness
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 90
    outputs:
      promotion_ready: ${{ steps.promotion-ready.outputs.promotion_ready }}
    needs:
      [
        deploy-current-main-to-staging,
        windows-staging-bootstrap-canary,
        persist-windows-staging-bootstrap-canary,
      ]
    if: always() && needs.deploy-current-main-to-staging.result == 'success' && (needs.persist-windows-staging-bootstrap-canary.result == 'success' || needs.persist-windows-staging-bootstrap-canary.result == 'skipped')

    steps:
      - name: Reset OpenPath submodule checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE:-}" in
            ""|"/")
              echo "Refusing to reset OpenPath submodule checkout with unsafe GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-<empty>}" >&2
              exit 1
              ;;
          esac
          rm -rf "$GITHUB_WORKSPACE/upstream/openpath"
          rm -rf "$GITHUB_WORKSPACE/.git/modules/upstream/openpath"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Ensure GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: 2.83.0
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              gh_arch="amd64"
              ;;
            aarch64|arm64)
              gh_arch="arm64"
              ;;
            *)
              echo "Unsupported GitHub CLI architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          gh_dir="$RUNNER_TEMP/gh-cli"
          rm -rf "$gh_dir"
          mkdir -p "$gh_dir"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_${gh_arch}.tar.gz" \
            -o "$gh_dir/gh.tar.gz"
          tar -xzf "$gh_dir/gh.tar.gz" -C "$gh_dir" --strip-components=1
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare SSH keys
        shell: bash
        env:
          STAGING_SSH_KEY_SECRET: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY_SECRET"
          test -n "$DEPLOY_SSH_KEY_SECRET"
          install -m 700 -d "$RUNNER_TEMP/classroompath-ssh"
          printf '%s\n' "$STAGING_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/staging"
          printf '%s\n' "$DEPLOY_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/production"
          chmod 600 "$RUNNER_TEMP/classroompath-ssh/staging" "$RUNNER_TEMP/classroompath-ssh/production"
          echo "STAGING_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/staging" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/production" >> "$GITHUB_ENV"

      - name: Verify production promotion readiness
        id: promotion-ready
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_LAN_HOST || secrets.STAGING_DEPLOY_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_LAN_PORT || secrets.STAGING_DEPLOY_PORT }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CLASSROOMPATH_DEPLOY_ROOT: ${{ secrets.CLASSROOMPATH_DEPLOY_ROOT }}
          OPENPATH_REQUIRED_CHECKS_AUTO_DISPATCH: false
          OPENPATH_REQUIRED_CHECKS_TIMEOUT_SECONDS: 2400
          OPENPATH_REQUIRED_CHECKS_INTERVAL_SECONDS: 10
          PROMOTION_REPORT_JSON_PATH: ${{ runner.temp }}/promotion-ready/report.json
          PROMOTION_EVIDENCE_DIR: ${{ runner.temp }}/promotion-ready/evidence
        run: |
          if [ -z "${CLASSROOMPATH_DEPLOY_ROOT:-}" ]; then
            echo "::error::CLASSROOMPATH_DEPLOY_ROOT secret is not configured; the production promotion-readiness gate cannot evaluate. Set the CLASSROOMPATH_DEPLOY_ROOT repository secret." >&2
            exit 1
          fi

          mkdir -p "$(dirname "$PROMOTION_REPORT_JSON_PATH")" "$PROMOTION_EVIDENCE_DIR"

          set +e
          npm run verify:promotion-ready
          status="$?"
          set -e

          # Exit-code contract from scripts/verify-production-promotion-ready.sh:
          #   0 -> promotion-ready; 10 -> blocked (expected steady state); 1+ -> genuine gate error.
          if [ "$status" -eq 0 ]; then
            preflight_state="success"
            promotion_ready="true"
          elif [ "$status" -eq 10 ]; then
            preflight_state="blocked"
            promotion_ready="false"
          else
            preflight_state="error (exit $status)"
            promotion_ready="false"
          fi
          echo "promotion_ready=$promotion_ready" >> "$GITHUB_OUTPUT"

          staging_url="${{ needs.deploy-current-main-to-staging.outputs.staging_url }}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## Nightly Staging Candidate"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ needs.deploy-current-main-to-staging.outputs.sha }}\` |"
            echo "| Release-candidate run | \`${{ needs.deploy-current-main-to-staging.outputs.release_candidate_run_id }}\` |"
            echo "| Workflow run | $run_url |"
            echo "| Staging URL | $staging_url |"
            echo "| Staging deploy state | success |"
            echo "| Windows staging bootstrap canary | \`${{ needs.windows-staging-bootstrap-canary.outputs.canary_result || needs.windows-staging-bootstrap-canary.result }}\` |"
            echo "| Promotion-ready preflight state | $preflight_state |"
            echo "| promotion_ready output | $promotion_ready |"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Staging is live and the current candidate passed production promotion-readiness preflight."
            elif [ "$status" -eq 10 ]; then
              echo "Staging deployed successfully; the candidate is not promotion-eligible yet. Blocked is the expected steady state between promotions, so this run stays green with promotion_ready=false."
            else
              echo "Staging deployed successfully, but the promotion-readiness gate itself could not evaluate (exit $status). This is a genuine failure; inspect the 'Verify production promotion readiness' step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 10 ]; then
            exit 0
          fi

          if [ "$status" -ne 0 ] && [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            issue_title="Nightly promotion-readiness gate failed for ${{ needs.deploy-current-main-to-staging.outputs.sha }}"
            issue_body="$(mktemp)"
            {
              echo "## Nightly promotion-readiness gate failed"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| SHA | \`${{ needs.deploy-current-main-to-staging.outputs.sha }}\` |"
              echo "| Workflow run | $run_url |"
              echo "| Gate exit code | $status |"
              echo "| Failed step | Verify production promotion readiness |"
              echo
              echo "The promotion-readiness gate could not evaluate the staging candidate (exit $status is a genuine error, not the blocked steady state 10). Inspect the workflow run logs; this workflow remains failed after writing this evidence."
            } > "$issue_body"
            existing_issue_url="$(
              gh issue list \
                --state open \
                --search "Nightly promotion-readiness gate failed in:title" \
                --json url \
                --jq '.[0].url // ""'
            )"
            if [ -n "$existing_issue_url" ]; then
              gh issue comment "$existing_issue_url" --body-file "$issue_body"
              echo "Updated existing promotion-readiness gate failure issue: $existing_issue_url" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create \
                --title "$issue_title" \
                --body-file "$issue_body"
            fi
          fi

          exit "$status"
