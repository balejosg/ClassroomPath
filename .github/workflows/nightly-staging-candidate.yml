name: Nightly Staging Candidate

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve the staging candidate without deploying staging
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: nightly-staging-candidate
  cancel-in-progress: false

jobs:
  deploy-current-main-to-staging:
    name: Deploy current main to staging
    runs-on: [self-hosted, Linux, X64, proxmox, classroompath]
    timeout-minutes: 90

    steps:
      - name: Reset OpenPath submodule checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE:-}" in
            ""|"/")
              echo "Refusing to reset OpenPath submodule checkout with unsafe GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-<empty>}" >&2
              exit 1
              ;;
          esac
          rm -rf "$GITHUB_WORKSPACE/upstream/openpath"
          rm -rf "$GITHUB_WORKSPACE/.git/modules/upstream/openpath"

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Ensure GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: 2.83.0
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              gh_arch="amd64"
              ;;
            aarch64|arm64)
              gh_arch="arm64"
              ;;
            *)
              echo "Unsupported GitHub CLI architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          gh_dir="$RUNNER_TEMP/gh-cli"
          rm -rf "$gh_dir"
          mkdir -p "$gh_dir"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_${gh_arch}.tar.gz" \
            -o "$gh_dir/gh.tar.gz"
          tar -xzf "$gh_dir/gh.tar.gz" -C "$gh_dir" --strip-components=1
          echo "$gh_dir/bin" >> "$GITHUB_PATH"
          "$gh_dir/bin/gh" --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare staging SSH key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        env:
          STAGING_SSH_KEY_SECRET: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY_SECRET"
          install -m 700 -d "$RUNNER_TEMP/classroompath-ssh"
          printf '%s\n' "$STAGING_SSH_KEY_SECRET" > "$RUNNER_TEMP/classroompath-ssh/staging"
          chmod 600 "$RUNNER_TEMP/classroompath-ssh/staging"
          echo "STAGING_SSH_KEY=$RUNNER_TEMP/classroompath-ssh/staging" >> "$GITHUB_ENV"

      - name: Resolve release-candidate manifest
        id: release-candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          node scripts/wait-for-release-candidate.mjs resolve-manifest \
            --sha "$target_sha" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 3600 \
            --interval-seconds 15 \
            --output-file release-candidate-images.env >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          staging_url="$(node scripts/deploy-targets.mjs get staging publicUrl)"
          {
            echo "## Nightly Staging Candidate Dry Run"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ steps.release-candidate.outputs.sha }}\` |"
            echo "| Release-candidate run | \`${{ steps.release-candidate.outputs.run_id }}\` |"
            echo "| Staging URL | $staging_url |"
            echo "| State | dry-run |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy staging
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        id: deploy-staging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_GHCR_USERNAME: ${{ github.actor }}
          STAGING_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run deploy:staging:assume-yes
          status="$?"
          set -e

          staging_url="$(node scripts/deploy-targets.mjs get staging publicUrl)"
          {
            echo "## Nightly Staging Candidate"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ steps.release-candidate.outputs.sha }}\` |"
            echo "| Release-candidate run | \`${{ steps.release-candidate.outputs.run_id }}\` |"
            echo "| Staging URL | $staging_url |"
            if [ "$status" -eq 0 ]; then
              echo "| State | success |"
            else
              echo "| State | failed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
