name: Firefox Release Assets

on:
  workflow_call:
    inputs:
      build_required:
        description: Whether the caller needs fresh Firefox release assets.
        required: false
        type: boolean
        default: true
      artifact_name:
        description: Optional artifact name override for downstream consumers.
        required: false
        type: string
    outputs:
      release-state:
        description: Actionable Firefox release asset state.
        value: ${{ jobs.prepare-firefox-release-assets.outputs.release-state }}
      artifact-source:
        description: Source of the Firefox release artifacts.
        value: ${{ jobs.prepare-firefox-release-assets.outputs.artifact-source }}
      amo-file-status:
        description: Last observed AMO file.status when available.
        value: ${{ jobs.prepare-firefox-release-assets.outputs.amo-file-status }}
      signed-artifacts-present:
        description: Whether signed Firefox release artifacts are present.
        value: ${{ jobs.prepare-firefox-release-assets.outputs.signed-artifacts-present }}
      amo-signing-required:
        description: Whether AMO signing was required after cache resolution.
        value: ${{ jobs.prepare-firefox-release-assets.outputs.amo-signing-required }}
  workflow_dispatch:
    inputs:
      build_required:
        description: Whether to prepare fresh Firefox release assets.
        required: false
        default: true
        type: boolean
      artifact_name:
        description: Optional artifact name override.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: firefox-release-assets-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare-firefox-release-assets:
    name: Prepare Firefox Release Assets
    runs-on: ubuntu-latest
    outputs:
      release-state: ${{ steps.evidence.outputs.release-state || steps.skipped-evidence.outputs.release-state }}
      artifact-source: ${{ steps.evidence.outputs.artifact-source || steps.skipped-evidence.outputs.artifact-source }}
      amo-file-status: ${{ steps.evidence.outputs.amo-file-status || steps.skipped-evidence.outputs.amo-file-status }}
      signed-artifacts-present: ${{ steps.evidence.outputs.signed-artifacts-present || steps.skipped-evidence.outputs.signed-artifacts-present }}
      amo-signing-required: ${{ steps.evidence.outputs.amo-signing-required || steps.skipped-evidence.outputs.amo-signing-required }}

    steps:
      - name: Decide whether to prepare Firefox release assets
        id: mode
        shell: bash
        env:
          CALL_BUILD_REQUIRED: ${{ inputs.build_required }}
          DISPATCH_BUILD_REQUIRED: ${{ github.event.inputs.build_required }}
        run: |
          set -euo pipefail

          build_required="${CALL_BUILD_REQUIRED:-}"
          if [ -z "$build_required" ]; then
            build_required="${DISPATCH_BUILD_REQUIRED:-}"
          fi
          if [ -z "$build_required" ]; then
            build_required='true'
          fi

          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"

      - name: Record skipped Firefox release asset evidence
        id: skipped-evidence
        if: steps.mode.outputs.build_required != 'true'
        run: |
          {
            echo "release-state=skipped"
            echo "artifact-source=skipped"
            echo "amo-file-status="
            echo "signed-artifacts-present=false"
            echo "amo-signing-required=false"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout with submodules
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        if: steps.mode.outputs.build_required == 'true'
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: upstream/openpath/package-lock.json

      - name: Install OpenPath dependencies
        if: steps.mode.outputs.build_required == 'true'
        working-directory: upstream/openpath
        run: npm ci

      - name: Resolve OpenPath SHA
        if: steps.mode.outputs.build_required == 'true'
        id: openpath
        run: |
          echo "sha=$(git -C upstream/openpath rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Firefox extension dist
        if: steps.mode.outputs.build_required == 'true'
        working-directory: upstream/openpath
        run: npm run build --workspace=@openpath/firefox-extension

      - name: Derive Firefox release payload hash
        if: steps.mode.outputs.build_required == 'true'
        id: payload
        working-directory: upstream/openpath
        run: |
          set -euo pipefail
          payload_hash="$(npm run --silent release:payload-hash --workspace=@openpath/firefox-extension)"
          echo "FIREFOX_RELEASE_PAYLOAD_HASH=$payload_hash" >> "$GITHUB_ENV"
          echo "payload_hash=$payload_hash" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$payload_hash" > firefox-extension/payload-hash.txt

      - name: Reuse signed Firefox release assets when payload is unchanged
        if: steps.mode.outputs.build_required == 'true'
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          FIREFOX_RELEASE_PAYLOAD_HASH: ${{ steps.payload.outputs.payload_hash }}
          FIREFOX_RELEASE_ASSETS_FALLBACK_REPO: balejosg/OpenPath
        run: |
          set -euo pipefail
          node scripts/resolve-firefox-release-assets-cache.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --fallback-repo "$FIREFOX_RELEASE_ASSETS_FALLBACK_REPO" \
            --artifact-name "openpath-firefox-release-assets-${FIREFOX_RELEASE_PAYLOAD_HASH}" \
            --payload-hash "$FIREFOX_RELEASE_PAYLOAD_HASH" \
            --output-dir upstream/openpath/firefox-extension >> "$GITHUB_OUTPUT"

      - name: Report Firefox release asset cache decision
        if: steps.mode.outputs.build_required == 'true'
        env:
          PAYLOAD_HASH: ${{ steps.payload.outputs.payload_hash }}
          ARTIFACT_NAME: openpath-firefox-release-assets-${{ steps.payload.outputs.payload_hash }}
          SOURCE_REPO: ${{ steps.cache.outputs.source_repo }}
          RESOLVED: ${{ steps.cache.outputs.resolved }}
          CACHE_MISS_REASON: ${{ steps.cache.outputs.cache_miss_reason }}
        run: |
          set -euo pipefail

          source_repo="${SOURCE_REPO:-none}"
          cache_miss_reason="${CACHE_MISS_REASON:-none}"
          amo_signing_required='false'
          if [ "$RESOLVED" != "true" ]; then
            amo_signing_required='true'
            echo "::notice title=AMO signing required::AMO signing required because signed artifact cache miss: payload_hash=$PAYLOAD_HASH artifact_name=$ARTIFACT_NAME cache_miss_reason=$cache_miss_reason"
          fi

          echo "::notice title=Firefox release asset cache::payload_hash=$PAYLOAD_HASH artifact_name=$ARTIFACT_NAME source_repo=$source_repo resolved=$RESOLVED cache_miss_reason=$cache_miss_reason amo_signing_required=$amo_signing_required"
          {
            echo "### Firefox release asset cache"
            echo "- payload_hash: $PAYLOAD_HASH"
            echo "- artifact_name: $ARTIFACT_NAME"
            echo "- source_repo: $source_repo"
            echo "- resolved: $RESOLVED"
            echo "- cache_miss_reason: $cache_miss_reason"
            echo "- amo_signing_required: $amo_signing_required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Derive stable Firefox release version
        if: steps.mode.outputs.build_required == 'true' && steps.cache.outputs.resolved != 'true'
        run: |
          version="$(node scripts/firefox-release-version.mjs \
            --manifest upstream/openpath/firefox-extension/manifest.json \
            --source-revision upstream/openpath)"
          echo "OPENPATH_FIREFOX_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Signing Firefox release as version $version"

      - name: Sign Firefox release bundle
        id: sign
        if: steps.mode.outputs.build_required == 'true' && steps.cache.outputs.resolved != 'true'
        working-directory: upstream/openpath
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          WEB_EXT_SIGN_TOTAL_TIMEOUT_SECONDS: '1800'
          WEB_EXT_SIGN_APPROVAL_TIMEOUT_SECONDS: '1200'
          WEB_EXT_SIGN_PROCESS_TIMEOUT_BUFFER_SECONDS: '120'
          WEB_EXT_SIGN_RECOVERY_TIMEOUT_SECONDS: '1800'
        shell: bash
        run: |
          set +e
          npm run sign:firefox-release --workspace=@openpath/firefox-extension -- \
            --version "$OPENPATH_FIREFOX_RELEASE_VERSION" 2>&1 | tee "$RUNNER_TEMP/firefox-release-sign.log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record Firefox release payload hash
        if: steps.mode.outputs.build_required == 'true' && steps.cache.outputs.resolved != 'true'
        working-directory: upstream/openpath
        run: printf '%s\n' "$FIREFOX_RELEASE_PAYLOAD_HASH" > firefox-extension/payload-hash.txt

      - name: Classify Firefox release asset evidence
        id: evidence
        if: steps.mode.outputs.build_required == 'true'
        env:
          CACHE_RESOLVED: ${{ steps.cache.outputs.resolved }}
          CACHE_SOURCE_REPO: ${{ steps.cache.outputs.source_repo }}
          CACHE_MISS_REASON: ${{ steps.cache.outputs.cache_miss_reason }}
          SIGN_EXIT_CODE: ${{ steps.sign.outputs.exit_code }}
        run: |
          node scripts/firefox-release-evidence.mjs \
            --cache-resolved "$CACHE_RESOLVED" \
            --cache-source-repo "${CACHE_SOURCE_REPO:-}" \
            --cache-miss-reason "${CACHE_MISS_REASON:-}" \
            --sign-exit-code "${SIGN_EXIT_CODE:-}" \
            --sign-output-path "$RUNNER_TEMP/firefox-release-sign.log" \
            --release-dir upstream/openpath/firefox-extension/build/firefox-release >> "$GITHUB_OUTPUT"

      - name: Report Firefox release asset evidence
        if: steps.mode.outputs.build_required == 'true'
        env:
          RELEASE_STATE: ${{ steps.evidence.outputs.release-state }}
          ARTIFACT_SOURCE: ${{ steps.evidence.outputs.artifact-source }}
          AMO_FILE_STATUS: ${{ steps.evidence.outputs.amo-file-status }}
          SIGNED_ARTIFACTS_PRESENT: ${{ steps.evidence.outputs.signed-artifacts-present }}
          AMO_SIGNING_REQUIRED: ${{ steps.evidence.outputs.amo-signing-required }}
          CACHE_SOURCE_REPO: ${{ steps.evidence.outputs.cache-source-repo }}
          CACHE_MISS_REASON: ${{ steps.evidence.outputs.cache-miss-reason }}
        run: |
          set -euo pipefail

          release_state="${RELEASE_STATE:-unknown}"
          artifact_source="${ARTIFACT_SOURCE:-unknown}"
          amo_file_status="${AMO_FILE_STATUS:-unknown}"
          signed_artifacts_present="${SIGNED_ARTIFACTS_PRESENT:-false}"
          amo_signing_required="${AMO_SIGNING_REQUIRED:-false}"
          cache_source_repo="${CACHE_SOURCE_REPO:-none}"
          cache_miss_reason="${CACHE_MISS_REASON:-none}"

          case "$release_state" in
            cache-hit|fresh-signing|skipped)
              echo "::notice title=Firefox release asset evidence::release_state=$release_state artifact_source=$artifact_source amo_file_status=$amo_file_status signed_artifacts_present=$signed_artifacts_present amo_signing_required=$amo_signing_required"
              ;;
            manual-review-required)
              echo "::error title=AMO manual review required::Firefox release signing requires AMO review before signed artifacts are available. amo_file_status=$amo_file_status"
              ;;
            timeout)
              echo "::error title=AMO signing timeout::Firefox release signing timed out before signed artifacts were available. amo_file_status=$amo_file_status"
              ;;
            *)
              echo "::error title=Firefox release signing failed::Firefox release asset state is $release_state. amo_file_status=$amo_file_status"
              ;;
          esac

          {
            echo "### Firefox release asset evidence"
            echo "- release_state: $release_state"
            echo "- artifact_source: $artifact_source"
            echo "- amo_file_status: $amo_file_status"
            echo "- signed_artifacts_present: $signed_artifacts_present"
            echo "- amo_signing_required: $amo_signing_required"
            echo "- cache_source_repo: $cache_source_repo"
            echo "- cache_miss_reason: $cache_miss_reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require signed Firefox release artifacts
        if: steps.mode.outputs.build_required == 'true'
        env:
          RELEASE_STATE: ${{ steps.evidence.outputs.release-state }}
          SIGNED_ARTIFACTS_PRESENT: ${{ steps.evidence.outputs.signed-artifacts-present }}
          AMO_FILE_STATUS: ${{ steps.evidence.outputs.amo-file-status }}
        run: |
          set -euo pipefail

          case "${RELEASE_STATE:-}" in
            cache-hit|fresh-signing)
              ;;
            manual-review-required)
              echo "::error title=AMO manual review required::Signed Firefox release artifacts are required, but AMO has not made them available yet. amo_file_status=${AMO_FILE_STATUS:-unknown}"
              exit 1
              ;;
            timeout)
              echo "::error title=AMO signing timeout::Signed Firefox release artifacts are required, but signing timed out. amo_file_status=${AMO_FILE_STATUS:-unknown}"
              exit 1
              ;;
            *)
              echo "::error title=Firefox release artifacts unavailable::Signed Firefox release artifacts are required; release_state=${RELEASE_STATE:-unknown} amo_file_status=${AMO_FILE_STATUS:-unknown}"
              exit 1
              ;;
          esac

          if [ "${SIGNED_ARTIFACTS_PRESENT:-false}" != "true" ]; then
            echo "::error title=Missing signed Firefox release artifacts::release_state=${RELEASE_STATE:-unknown} amo_file_status=${AMO_FILE_STATUS:-unknown}"
            exit 1
          fi

      - name: Verify Firefox release artifacts
        if: steps.mode.outputs.build_required == 'true'
        working-directory: upstream/openpath
        run: |
          test -f firefox-extension/dist/background.js
          test -f firefox-extension/build/firefox-release/metadata.json
          test -f firefox-extension/build/firefox-release/openpath-firefox-extension.xpi
          test -f firefox-extension/payload-hash.txt
          test "$(cat firefox-extension/payload-hash.txt)" = "$FIREFOX_RELEASE_PAYLOAD_HASH"
          node firefox-extension/verify-firefox-release-artifacts.mjs \
            --release-dir firefox-extension/build/firefox-release \
            --payload-hash "$FIREFOX_RELEASE_PAYLOAD_HASH"

      - name: Resolve artifact name
        if: steps.mode.outputs.build_required == 'true'
        id: artifact
        shell: bash
        env:
          CALL_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          DISPATCH_ARTIFACT_NAME: ${{ github.event.inputs.artifact_name }}
          OPENPATH_SHA: ${{ steps.openpath.outputs.sha }}
        run: |
          set -euo pipefail

          artifact_name="${CALL_ARTIFACT_NAME:-}"
          if [ -z "$artifact_name" ]; then
            artifact_name="${DISPATCH_ARTIFACT_NAME:-}"
          fi
          if [ -z "$artifact_name" ]; then
            artifact_name="openpath-firefox-release-assets-${OPENPATH_SHA}"
          fi

          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload Firefox release assets
        if: steps.mode.outputs.build_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            upstream/openpath/firefox-extension/dist/**
            upstream/openpath/firefox-extension/build/firefox-release/**
            upstream/openpath/firefox-extension/payload-hash.txt
          if-no-files-found: error

      - name: Upload reusable Firefox release assets
        if: steps.mode.outputs.build_required == 'true' && (steps.cache.outputs.resolved != 'true' || steps.cache.outputs.source_repo != github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: openpath-firefox-release-assets-${{ steps.payload.outputs.payload_hash }}
          path: |
            upstream/openpath/firefox-extension/dist/**
            upstream/openpath/firefox-extension/build/firefox-release/**
            upstream/openpath/firefox-extension/payload-hash.txt
          if-no-files-found: error
