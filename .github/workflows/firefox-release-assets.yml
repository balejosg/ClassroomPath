name: Firefox Release Assets

on:
  push:
    branches:
      - main
    paths:
      - 'upstream/openpath'
      - 'docker/Dockerfile.api'
      - '.github/workflows/firefox-release-assets.yml'
      - '.github/workflows/release-candidate-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-release-assets-main
  cancel-in-progress: true

jobs:
  prepare-firefox-release-assets:
    name: Prepare Firefox Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: upstream/openpath/package-lock.json

      - name: Install OpenPath dependencies
        working-directory: upstream/openpath
        run: npm ci

      - name: Resolve OpenPath SHA
        id: openpath
        run: |
          echo "sha=$(git -C upstream/openpath rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Firefox extension dist
        working-directory: upstream/openpath
        run: npm run build --workspace=@openpath/firefox-extension

      - name: Derive unique Firefox release version
        working-directory: upstream/openpath
        run: |
          base_version="$(node --input-type=module -e "import fs from 'node:fs'; const manifest = JSON.parse(fs.readFileSync('firefox-extension/manifest.json', 'utf8')); process.stdout.write(String(manifest.version ?? '').trim());")"
          test -n "$base_version"
          run_id_suffix="${GITHUB_RUN_ID: -7}"
          run_id_component="$((10#$run_id_suffix))"
          ci_build_segment="$(printf '%d%02d' "$run_id_component" "$GITHUB_RUN_ATTEMPT")"
          echo "OPENPATH_FIREFOX_RELEASE_VERSION=${base_version}.${ci_build_segment}" >> "$GITHUB_ENV"
          echo "Signing Firefox release as version ${base_version}.${ci_build_segment}"

      - name: Sign Firefox release bundle
        working-directory: upstream/openpath
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npm run sign:firefox-release --workspace=@openpath/firefox-extension -- \
            --version "$OPENPATH_FIREFOX_RELEASE_VERSION"

      - name: Verify Firefox release artifacts
        working-directory: upstream/openpath
        run: |
          test -f firefox-extension/dist/background.js
          test -f firefox-extension/build/firefox-release/metadata.json
          test -f firefox-extension/build/firefox-release/openpath-firefox-extension.xpi

      - name: Upload Firefox release assets
        uses: actions/upload-artifact@v7
        with:
          name: openpath-firefox-release-assets-${{ steps.openpath.outputs.sha }}
          path: |
            upstream/openpath/firefox-extension/dist/**
            upstream/openpath/firefox-extension/build/firefox-release/**
          if-no-files-found: error
