name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'upstream/openpath/**'
      - 'config/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Deploying to STAGING..."
            cd /opt/classroompath/app
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            cd /opt/classroompath
            docker compose build --no-cache
            docker compose down
            docker compose up -d
            sleep 10
            curl -sf http://localhost:3000/health && echo "✅ Staging OK" || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve deploy host
        id: resolve
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try to resolve hostname
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "DNS resolution attempt $i of $MAX_RETRIES..."
            IP=$(getent hosts "$HOST" 2>/dev/null | awk '{print $1}' | head -1)

            if [ -z "$IP" ]; then
              IP=$(dig +short "$HOST" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            fi

            if [ -n "$IP" ]; then
              echo "Resolved $HOST to $IP"
              echo "ip=$IP" >> $GITHUB_OUTPUT
              echo "port=$PORT" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 5
          done

          echo "Could not resolve $HOST"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        if: steps.resolve.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "Starting ClassroomPath Docker deployment..."

            DEPLOY_DIR="/opt/classroompath"
            APP_DIR="$DEPLOY_DIR/app"
            
            cd "$APP_DIR"

            # Pull latest changes with submodules
            echo "Pulling latest changes..."
            git fetch origin main
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git reset --hard origin/main
            git submodule update --init --recursive

            # Rebuild and restart Docker
            cd "$DEPLOY_DIR"
            echo "Rebuilding Docker image..."
            docker compose build --no-cache

            echo "Restarting containers..."
            docker compose down
            docker compose up -d

            # Verify health
            echo "Waiting for service to start..."
            sleep 10
            
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ Deployment successful!"
                docker logs classroompath-api --tail 5
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 5
            done

            echo "❌ Deployment failed! Check logs:"
            docker logs classroompath-api --tail 30
            exit 1

      - name: Report skip
        if: steps.resolve.outputs.skip == 'true'
        run: |
          echo "::warning::Deployment skipped - could not resolve or connect to deploy host"
