name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-deploy-v4
  cancel-in-progress: false

env:
  CLASSROOMPATH_DEPLOY_ROOT: ${{ vars.CLASSROOMPATH_DEPLOY_ROOT || '/opt/classroompath' }}
  CLASSROOMPATH_STAGING_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
  CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL || vars.STAGING_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
  CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_GATEWAY_HEALTH_URL || vars.STAGING_GATEWAY_HEALTH_URL }}
  CLASSROOMPATH_STAGING_READY_URL: ${{ vars.CLASSROOMPATH_STAGING_READY_URL || vars.STAGING_READY_URL }}
  CLASSROOMPATH_STAGING_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_STAGING_API_HEALTH_URL || vars.STAGING_API_HEALTH_URL }}
  CLASSROOMPATH_STAGING_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_STAGING_API_CONFIG_URL || vars.STAGING_API_CONFIG_URL }}
  CLASSROOMPATH_PRODUCTION_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
  CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_CANARY_PUBLIC_URL || vars.PRODUCTION_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_PRODUCTION_PUBLIC_URL || vars.PRODUCTION_PUBLIC_URL }}
  CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL || vars.PRODUCTION_GATEWAY_HEALTH_URL }}
  CLASSROOMPATH_PRODUCTION_READY_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_READY_URL || vars.PRODUCTION_READY_URL }}
  CLASSROOMPATH_PRODUCTION_API_HEALTH_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_HEALTH_URL || vars.PRODUCTION_API_HEALTH_URL }}
  CLASSROOMPATH_PRODUCTION_API_CONFIG_URL: ${{ vars.CLASSROOMPATH_PRODUCTION_API_CONFIG_URL || vars.PRODUCTION_API_CONFIG_URL }}

# NOTE: Staging deploys are handled locally via `npm run deploy:staging`.
# Production rollouts are intentionally tag-only (`v*`) so the server can be
# reconciled exclusively through GitHub Actions.

jobs:
  verify-openpath-upstream:
    name: Verify OpenPath Upstream Checks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      openpath_sha: ${{ steps.verify.outputs.openpath_sha }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Resolve OpenPath required-check base
        id: openpath-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$previous_tag" ] && git rev-parse "$previous_tag:upstream/openpath" >/dev/null 2>&1; then
            echo "openpath_base_sha=$(git rev-parse "$previous_tag:upstream/openpath")" >> "$GITHUB_OUTPUT"
          else
            echo "openpath_base_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required OpenPath checks for submodule SHA
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENPATH_BASE_SHA: ${{ steps.openpath-base.outputs.openpath_base_sha }}
        run: |
          export OPENPATH_SHA="$(git -C upstream/openpath rev-parse HEAD)"
          echo "openpath_sha=$OPENPATH_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "${OPENPATH_BASE_SHA:-}" ]; then
            git -C upstream/openpath fetch --no-tags origin "$OPENPATH_BASE_SHA" "$OPENPATH_SHA"
          fi
          echo "Verifying OpenPath checks for $OPENPATH_SHA"
          node scripts/openpath-required-checks.mjs

  resolve-release-images:
    name: Resolve Release Images
    runs-on: ubuntu-latest
    needs: verify-openpath-upstream
    if: needs.verify-openpath-upstream.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      gateway_image: ${{ steps.release-images.outputs.gateway_image }}
      migrations_image: ${{ steps.release-images.outputs.migrations_image }}
      openpath_firefox_assets_image: ${{ steps.release-images.outputs.openpath_firefox_assets_image }}
      openpath_api_image: ${{ steps.release-images.outputs.openpath_api_image }}
      openpath_version: ${{ steps.release-images.outputs.openpath_version }}
      openpath_linux_agent_version: ${{ steps.release-images.outputs.linux_agent_version }}
      openpath_linux_agent_apt_suite: ${{ steps.release-images.outputs.linux_agent_apt_suite }}
      spa_image: ${{ steps.release-images.outputs.spa_image }}
      verifier_image: ${{ steps.release-images.outputs.verifier_image }}
      manifest_base64: ${{ steps.release-images.outputs.manifest_base64 }}
      payload_base64: ${{ steps.deploy-payload.outputs.payload_base64 }}
      staging_container_platform: ${{ steps.deploy-targets.outputs.staging_container_platform }}
      production_container_platform: ${{ steps.deploy-targets.outputs.production_container_platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve approved release candidate manifest
        id: release-images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          node scripts/wait-for-release-candidate.mjs resolve-manifest \
            --sha "$TARGET_SHA" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 60 \
            --interval-seconds 5 \
            --output-file release-images.env >> "$GITHUB_OUTPUT"

          echo "manifest_base64=$(base64 < release-images.env | tr -d '\n')" >> "$GITHUB_OUTPUT"
          printf 'TAG_NAME=%s\n' '${{ github.ref_name }}' >> release-images.env

      - name: Resolve deploy targets
        id: deploy-targets
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r key value; do
            echo "staging_${key}=$value" >> "$GITHUB_OUTPUT"
          done < <(node scripts/deploy-targets.mjs outputs staging)

          while IFS='=' read -r key value; do
            echo "production_${key}=$value" >> "$GITHUB_OUTPUT"
          done < <(node scripts/deploy-targets.mjs outputs production)

      - name: Verify production release image platforms
        shell: bash
        env:
          RELEASE_MANIFEST_B64: ${{ steps.release-images.outputs.manifest_base64 }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ steps.deploy-targets.outputs.production_container_platform }}
        run: |
          set -euo pipefail
          node scripts/verify-release-manifest-platforms.mjs verify \
            --manifest-base64 "$RELEASE_MANIFEST_B64" \
            --target-platform "$PRODUCTION_CONTAINER_PLATFORM"

      - name: Verify OpenPath Linux agent APT pin
        shell: bash
        env:
          OPENPATH_LINUX_AGENT_VERSION: ${{ steps.release-images.outputs.linux_agent_version }}
          OPENPATH_LINUX_AGENT_APT_SUITE: ${{ steps.release-images.outputs.linux_agent_apt_suite }}
        run: |
          set -euo pipefail
          node scripts/resolve-openpath-linux-agent-version.mjs verify-runtime-pin
          node scripts/resolve-openpath-linux-agent-version.mjs install-probe-script \
            | docker run --rm -i ubuntu:24.04 bash

      - name: Build deploy payload
        id: deploy-payload
        shell: bash
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          RELEASE_MANIFEST_B64: ${{ steps.release-images.outputs.manifest_base64 }}
        run: |
          set -euo pipefail
          node scripts/lib/deploy-payload.mjs render-github-output \
            --target-environment production \
            --deploy-ref "$DEPLOY_REF" \
            --deploy-sha "$DEPLOY_SHA" \
            --deployment-mode promotion-eligible \
            --manifest-base64 "$RELEASE_MANIFEST_B64" >> "$GITHUB_OUTPUT"

      - name: Upload release image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-image-metadata-${{ github.ref_name }}
          path: release-images.env
          retention-days: 14

  verify-staging-release-state:
    name: Verify Staging Release State
    runs-on: ubuntu-latest
    needs: resolve-release-images
    if: needs.resolve-release-images.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      staging_windows_firefox_high_risk: ${{ steps.risk.outputs.high_risk }}
      staging_windows_firefox_risk_base_ref: ${{ steps.risk.outputs.base_ref }}
      staging_windows_firefox_risk_base_source: ${{ steps.risk.outputs.base_source }}
      staging_email_delivery_high_risk: ${{ steps.email-risk.outputs.high_risk }}
      promotion_eligible: ${{ steps.compare.outputs.promotion_eligible }}
      promotion_deployment_mode: ${{ steps.compare.outputs.promotion_deployment_mode }}
      staging_smoke_result: ${{ steps.compare.outputs.staging_smoke_result }}
      staging_smoke_status: ${{ steps.compare.outputs.staging_smoke_status }}
      staging_release_gate_result: ${{ steps.compare.outputs.staging_release_gate_result }}
      staging_enrollment_download_result: ${{ steps.compare.outputs.staging_enrollment_download_result }}
      staging_linux_enrollment_script_result: ${{ steps.compare.outputs.staging_linux_enrollment_script_result }}
      staging_windows_enrollment_script_result: ${{ steps.compare.outputs.staging_windows_enrollment_script_result }}
      staging_windows_bootstrap_result: ${{ steps.compare.outputs.staging_windows_bootstrap_result }}
      staging_firefox_policy_result: ${{ steps.compare.outputs.staging_firefox_policy_result }}
      staging_firefox_extension_id: ${{ steps.compare.outputs.staging_firefox_extension_id }}
      staging_firefox_release_version: ${{ steps.compare.outputs.staging_firefox_release_version }}
      staging_firefox_metadata_sha256: ${{ steps.compare.outputs.staging_firefox_metadata_sha256 }}
      staging_firefox_xpi_sha256: ${{ steps.compare.outputs.staging_firefox_xpi_sha256 }}
      staging_linux_bootstrap_result: ${{ steps.compare.outputs.staging_linux_bootstrap_result }}
      staging_linux_bootstrap_run_id: ${{ steps.compare.outputs.staging_linux_bootstrap_run_id }}
      staging_linux_bootstrap_failure_boundary_id: ${{ steps.compare.outputs.staging_linux_bootstrap_failure_boundary_id }}
      staging_linux_bootstrap_failure_boundary_message: ${{ steps.compare.outputs.staging_linux_bootstrap_failure_boundary_message }}
      staging_windows_self_update_result: ${{ steps.compare.outputs.staging_windows_self_update_result }}
      staging_linux_self_update_result: ${{ steps.compare.outputs.staging_linux_self_update_result }}
      staging_prepromotion_rehearsal_result: ${{ steps.compare.outputs.staging_prepromotion_rehearsal_result }}
      staging_verified_at: ${{ steps.compare.outputs.staging_verified_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve staging host
        id: resolve
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production promotion" \
            STAGING_DEPLOY_HOST "$STAGING_HOST" \
            STAGING_DEPLOY_USER "$STAGING_USER" \
            STAGING_DEPLOY_SSH_KEY "$STAGING_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$STAGING_HOST" \
            "${STAGING_PORT:-22}" \
            "$STAGING_USER" \
            "production promotion" >> "$GITHUB_OUTPUT"

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production promotion" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production promotion" >> "$GITHUB_OUTPUT"

      - name: Install staging SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$STAGING_SSH_KEY" ~/.ssh/classroompath-staging-release

      - name: Install production SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-release

      - name: Extract staging evidence from production tag
        id: tag-evidence
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > production-tag-message.txt
          if node scripts/promotion-evidence-cli.mjs extract-tag-message \
            --message-file production-tag-message.txt \
            --staging-current-output staging-release-state.env \
            --staging-verification-output staging-verification.env 2>/dev/null; then
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            rm -f staging-release-state.env staging-verification.env
            echo "source=ssh" >> "$GITHUB_OUTPUT"
          fi

      - name: Read staging release state
        if: steps.tag-evidence.outputs.source != 'tag'
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_read_file \
            ~/.ssh/classroompath-staging-release \
            "${{ steps.resolve.outputs.port }}" \
            "${{ steps.resolve.outputs.user }}" \
            "${{ steps.resolve.outputs.ip }}" \
            /srv/classroompath/release-state/current-images.env > staging-release-state.env

      - name: Read staging verification evidence
        if: steps.tag-evidence.outputs.source != 'tag'
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_read_file \
            ~/.ssh/classroompath-staging-release \
            "${{ steps.resolve.outputs.port }}" \
            "${{ steps.resolve.outputs.user }}" \
            "${{ steps.resolve.outputs.ip }}" \
            /srv/classroompath/release-state/staging-verification.env > staging-verification.env

      - name: Read production release state
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          production_release_state_path="${CLASSROOMPATH_DEPLOY_ROOT%/}/release-state/current-images.env"
          github_actions_remote_read_file \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            "$production_release_state_path" > production-release-state.env

      - name: Detect promoted Windows/Firefox risk
        id: risk
        shell: bash
        env:
          PRODUCTION_RELEASE_STATE_PATH: production-release-state.env
          TARGET_SHA: ${{ github.sha }}
        run: bash scripts/detect-windows-firefox-risk.sh

      - name: Detect promoted email delivery risk
        id: email-risk
        shell: bash
        env:
          PRODUCTION_RELEASE_STATE_PATH: production-release-state.env
          TARGET_SHA: ${{ github.sha }}
        run: bash scripts/detect-email-delivery-risk.sh

      - name: Compare staging release state
        id: compare
        shell: bash
        env:
          HIGH_RISK: ${{ steps.risk.outputs.high_risk }}
          EXPECTED_APP_SHA: ${{ github.sha }}
          EXPECTED_GATEWAY_IMAGE: ${{ needs.resolve-release-images.outputs.gateway_image }}
          EXPECTED_MIGRATIONS_IMAGE: ${{ needs.resolve-release-images.outputs.migrations_image }}
          EXPECTED_OPENPATH_FIREFOX_ASSETS_IMAGE: ${{ needs.resolve-release-images.outputs.openpath_firefox_assets_image }}
          EXPECTED_OPENPATH_API_IMAGE: ${{ needs.resolve-release-images.outputs.openpath_api_image }}
          EXPECTED_OPENPATH_VERSION: ${{ needs.resolve-release-images.outputs.openpath_version }}
          EXPECTED_OPENPATH_LINUX_AGENT_VERSION: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_version }}
          EXPECTED_OPENPATH_LINUX_AGENT_APT_SUITE: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_apt_suite }}
          EXPECTED_SPA_IMAGE: ${{ needs.resolve-release-images.outputs.spa_image }}
        run: bash scripts/verify-staging-release-state.sh

      - name: Upload staging release state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-state-${{ github.ref_name }}
          path: |
            production-release-state.env
            staging-release-state.env
            staging-verification.env
            staging-promotion-eligibility.json
          retention-days: 7

  windows-firefox-canary:
    name: Windows Firefox Canary
    needs: verify-staging-release-state
    if: needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk == 'true'
    uses: ./.github/workflows/windows-firefox-canary.yml
    with:
      staging_canary_public_url: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL || vars.STAGING_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
    secrets: inherit

  windows-staging-bootstrap-canary:
    name: Windows Staging Bootstrap Canary
    needs: [resolve-release-images, verify-staging-release-state]
    if: needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk == 'true'
    uses: ./.github/workflows/windows-production-bootstrap-canary.yml
    with:
      target_environment: staging
      base_url: ${{ vars.CLASSROOMPATH_STAGING_CANARY_PUBLIC_URL || vars.STAGING_CANARY_PUBLIC_URL || vars.CLASSROOMPATH_STAGING_PUBLIC_URL || vars.STAGING_PUBLIC_URL }}
      diagnostic_mode: ${{ 'false' }}
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [resolve-release-images, verify-staging-release-state, windows-staging-bootstrap-canary]
    if: always() && needs.resolve-release-images.result == 'success' && needs.verify-staging-release-state.result == 'success' && (needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk != 'true' || needs.windows-staging-bootstrap-canary.result == 'success') && startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy host
        id: resolve
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "" \
            "production deployment" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MANIFEST_B64: ${{ needs.resolve-release-images.outputs.manifest_base64 }}
          DEPLOY_PAYLOAD_B64: ${{ needs.resolve-release-images.outputs.payload_base64 }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ needs.resolve-release-images.outputs.production_container_platform }}
          PRODUCTION_DB_BACKUP_COMMAND: ${{ secrets.PRODUCTION_DB_BACKUP_COMMAND }}
          PRODUCTION_DB_BACKUP_ID: ${{ secrets.PRODUCTION_DB_BACKUP_ID }}
          CP_BILLING_MODE: ${{ vars.CP_BILLING_MODE }}
          CP_PLATFORM_ADMIN_EMAILS: ${{ secrets.CP_PLATFORM_ADMIN_EMAILS }}
          CP_CLIENT_CANARY_ADMIN_TOKEN: ${{ secrets.CP_CLIENT_CANARY_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_ANNUAL_PRICE_1_10: ${{ secrets.STRIPE_ANNUAL_PRICE_1_10 }}
          STRIPE_ANNUAL_PRICE_11_25: ${{ secrets.STRIPE_ANNUAL_PRICE_11_25 }}
          STRIPE_ANNUAL_PRICE_26_50: ${{ secrets.STRIPE_ANNUAL_PRICE_26_50 }}
          STRIPE_ANNUAL_PRICE_51_100: ${{ secrets.STRIPE_ANNUAL_PRICE_51_100 }}
          STRIPE_ONBOARDING_PRICE_1_25: ${{ secrets.STRIPE_ONBOARDING_PRICE_1_25 }}
          STRIPE_ONBOARDING_PRICE_26_100: ${{ secrets.STRIPE_ONBOARDING_PRICE_26_100 }}
          STRIPE_PILOT_PRICE: ${{ secrets.STRIPE_PILOT_PRICE }}
          CP_EMAIL_PREFLIGHT_ALLOW_DAILY_QUOTA: ${{ needs.verify-staging-release-state.outputs.staging_email_delivery_high_risk == 'true' && '0' || '1' }}
          CP_EMAIL_PREFLIGHT_MODE: ${{ needs.verify-staging-release-state.outputs.staging_email_delivery_high_risk == 'true' && 'required' || 'skip' }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PAYLOAD_B64,DEPLOY_REF,DEPLOY_SHA,RELEASE_MANIFEST_B64,PRODUCTION_CONTAINER_PLATFORM,PRODUCTION_DB_BACKUP_COMMAND,PRODUCTION_DB_BACKUP_ID,CLASSROOMPATH_DEPLOY_ROOT,CP_BILLING_MODE,CP_PLATFORM_ADMIN_EMAILS,CP_CLIENT_CANARY_ADMIN_TOKEN,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_CONTACT,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_ANNUAL_PRICE_1_10,STRIPE_ANNUAL_PRICE_11_25,STRIPE_ANNUAL_PRICE_26_50,STRIPE_ANNUAL_PRICE_51_100,STRIPE_ONBOARDING_PRICE_1_25,STRIPE_ONBOARDING_PRICE_26_100,STRIPE_PILOT_PRICE,CP_EMAIL_PREFLIGHT_ALLOW_DAILY_QUOTA,CP_EMAIL_PREFLIGHT_MODE
          script_path: scripts/deploy-production-remote.sh

      - name: Download deploy debug artifact
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-debug
          deploy_debug_path="${CLASSROOMPATH_DEPLOY_ROOT%/}/release-state/deploy-debug.json"
          github_actions_remote_read_file \
            ~/.ssh/classroompath-production-debug \
            "${{ steps.resolve.outputs.port }}" \
            "${{ secrets.DEPLOY_USER }}" \
            "${{ steps.resolve.outputs.ip }}" \
            "$deploy_debug_path" > deploy-debug.json

      - name: Upload deploy debug artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-debug-${{ github.ref_name }}
          if-no-files-found: ignore
          path: deploy-debug.json
          retention-days: 7

  smoke-test-production:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [deploy-production, resolve-release-images]
    if: always() && needs.deploy-production.result == 'success' && needs.resolve-release-images.result == 'success'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for production readiness
        shell: bash
        run: bash scripts/wait-for-ready.sh "$CLASSROOMPATH_PRODUCTION_READY_URL"

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production smoke" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-smoke

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment smoke canary
        id: provision-enrollment
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ env.CLASSROOMPATH_PRODUCTION_PUBLIC_URL }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download live enrollment scripts
        shell: bash
        env:
          ENROLLMENT_CANARY_BASE_URL: ${{ env.CLASSROOMPATH_PRODUCTION_PUBLIC_URL }}
          ENROLLMENT_CANARY_CLASSROOM_ID: ${{ steps.provision-enrollment.outputs.classroom_id }}
          ENROLLMENT_CANARY_TOKEN: ${{ steps.provision-enrollment.outputs.enrollment_token }}
          ENROLLMENT_CANARY_EXPECTED_LINUX_AGENT_VERSION: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_version }}
          ENROLLMENT_CANARY_ENVIRONMENT: production
          ENROLLMENT_CANARY_OUTPUT: production-enrollment-download-canary.json
        run: |
          set -euo pipefail
          node scripts/enrollment-download-canary.mjs
          test -f production-enrollment-download-canary.json

      - name: Run smoke tests against production
        id: smoke
        env:
          SMOKE_TEST_URL: ${{ env.CLASSROOMPATH_PRODUCTION_PUBLIC_URL }}
          SMOKE_TEST_TIMEOUT: '30000'
          SMOKE_REQUIRE_PUSH: '1'
          CLASSROOMPATH_VERIFIER_IMAGE: ${{ needs.resolve-release-images.outputs.verifier_image }}
        run: |
          bash scripts/run-smoke-in-verifier.sh
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Upload smoke test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-production
          path: |
            smoke-results.txt
            production-enrollment-download-canary.json
          retention-days: 7

      - name: Report smoke test failure
        if: failure()
        run: |
          echo "::error::PRODUCTION smoke tests FAILED! The deployment may be broken."
          echo "::error::Check the smoke test results for details."
          echo ""
          echo "Common issues:"
          echo "  - NPM reverse proxy stripping /api/ prefix"
          echo "  - CORS_ORIGINS not including production domain"
          echo "  - Container health check passed but service not fully ready"
          echo ""
          echo "Debug commands (run on production server):"
          echo "  curl -i $CLASSROOMPATH_PRODUCTION_GATEWAY_HEALTH_URL"
          echo "  curl -i $CLASSROOMPATH_PRODUCTION_READY_URL"
          echo "  docker logs classroompath-api --tail 50"

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    needs:
      [
        verify-openpath-upstream,
        resolve-release-images,
        verify-staging-release-state,
        windows-firefox-canary,
        windows-staging-bootstrap-canary,
        deploy-production,
        smoke-test-production,
        rollback-production,
      ]
    if: always() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Load staging deploy target
        id: staging-target
        run: node scripts/deploy-targets.mjs outputs staging >> "$GITHUB_OUTPUT"

      - name: Load production deploy target
        id: production-target
        run: node scripts/deploy-targets.mjs outputs production >> "$GITHUB_OUTPUT"

      - name: Generate release timing summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-timing-summary
          node scripts/run-github-run-timing-summary.mjs \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --artifact-dir release-timing-summary \
            > release-timing-summary/run-timing-summary.md
          cat release-timing-summary/run-timing-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release evidence
        run: |
          cat > release-evidence-input.json <<'EOF'
          {
            "GITHUB_REPOSITORY": "${{ github.repository }}",
            "GITHUB_RUN_ID": "${{ github.run_id }}",
            "GITHUB_SERVER_URL": "${{ github.server_url }}",
            "TAG_NAME": "${{ github.ref_name }}",
            "APP_SHA": "${{ github.sha }}",
            "OPENPATH_SHA": "${{ needs.verify-openpath-upstream.outputs.openpath_sha }}",
            "STAGING_URL": "${{ steps.staging-target.outputs.public_url }}",
            "STAGING_GATEWAY_HEALTH_URL": "${{ steps.staging-target.outputs.gateway_health_url }}",
            "STAGING_READY_URL": "${{ steps.staging-target.outputs.ready_url }}",
            "STAGING_API_CONFIG_URL": "${{ steps.staging-target.outputs.api_config_url }}",
            "PRODUCTION_URL": "${{ steps.production-target.outputs.public_url }}",
            "PRODUCTION_GATEWAY_HEALTH_URL": "${{ steps.production-target.outputs.gateway_health_url }}",
            "PRODUCTION_READY_URL": "${{ steps.production-target.outputs.ready_url }}",
            "PRODUCTION_API_CONFIG_URL": "${{ steps.production-target.outputs.api_config_url }}",
            "RUN_TIMING_SUMMARY_PATH": "release-timing-summary/run-timing-summary.json",
            "VERIFY_OPENPATH_RESULT": "${{ needs.verify-openpath-upstream.result }}",
            "RESOLVE_IMAGES_RESULT": "${{ needs.resolve-release-images.result }}",
            "VERIFY_STAGING_RESULT": "${{ needs.verify-staging-release-state.result }}",
            "PROMOTION_ELIGIBLE": "${{ needs.verify-staging-release-state.outputs.promotion_eligible }}",
            "PROMOTION_DEPLOYMENT_MODE": "${{ needs.verify-staging-release-state.outputs.promotion_deployment_mode }}",
            "STAGING_SMOKE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_smoke_result }}",
            "STAGING_SMOKE_STATUS": "${{ needs.verify-staging-release-state.outputs.staging_smoke_status }}",
            "STAGING_RELEASE_GATE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_release_gate_result }}",
            "STAGING_ENROLLMENT_DOWNLOAD_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_enrollment_download_result }}",
            "STAGING_LINUX_ENROLLMENT_SCRIPT_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_linux_enrollment_script_result }}",
            "STAGING_WINDOWS_ENROLLMENT_SCRIPT_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_windows_enrollment_script_result }}",
            "STAGING_WINDOWS_FIREFOX_HIGH_RISK": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk }}",
            "STAGING_EMAIL_DELIVERY_HIGH_RISK": "${{ needs.verify-staging-release-state.outputs.staging_email_delivery_high_risk }}",
            "STAGING_WINDOWS_FIREFOX_RISK_BASE_REF": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_risk_base_ref }}",
            "STAGING_WINDOWS_FIREFOX_RISK_BASE_SOURCE": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_risk_base_source }}",
            "STAGING_WINDOWS_BOOTSTRAP_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_windows_bootstrap_result }}",
            "STAGING_FIREFOX_POLICY_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_firefox_policy_result }}",
            "STAGING_FIREFOX_EXTENSION_ID": "${{ needs.verify-staging-release-state.outputs.staging_firefox_extension_id }}",
            "STAGING_FIREFOX_RELEASE_VERSION": "${{ needs.verify-staging-release-state.outputs.staging_firefox_release_version }}",
            "STAGING_FIREFOX_METADATA_SHA256": "${{ needs.verify-staging-release-state.outputs.staging_firefox_metadata_sha256 }}",
            "STAGING_FIREFOX_XPI_SHA256": "${{ needs.verify-staging-release-state.outputs.staging_firefox_xpi_sha256 }}",
            "STAGING_LINUX_BOOTSTRAP_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_linux_bootstrap_result }}",
            "STAGING_LINUX_BOOTSTRAP_RUN_ID": "${{ needs.verify-staging-release-state.outputs.staging_linux_bootstrap_run_id }}",
            "STAGING_LINUX_BOOTSTRAP_FAILURE_BOUNDARY_ID": "${{ needs.verify-staging-release-state.outputs.staging_linux_bootstrap_failure_boundary_id }}",
            "STAGING_LINUX_BOOTSTRAP_FAILURE_BOUNDARY_MESSAGE": "${{ needs.verify-staging-release-state.outputs.staging_linux_bootstrap_failure_boundary_message }}",
            "STAGING_WINDOWS_SELF_UPDATE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_windows_self_update_result }}",
            "STAGING_LINUX_SELF_UPDATE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_linux_self_update_result }}",
            "STAGING_PREPROMOTION_REHEARSAL_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_prepromotion_rehearsal_result }}",
            "STAGING_VERIFIED_AT": "${{ needs.verify-staging-release-state.outputs.staging_verified_at }}",
            "WINDOWS_FIREFOX_CANARY_RESULT": "${{ needs.windows-firefox-canary.outputs.canary_result || needs.windows-firefox-canary.result }}",
            "WINDOWS_STAGING_BOOTSTRAP_CANARY_RESULT": "${{ needs.windows-staging-bootstrap-canary.outputs.canary_result || needs.windows-staging-bootstrap-canary.result }}",
            "PREPRODUCTION_WINDOWS_BOOTSTRAP_CANARY_RESULT": "${{ needs.windows-staging-bootstrap-canary.outputs.canary_result || needs.windows-staging-bootstrap-canary.result }}",
            "PREPRODUCTION_WINDOWS_BOOTSTRAP_CANARY_JOB_RESULT": "${{ needs.windows-staging-bootstrap-canary.result }}",
            "PREPRODUCTION_WINDOWS_BOOTSTRAP_FAILURE_BOUNDARY_ID": "${{ needs.windows-staging-bootstrap-canary.outputs.failure_boundary_id || 'preproduction-windows-bootstrap-canary' }}",
            "PREPRODUCTION_WINDOWS_BOOTSTRAP_FAILURE_BOUNDARY_MESSAGE": "${{ needs.windows-staging-bootstrap-canary.outputs.failure_boundary_message || 'Windows staging bootstrap canary did not produce a failure boundary.' }}",
            "LINUX_PRODUCTION_BOOTSTRAP_CANARY_RESULT": "not_run_preproduction_authoritative",
            "LINUX_PRODUCTION_BOOTSTRAP_CANARY_JOB_RESULT": "skipped",
            "LINUX_PRODUCTION_BOOTSTRAP_FAILURE_BOUNDARY_ID": "preproduction-installed-client-evidence",
            "LINUX_PRODUCTION_BOOTSTRAP_FAILURE_BOUNDARY_MESSAGE": "Functional installed-client evidence is gated before production promotion.",
            "DEPLOY_RESULT": "${{ needs.deploy-production.result }}",
            "PRODUCTION_SMOKE_RESULT": "${{ needs.smoke-test-production.result }}",
            "ROLLBACK_RESULT": "${{ needs.rollback-production.result }}",
            "GATEWAY_IMAGE": "${{ needs.resolve-release-images.outputs.gateway_image }}",
            "MIGRATIONS_IMAGE": "${{ needs.resolve-release-images.outputs.migrations_image }}",
            "OPENPATH_FIREFOX_ASSETS_IMAGE": "${{ needs.resolve-release-images.outputs.openpath_firefox_assets_image }}",
            "OPENPATH_API_IMAGE": "${{ needs.resolve-release-images.outputs.openpath_api_image }}",
            "SPA_IMAGE": "${{ needs.resolve-release-images.outputs.spa_image }}",
            "VERIFIER_IMAGE": "${{ needs.resolve-release-images.outputs.verifier_image }}"
          }
          EOF
          RELEASE_EVIDENCE_INPUT_PATH=release-evidence-input.json node scripts/write-release-evidence.mjs
          cat release-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release evidence bundle
        id: bundle
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-evidence-bundle.mjs \
            --deploy-run "${{ github.run_id }}" \
            --tag "${{ github.ref_name }}" \
            --production-url "${{ steps.production-target.outputs.public_url }}" \
            --output-dir release-evidence-bundle

      - name: Record release evidence bundle follow-up command
        if: always() && steps.bundle.outcome != 'success'
        run: |
          {
            echo "## Release Evidence Bundle Follow-up"
            echo ""
            echo "Current-run artifact download was unavailable or incomplete during this workflow."
            echo "Re-run after the deploy completes from a local shell in the artifact directory that contains \`release-evidence.json\`:"
            echo ""
            echo '\`npm run release:evidence-bundle -- --deploy-run "${{ github.run_id }}" --tag "${{ github.ref_name }}" --production-url "${{ steps.production-target.outputs.public_url }}" --output-dir release-evidence-bundle\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate deploy brief
        if: always()
        run: |
          set -euo pipefail
          release_evidence_path="release-evidence.json"
          if [ -f "release-evidence-bundle/release-evidence.json" ]; then
            release_evidence_path="release-evidence-bundle/release-evidence.json"
          fi

          npm run ops:deploy-brief -- \
            --release-evidence "$release_evidence_path" \
            --output-dir deploy-brief
          cat deploy-brief/deploy-brief.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}
          if-no-files-found: ignore
          path: |
            release-evidence.json
            release-evidence.md
            release-evidence-bundle/**
            release-timing-summary/**
            deploy-brief/**
          retention-days: 14

      - name: Fail release evidence on deploy brief failure
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f deploy-brief/deploy-brief.json ]; then
            echo "::error::deploy-brief/deploy-brief.json was not generated."
            exit 1
          fi
          status="$(
            node -e "const fs = require('fs'); const brief = JSON.parse(fs.readFileSync('deploy-brief/deploy-brief.json', 'utf8')); process.stdout.write(String(brief.status || 'unknown'));"
          )"
          case "$status" in
            pass|partial)
              ;;
            *)
              echo "::error::Deploy brief status is not releasable: $status"
              exit 1
              ;;
          esac

  rollback-production:
    name: Roll Back Production
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-test-production, resolve-release-images]
    if: always() && (needs.deploy-production.result == 'failure' || needs.smoke-test-production.result == 'failure')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy host
        id: resolve
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "" \
            "rollback" >> "$GITHUB_OUTPUT"

      - name: Roll back via SSH
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ needs.resolve-release-images.outputs.production_container_platform }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN,PRODUCTION_CONTAINER_PLATFORM
          script_path: scripts/rollback-production-remote.sh
