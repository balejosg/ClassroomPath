name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'upstream/openpath/api/**'
      - 'upstream/openpath/spa/**'
      - 'upstream/openpath/shared/**'
      - 'config/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy API + SPA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve deploy host
        id: resolve
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try to resolve hostname
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "DNS resolution attempt $i of $MAX_RETRIES..."
            IP=$(getent hosts "$HOST" 2>/dev/null | awk '{print $1}' | head -1)

            if [ -z "$IP" ]; then
              IP=$(dig +short "$HOST" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            fi

            if [ -n "$IP" ]; then
              echo "Resolved $HOST to $IP"
              echo "ip=$IP" >> $GITHUB_OUTPUT
              echo "port=$PORT" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 5
          done

          echo "Could not resolve $HOST"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        if: steps.resolve.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "Starting ClassroomPath deployment..."

            DEPLOY_DIR="${HOME}/ClassroomPath"
            
            # Clone if doesn't exist
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone --recurse-submodules https://github.com/balejosg/ClassroomPath.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"

            # Backup current version
            echo "Creating backup..."
            cp -r upstream/openpath/api upstream/openpath/api.backup 2>/dev/null || true

            # Pull latest changes with submodules
            echo "Pulling latest changes..."
            git fetch origin main
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git reset --hard origin/main
            git submodule update --init --recursive

            # Build API
            cd upstream/openpath
            echo "Installing dependencies..."
            npm ci

            echo "Building project..."
            npm run build --workspace=@openpath/shared
            npm run build --workspace=@openpath/api
            npm run build --workspace=openpath-spa

            # Copy SPA to web root
            echo "Deploying SPA..."
            sudo mkdir -p /var/www/classroompath/spa
            sudo cp -r spa/index.html spa/setup.html spa/reset-password.html spa/css spa/dist /var/www/classroompath/spa/

            # Run database migrations
            echo "Running database migrations..."
            cd api
            if [ -f .env ]; then
              set -a && source .env && set +a
            elif [ -f "$DEPLOY_DIR/config/.env" ]; then
              set -a && source "$DEPLOY_DIR/config/.env" && set +a
            fi
            npm run db:migrate || echo "⚠️ Migration failed - will retry on service restart"

            # Restart service
            echo "Restarting API service..."
            if command -v rc-service >/dev/null 2>&1; then
              sudo rc-service classroompath-api restart || sudo rc-service openpath-api restart || true
            elif command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart classroompath-api || sudo systemctl restart openpath-api || true
            fi

            # Verify health
            sleep 3
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              cd "$DEPLOY_DIR/upstream/openpath" && rm -rf api.backup
            else
              echo "❌ Deployment failed! Rolling back..."
              cd "$DEPLOY_DIR/upstream/openpath"
              rm -rf api
              mv api.backup api
              if command -v rc-service >/dev/null 2>&1; then
                sudo rc-service classroompath-api restart || true
              elif command -v systemctl >/dev/null 2>&1; then
                sudo systemctl restart classroompath-api || true
              fi
              exit 1
            fi

            echo "Deployment completed at $(date)"

      - name: Report skip
        if: steps.resolve.outputs.skip == 'true'
        run: |
          echo "::warning::Deployment skipped - could not resolve or connect to deploy host"
