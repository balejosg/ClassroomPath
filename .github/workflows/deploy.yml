name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
  push:
    tags:
      - 'v*'

# NOTE: Staging deploys are handled locally via `npm run deploy:staging`
# This workflow only handles production deployments (tag v*) and now runs a
# staging release gate before any production rollout.

jobs:
  release-gate-staging:
    name: Release Gate Staging
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run release gate against staging
        id: gate
        env:
          RELEASE_GATE_URL: https://classroompath-staging.duckdns.org
          RELEASE_GATE_TIMEOUT: '30000'
          RELEASE_GATE_ALLOW_MUTATIONS: '1'
        run: |
          echo "🔐 Running staging release gate against $RELEASE_GATE_URL"
          npm run test:release-gate 2>&1 | tee release-gate-results.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Upload release gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-results-staging
          path: release-gate-results.txt
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release-gate-staging
    if: needs.release-gate-staging.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    environment: production

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve deploy host
        id: resolve
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try to resolve hostname
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "DNS resolution attempt $i of $MAX_RETRIES..."
            IP=$(getent hosts "$HOST" 2>/dev/null | awk '{print $1}' | head -1)

            if [ -z "$IP" ]; then
              IP=$(dig +short "$HOST" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            fi

            if [ -n "$IP" ]; then
              echo "Resolved $HOST to $IP"
              echo "ip=$IP" >> $GITHUB_OUTPUT
              echo "port=$PORT" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 5
          done

          echo "Could not resolve $HOST"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        if: steps.resolve.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "Starting ClassroomPath Docker deployment..."

            DEPLOY_DIR="/opt/classroompath"
            APP_DIR="$DEPLOY_DIR/app"

            cd "$APP_DIR"

            # Pull latest changes with submodules
            echo "Pulling latest changes..."
            DEPLOY_REF="${{ github.ref }}"
            DEPLOY_SHA="${{ github.sha }}"

            git fetch origin --tags --prune
            git fetch origin main --prune
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true

            TARGET_SHA=""

            # Tag pushes: deploy the tag commit (not whatever origin/main currently is).
            if [[ "$DEPLOY_REF" == refs/tags/* ]]; then
              TAG_NAME="${DEPLOY_REF#refs/tags/}"
              TARGET_SHA=$(git rev-parse "${TAG_NAME}^{commit}" 2>/dev/null || true)
              if [ -z "$TARGET_SHA" ]; then
                # Fallback: explicitly fetch the tag ref (helps if server repo lacks tags).
                git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" || true
                TARGET_SHA=$(git rev-parse "${TAG_NAME}^{commit}" 2>/dev/null || true)
              fi
            fi

            # Manual runs (workflow_dispatch) or unexpected refs: deploy the triggering SHA.
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA=$(git rev-parse "${DEPLOY_SHA}^{commit}" 2>/dev/null || true)
            fi

            # Final fallback: deploy origin/main.
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA=$(git rev-parse origin/main)
            fi

            echo "Deploying ClassroomPath commit: $TARGET_SHA"
            git checkout --detach "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            git submodule deinit -f --all || true
            git submodule update --init --recursive --force

            # Run database migrations using Node.js Docker container
            echo "Running database migrations..."

            # ClassroomPath API migrations (multi-tenancy tables)
            echo "- ClassroomPath API schema..."
            docker run --rm -v "$APP_DIR/api:/app" -w /app node:20-alpine rm -rf node_modules
            docker run --rm \
              -v "$APP_DIR/api:/app" \
              -v "$APP_DIR/config/.env:/app/.env:ro" \
              -w /app \
              --env-file "$APP_DIR/config/.env" \
              node:20-alpine \
              sh -c "npm install && npm run db:push"

            # OpenPath API migrations (core tables)
            echo "- OpenPath API schema..."
            docker run --rm -v "$APP_DIR/upstream/openpath/api:/app" -w /app node:20-alpine rm -rf node_modules
            docker run --rm \
              -v "$APP_DIR/upstream/openpath/api:/app" \
              -v "$APP_DIR/config/.env:/app/.env:ro" \
              -w /app \
              --env-file "$APP_DIR/config/.env" \
              node:20-alpine \
              sh -c "npm install --include=dev && npm run db:push"

            cd "$APP_DIR/docker"
            export COMPOSE_PROJECT_NAME=classroompath-production
            echo "Stopping existing containers..."
            docker compose down --remove-orphans || true
            # Remove containers with both naming conventions (with and without project prefix)
            docker rm -f classroompath-api classroompath-gateway classroompath-spa 2>/dev/null || true
            docker rm -f classroompath-production-api-1 classroompath-production-gateway-1 classroompath-production-spa-1 2>/dev/null || true

            echo "Rebuilding Docker images..."
            docker compose build --no-cache

            echo "Starting containers..."
            docker compose up -d --force-recreate

            # Wait for containers to be healthy
            echo "Waiting for services to be healthy..."
            timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done' || {
              echo "⚠️ Warning: Timeout waiting for health checks"
              docker compose ps
            }

            # Health check - Gateway is the primary entry point now
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3001/cp/health > /dev/null 2>&1; then
                echo "✅ Gateway health check passed!"
                break
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 5
            done

            if ! curl -sf http://localhost:3001/cp/health > /dev/null 2>&1; then
              echo "❌ Gateway deployment failed! Check logs:"
              docker logs classroompath-gateway --tail 30
              exit 1
            fi

            # Database connectivity check - verify API can reach PostgreSQL
            # NOTE: /health is a simple liveness probe without DB status
            # /trpc/healthcheck.systemInfo includes database.connected field
            # Retry up to 5 times with 3s delay (DB pool takes time to connect)
            echo "Checking database connectivity..."
            for i in 1 2 3 4 5; do
              DB_CHECK=$(curl -sf http://localhost:3000/trpc/healthcheck.systemInfo 2>/dev/null || echo '{"result":{"data":{"database":{"connected":false}}}}')
              if echo "$DB_CHECK" | grep -q '"connected":true'; then
                echo "✅ Database connectivity OK"
                break
              fi
              if [ "$i" -lt 5 ]; then
                echo "⏳ Database not ready (attempt $i/5), waiting 3s..."
                sleep 3
              else
                echo "❌ DATABASE CONNECTION FAILED after 5 attempts!"
                echo "Health response: $DB_CHECK"
                echo ""
                echo "Common causes:"
                echo "  - DATABASE_URL not parsed correctly"
                echo "  - PostgreSQL container not reachable"
                echo "  - Wrong credentials in config/.env"
                echo ""
                echo "Debug: docker logs classroompath-production-api-1 --tail 30"
                exit 1
              fi
            done

            echo "✅ Deployment successful!"
            docker logs classroompath-gateway --tail 5

      - name: Report skip
        if: steps.resolve.outputs.skip == 'true'
        run: |
          echo "::warning::Deployment skipped - could not resolve or connect to deploy host"

  smoke-test-production:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always() && needs.deploy-production.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run smoke tests against production
        id: smoke
        env:
          SMOKE_TEST_URL: https://classroompath.duckdns.org
          SMOKE_TEST_TIMEOUT: '30000'
        run: |
          echo "🔍 Running smoke tests against $SMOKE_TEST_URL"
          npm run test:smoke 2>&1 | tee smoke-results.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-production
          path: smoke-results.txt
          retention-days: 7

      - name: Report smoke test failure
        if: failure()
        run: |
          echo "::error::PRODUCTION smoke tests FAILED! The deployment may be broken."
          echo "::error::Check the smoke test results for details."
          echo ""
          echo "Common issues:"
          echo "  - NPM reverse proxy stripping /api/ prefix"
          echo "  - CORS_ORIGINS not including production domain"
          echo "  - Container health check passed but service not fully ready"
          echo ""
          echo "Debug commands (run on production server):"
          echo "  curl -i https://classroompath.duckdns.org/health"
          echo "  curl -i https://classroompath.duckdns.org/api/config"
          echo "  docker logs classroompath-api --tail 50"
