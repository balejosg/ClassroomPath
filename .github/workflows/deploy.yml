name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-deploy-v2
  cancel-in-progress: false

# NOTE: Staging deploys are handled locally via `npm run deploy:staging`.
# Production rollouts are intentionally tag-only (`v*`) so the server can be
# reconciled exclusively through GitHub Actions.

jobs:
  verify-openpath-upstream:
    name: Verify OpenPath Upstream Checks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      openpath_sha: ${{ steps.verify.outputs.openpath_sha }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Resolve OpenPath required-check base
        id: openpath-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$previous_tag" ] && git rev-parse "$previous_tag:upstream/openpath" >/dev/null 2>&1; then
            echo "openpath_base_sha=$(git rev-parse "$previous_tag:upstream/openpath")" >> "$GITHUB_OUTPUT"
          else
            echo "openpath_base_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required OpenPath checks for submodule SHA
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENPATH_BASE_SHA: ${{ steps.openpath-base.outputs.openpath_base_sha }}
        run: |
          export OPENPATH_SHA="$(git -C upstream/openpath rev-parse HEAD)"
          echo "openpath_sha=$OPENPATH_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "${OPENPATH_BASE_SHA:-}" ]; then
            git -C upstream/openpath fetch --no-tags origin "$OPENPATH_BASE_SHA" "$OPENPATH_SHA"
          fi
          echo "Verifying OpenPath checks for $OPENPATH_SHA"
          node scripts/openpath-required-checks.mjs

  resolve-release-images:
    name: Resolve Release Images
    runs-on: ubuntu-latest
    needs: verify-openpath-upstream
    if: needs.verify-openpath-upstream.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      gateway_image: ${{ steps.release-images.outputs.gateway_image }}
      migrations_image: ${{ steps.release-images.outputs.migrations_image }}
      openpath_api_image: ${{ steps.release-images.outputs.openpath_api_image }}
      openpath_version: ${{ steps.release-images.outputs.openpath_version }}
      openpath_linux_agent_version: ${{ steps.release-images.outputs.linux_agent_version }}
      openpath_linux_agent_apt_suite: ${{ steps.release-images.outputs.linux_agent_apt_suite }}
      spa_image: ${{ steps.release-images.outputs.spa_image }}
      verifier_image: ${{ steps.release-images.outputs.verifier_image }}
      manifest_base64: ${{ steps.release-images.outputs.manifest_base64 }}
      payload_base64: ${{ steps.deploy-payload.outputs.payload_base64 }}
      staging_public_url: ${{ steps.deploy-targets.outputs.staging_public_url }}
      staging_gateway_health_url: ${{ steps.deploy-targets.outputs.staging_gateway_health_url }}
      staging_ready_url: ${{ steps.deploy-targets.outputs.staging_ready_url }}
      staging_api_config_url: ${{ steps.deploy-targets.outputs.staging_api_config_url }}
      staging_container_platform: ${{ steps.deploy-targets.outputs.staging_container_platform }}
      production_public_url: ${{ steps.deploy-targets.outputs.production_public_url }}
      production_gateway_health_url: ${{ steps.deploy-targets.outputs.production_gateway_health_url }}
      production_ready_url: ${{ steps.deploy-targets.outputs.production_ready_url }}
      production_api_config_url: ${{ steps.deploy-targets.outputs.production_api_config_url }}
      production_container_platform: ${{ steps.deploy-targets.outputs.production_container_platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve approved release candidate manifest
        id: release-images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          node scripts/wait-for-release-candidate.mjs resolve-manifest \
            --sha "$TARGET_SHA" \
            --repo "${{ github.repository }}" \
            --timeout-seconds 60 \
            --interval-seconds 5 \
            --output-file release-images.env >> "$GITHUB_OUTPUT"

          echo "manifest_base64=$(base64 < release-images.env | tr -d '\n')" >> "$GITHUB_OUTPUT"
          printf 'TAG_NAME=%s\n' '${{ github.ref_name }}' >> release-images.env

      - name: Resolve deploy targets
        id: deploy-targets
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r key value; do
            echo "staging_${key}=$value" >> "$GITHUB_OUTPUT"
          done < <(node scripts/deploy-targets.mjs outputs staging)

          while IFS='=' read -r key value; do
            echo "production_${key}=$value" >> "$GITHUB_OUTPUT"
          done < <(node scripts/deploy-targets.mjs outputs production)

      - name: Verify production release image platforms
        shell: bash
        env:
          RELEASE_MANIFEST_B64: ${{ steps.release-images.outputs.manifest_base64 }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ steps.deploy-targets.outputs.production_container_platform }}
        run: |
          set -euo pipefail
          node scripts/verify-release-manifest-platforms.mjs verify \
            --manifest-base64 "$RELEASE_MANIFEST_B64" \
            --target-platform "$PRODUCTION_CONTAINER_PLATFORM"

      - name: Verify OpenPath Linux agent APT pin
        shell: bash
        env:
          OPENPATH_LINUX_AGENT_VERSION: ${{ steps.release-images.outputs.linux_agent_version }}
          OPENPATH_LINUX_AGENT_APT_SUITE: ${{ steps.release-images.outputs.linux_agent_apt_suite }}
        run: |
          set -euo pipefail
          node scripts/resolve-openpath-linux-agent-version.mjs verify-runtime-pin
          node scripts/resolve-openpath-linux-agent-version.mjs install-probe-script \
            | docker run --rm -i ubuntu:24.04 bash

      - name: Build deploy payload
        id: deploy-payload
        shell: bash
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          RELEASE_MANIFEST_B64: ${{ steps.release-images.outputs.manifest_base64 }}
        run: |
          set -euo pipefail
          node scripts/lib/deploy-payload.mjs render-github-output \
            --target-environment production \
            --deploy-ref "$DEPLOY_REF" \
            --deploy-sha "$DEPLOY_SHA" \
            --deployment-mode promotion-eligible \
            --manifest-base64 "$RELEASE_MANIFEST_B64" >> "$GITHUB_OUTPUT"

      - name: Upload release image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-image-metadata-${{ github.ref_name }}
          path: release-images.env
          retention-days: 14

  verify-staging-release-state:
    name: Verify Staging Release State
    runs-on: ubuntu-latest
    needs: resolve-release-images
    if: needs.resolve-release-images.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      staging_windows_firefox_high_risk: ${{ steps.risk.outputs.high_risk }}
      staging_windows_firefox_risk_base_ref: ${{ steps.risk.outputs.base_ref }}
      staging_windows_firefox_risk_base_source: ${{ steps.risk.outputs.base_source }}
      staging_email_delivery_high_risk: ${{ steps.email-risk.outputs.high_risk }}
      promotion_eligible: ${{ steps.compare.outputs.promotion_eligible }}
      promotion_deployment_mode: ${{ steps.compare.outputs.promotion_deployment_mode }}
      staging_smoke_result: ${{ steps.compare.outputs.staging_smoke_result }}
      staging_smoke_status: ${{ steps.compare.outputs.staging_smoke_status }}
      staging_release_gate_result: ${{ steps.compare.outputs.staging_release_gate_result }}
      staging_windows_bootstrap_result: ${{ steps.compare.outputs.staging_windows_bootstrap_result }}
      staging_firefox_policy_result: ${{ steps.compare.outputs.staging_firefox_policy_result }}
      staging_firefox_extension_id: ${{ steps.compare.outputs.staging_firefox_extension_id }}
      staging_firefox_release_version: ${{ steps.compare.outputs.staging_firefox_release_version }}
      staging_firefox_metadata_sha256: ${{ steps.compare.outputs.staging_firefox_metadata_sha256 }}
      staging_firefox_xpi_sha256: ${{ steps.compare.outputs.staging_firefox_xpi_sha256 }}
      staging_verified_at: ${{ steps.compare.outputs.staging_verified_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve staging host
        id: resolve
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production promotion" \
            STAGING_DEPLOY_HOST "$STAGING_HOST" \
            STAGING_DEPLOY_USER "$STAGING_USER" \
            STAGING_DEPLOY_SSH_KEY "$STAGING_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$STAGING_HOST" \
            "${STAGING_PORT:-22}" \
            "$STAGING_USER" \
            "production promotion" >> "$GITHUB_OUTPUT"

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production promotion" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production promotion" >> "$GITHUB_OUTPUT"

      - name: Install staging SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$STAGING_SSH_KEY" ~/.ssh/classroompath-staging-release

      - name: Install production SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-release

      - name: Extract staging evidence from production tag
        id: tag-evidence
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > production-tag-message.txt
          if node scripts/promotion-evidence-cli.mjs extract-tag-message \
            --message-file production-tag-message.txt \
            --staging-current-output staging-release-state.env \
            --staging-verification-output staging-verification.env 2>/dev/null; then
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            rm -f staging-release-state.env staging-verification.env
            echo "source=ssh" >> "$GITHUB_OUTPUT"
          fi

      - name: Read staging release state
        if: steps.tag-evidence.outputs.source != 'tag'
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_read_file \
            ~/.ssh/classroompath-staging-release \
            "${{ steps.resolve.outputs.port }}" \
            "${{ steps.resolve.outputs.user }}" \
            "${{ steps.resolve.outputs.ip }}" \
            /opt/classroompath/release-state/current-images.env > staging-release-state.env

      - name: Read staging verification evidence
        if: steps.tag-evidence.outputs.source != 'tag'
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_read_file \
            ~/.ssh/classroompath-staging-release \
            "${{ steps.resolve.outputs.port }}" \
            "${{ steps.resolve.outputs.user }}" \
            "${{ steps.resolve.outputs.ip }}" \
            /opt/classroompath/release-state/staging-verification.env > staging-verification.env

      - name: Read production release state
        run: |
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_read_file \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            /opt/classroompath/release-state/current-images.env > production-release-state.env

      - name: Detect promoted Windows/Firefox risk
        id: risk
        shell: bash
        env:
          PRODUCTION_RELEASE_STATE_PATH: production-release-state.env
          TARGET_SHA: ${{ github.sha }}
        run: bash scripts/detect-windows-firefox-risk.sh

      - name: Detect promoted email delivery risk
        id: email-risk
        shell: bash
        env:
          PRODUCTION_RELEASE_STATE_PATH: production-release-state.env
          TARGET_SHA: ${{ github.sha }}
        run: bash scripts/detect-email-delivery-risk.sh

      - name: Compare staging release state
        id: compare
        shell: bash
        env:
          HIGH_RISK: ${{ steps.risk.outputs.high_risk }}
          EXPECTED_APP_SHA: ${{ github.sha }}
          EXPECTED_GATEWAY_IMAGE: ${{ needs.resolve-release-images.outputs.gateway_image }}
          EXPECTED_MIGRATIONS_IMAGE: ${{ needs.resolve-release-images.outputs.migrations_image }}
          EXPECTED_OPENPATH_API_IMAGE: ${{ needs.resolve-release-images.outputs.openpath_api_image }}
          EXPECTED_OPENPATH_VERSION: ${{ needs.resolve-release-images.outputs.openpath_version }}
          EXPECTED_OPENPATH_LINUX_AGENT_VERSION: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_version }}
          EXPECTED_OPENPATH_LINUX_AGENT_APT_SUITE: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_apt_suite }}
          EXPECTED_SPA_IMAGE: ${{ needs.resolve-release-images.outputs.spa_image }}
        run: bash scripts/verify-staging-release-state.sh

      - name: Upload staging release state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-state-${{ github.ref_name }}
          path: |
            production-release-state.env
            staging-release-state.env
            staging-verification.env
            staging-promotion-eligibility.json
          retention-days: 7

  windows-firefox-canary:
    name: Windows Firefox Canary
    needs: verify-staging-release-state
    if: needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk == 'true'
    uses: ./.github/workflows/windows-firefox-canary.yml
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [resolve-release-images, verify-staging-release-state, windows-firefox-canary]
    if: always() && needs.resolve-release-images.result == 'success' && needs.verify-staging-release-state.result == 'success' && (needs.windows-firefox-canary.result == 'success' || needs.windows-firefox-canary.result == 'skipped') && startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy host
        id: resolve
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "" \
            "production deployment" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MANIFEST_B64: ${{ needs.resolve-release-images.outputs.manifest_base64 }}
          DEPLOY_PAYLOAD_B64: ${{ needs.resolve-release-images.outputs.payload_base64 }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ needs.resolve-release-images.outputs.production_container_platform }}
          PRODUCTION_DB_BACKUP_COMMAND: ${{ secrets.PRODUCTION_DB_BACKUP_COMMAND }}
          PRODUCTION_DB_BACKUP_ID: ${{ secrets.PRODUCTION_DB_BACKUP_ID }}
          CP_BILLING_MODE: ${{ vars.CP_BILLING_MODE }}
          CP_PLATFORM_ADMIN_EMAILS: ${{ secrets.CP_PLATFORM_ADMIN_EMAILS }}
          CP_CLIENT_CANARY_ADMIN_TOKEN: ${{ secrets.CP_CLIENT_CANARY_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_ANNUAL_PRICE_1_10: ${{ secrets.STRIPE_ANNUAL_PRICE_1_10 }}
          STRIPE_ANNUAL_PRICE_11_25: ${{ secrets.STRIPE_ANNUAL_PRICE_11_25 }}
          STRIPE_ANNUAL_PRICE_26_50: ${{ secrets.STRIPE_ANNUAL_PRICE_26_50 }}
          STRIPE_ANNUAL_PRICE_51_100: ${{ secrets.STRIPE_ANNUAL_PRICE_51_100 }}
          STRIPE_ONBOARDING_PRICE_1_25: ${{ secrets.STRIPE_ONBOARDING_PRICE_1_25 }}
          STRIPE_ONBOARDING_PRICE_26_100: ${{ secrets.STRIPE_ONBOARDING_PRICE_26_100 }}
          STRIPE_PILOT_PRICE: ${{ secrets.STRIPE_PILOT_PRICE }}
          CP_EMAIL_PREFLIGHT_ALLOW_DAILY_QUOTA: ${{ needs.verify-staging-release-state.outputs.staging_email_delivery_high_risk == 'true' && '0' || '1' }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PAYLOAD_B64,DEPLOY_REF,DEPLOY_SHA,RELEASE_MANIFEST_B64,PRODUCTION_CONTAINER_PLATFORM,PRODUCTION_DB_BACKUP_COMMAND,PRODUCTION_DB_BACKUP_ID,CP_BILLING_MODE,CP_PLATFORM_ADMIN_EMAILS,CP_CLIENT_CANARY_ADMIN_TOKEN,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_CONTACT,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_ANNUAL_PRICE_1_10,STRIPE_ANNUAL_PRICE_11_25,STRIPE_ANNUAL_PRICE_26_50,STRIPE_ANNUAL_PRICE_51_100,STRIPE_ONBOARDING_PRICE_1_25,STRIPE_ONBOARDING_PRICE_26_100,STRIPE_PILOT_PRICE,CP_EMAIL_PREFLIGHT_ALLOW_DAILY_QUOTA
          script_path: scripts/deploy-production-remote.sh

  smoke-test-production:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [deploy-production, resolve-release-images]
    if: always() && needs.deploy-production.result == 'success' && needs.resolve-release-images.result == 'success'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for production readiness
        shell: bash
        env:
          PRODUCTION_READY_URL: ${{ needs.resolve-release-images.outputs.production_ready_url }}
        run: bash scripts/wait-for-ready.sh "$PRODUCTION_READY_URL"

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production smoke" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-smoke

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-smoke \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment smoke canary
        id: provision-enrollment
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ needs.resolve-release-images.outputs.production_public_url }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download live Windows enrollment script
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ needs.resolve-release-images.outputs.production_public_url }}
          CLASSROOM_ID: ${{ steps.provision-enrollment.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision-enrollment.outputs.enrollment_token }}
        run: |
          set -euo pipefail

          windows_script="$RUNNER_TEMP/production-windows-enrollment.ps1"
          http_status="$(
            curl -sS \
              -o "$windows_script" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $ENROLLMENT_TOKEN" \
              "$PRODUCTION_BASE_URL/api/enroll/$CLASSROOM_ID/windows.ps1"
          )"

          if [ "$http_status" != "200" ]; then
            echo "::error::Windows enrollment script download returned HTTP $http_status"
            sed -n '1,80p' "$windows_script" || true
            exit 1
          fi

          test -s "$windows_script"
          grep -F 'OpenPath Enrollment (Windows)' "$windows_script"
          grep -F 'api/agent/windows/bootstrap/manifest' "$windows_script"
          grep -F '$env:OPENPATH_VERSION' "$windows_script"
          grep -F 'Install-OpenPath.ps1' "$windows_script"

      - name: Run smoke tests against production
        id: smoke
        env:
          SMOKE_TEST_URL: ${{ needs.resolve-release-images.outputs.production_public_url }}
          SMOKE_TEST_TIMEOUT: '30000'
          SMOKE_REQUIRE_PUSH: '1'
          CLASSROOMPATH_VERIFIER_IMAGE: ${{ needs.resolve-release-images.outputs.verifier_image }}
        run: |
          bash scripts/run-smoke-in-verifier.sh
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Install Linux Firefox canary dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Download and run live Linux enrollment script
        timeout-minutes: 12
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ needs.resolve-release-images.outputs.production_public_url }}
          CLASSROOM_ID: ${{ steps.provision-enrollment.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision-enrollment.outputs.enrollment_token }}
          OPENPATH_LINUX_AGENT_VERSION: ${{ needs.resolve-release-images.outputs.openpath_linux_agent_version }}
          PRODUCTION_SMOKE_SSH_PORT: ${{ steps.resolve-production.outputs.port }}
          PRODUCTION_SMOKE_SSH_USER: ${{ steps.resolve-production.outputs.user }}
          PRODUCTION_SMOKE_SSH_IP: ${{ steps.resolve-production.outputs.ip }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh

          workspace="$RUNNER_TEMP/production-linux-enrollment"
          mkdir -p "$workspace"
          enroll_script="$workspace/enroll.sh"
          download_headers="$RUNNER_TEMP/production-linux-enrollment-download.headers"
          download_body="$RUNNER_TEMP/production-linux-enrollment-download.body"
          download_meta="$RUNNER_TEMP/production-linux-enrollment-download.json"
          enrollment_log="$RUNNER_TEMP/production-linux-enrollment.log"
          firefox_state_dir="$RUNNER_TEMP/production-linux-firefox-state"
          early_mirror_status_path="$RUNNER_TEMP/production-linux-enrollment-remote-mirror-status.txt"
          archive_path="production-linux-enrollment-diagnostics.tar.gz"
          key_path="$HOME/.ssh/classroompath-production-smoke"
          remote_root="/opt/classroompath/release-state/production-smoke-diagnostics/${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}"
          : > "$enrollment_log"
          mkdir -p "$firefox_state_dir"

          collect_firefox_state() {
            local exit_status="${1:-0}"
            local snapshot_label="${2:-exit}"
            local snapshot_dir="$firefox_state_dir/${snapshot_label}-$(date -u '+%Y%m%dT%H%M%SZ')"
            mkdir -p "$snapshot_dir"

            {
              echo "exitStatus: $exit_status"
              echo "snapshotLabel: $snapshot_label"
              echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "runnerUser: $(id -un 2>/dev/null || true)"
              echo "runnerHome: ${HOME:-}"
              echo "firefoxBinary: $(command -v firefox || true)"
              firefox --version || true
              echo "geckodriverBinary: $(command -v geckodriver || true)"
              geckodriver --version || true
              echo "openpathBinary: $(command -v openpath || true)"
              if command -v openpath >/dev/null 2>&1; then
                openpath status || true
                openpath health || true
              fi
              echo "runningProcesses:"
              ps -ef | grep -E '[f]irefox|[g]eckodriver' || true
              echo "mozillaExtensionDir:"
              sudo ls -la /usr/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384} || true
              echo "firefoxPolicies:"
              sudo cat /etc/firefox/policies/policies.json || true
            } > "$snapshot_dir/summary.txt" 2>&1

            for root in \
              "$HOME/.mozilla/firefox" \
              "$HOME/snap/firefox/common/.mozilla/firefox" \
              /root/.mozilla/firefox \
              /root/snap/firefox/common/.mozilla/firefox
            do
              label="$(printf '%s' "$root" | tr '/.' '__')"
              {
                echo "root=$root"
                if [ -d "$root" ]; then
                  find "$root" -maxdepth 2 -type d | sort || true
                  find "$root" -maxdepth 2 -type f \( -name prefs.js -o -name extensions.json \) | sort || true
                else
                  echo "(missing)"
                fi
              } > "$snapshot_dir/profile-root-${label}.txt" 2>&1

              if [ ! -d "$root" ]; then
                continue
              fi

              while IFS= read -r file; do
                safe_name="${label}_$(basename "$(dirname "$file")")_$(basename "$file")"
                sed -n '1,240p' "$file" > "$snapshot_dir/$safe_name" 2>&1 || true
              done < <(find "$root" -maxdepth 2 -type f \( -name prefs.js -o -name extensions.json \) | sort)
            done
          }

          ensure_local_enrollment_diagnostics() {
            if [ ! -f "$enrollment_log" ]; then
              printf '%s\n' 'Linux enrollment log was not created before early mirror.' > "$enrollment_log"
            fi

            if [ ! -f "$download_meta" ]; then
              printf '%s\n' '{"status":null,"headers":"","bodyPreview":"Linux enrollment download diagnostics were not created before early mirror."}' > "$download_meta"
            fi

            if [ ! -f "$download_headers" ]; then
              printf '%s\n' 'Linux enrollment download headers were not created before early mirror.' > "$download_headers"
            fi

            if [ ! -f "$download_body" ]; then
              printf '%s\n' 'Linux enrollment download body was not created before early mirror.' > "$download_body"
            fi

            mkdir -p "$firefox_state_dir"
            if [ -z "$(find "$firefox_state_dir" -mindepth 1 -print -quit)" ]; then
              printf '%s\n' 'Firefox state snapshots were not created before early mirror.' > "$firefox_state_dir/placeholder.txt"
            fi

            rm -f "$archive_path"
            tar -czf "$archive_path" \
              -C "$RUNNER_TEMP" \
              production-linux-enrollment.log \
              production-linux-enrollment-download.json \
              production-linux-enrollment-download.headers \
              production-linux-enrollment-download.body \
              production-linux-firefox-state
          }

          remote_write_from_file() {
            local local_path="$1"
            local remote_path="$2"

            github_actions_remote_ssh \
              "$key_path" \
              "$PRODUCTION_SMOKE_SSH_PORT" \
              "$PRODUCTION_SMOKE_SSH_USER" \
              "$PRODUCTION_SMOKE_SSH_IP" \
              "cat > '$remote_path'" < "$local_path"
          }

          verify_remote_file_copy() {
            local local_path="$1"
            local remote_path="$2"
            local local_size=""
            local remote_size=""
            local local_sha=""
            local remote_sha=""

            [ -s "$local_path" ] || return 1

            local_size="$(wc -c < "$local_path" | tr -d ' ')"
            remote_size="$(
              github_actions_remote_file_size \
                "$key_path" \
                "$PRODUCTION_SMOKE_SSH_PORT" \
                "$PRODUCTION_SMOKE_SSH_USER" \
                "$PRODUCTION_SMOKE_SSH_IP" \
                "$remote_path" 2>/dev/null || true
            )"
            [ -n "$remote_size" ] || return 1
            [ "$remote_size" = "$local_size" ] || return 1

            local_sha="$(sha256sum "$local_path" | awk '{print $1}')"
            remote_sha="$(
              github_actions_remote_sha256_file \
                "$key_path" \
                "$PRODUCTION_SMOKE_SSH_PORT" \
                "$PRODUCTION_SMOKE_SSH_USER" \
                "$PRODUCTION_SMOKE_SSH_IP" \
                "$remote_path" 2>/dev/null || true
            )"
            [ -n "$remote_sha" ] || return 1
            [ "$remote_sha" = "$local_sha" ]
          }

          write_remote_mirror_status() {
            local exit_status="${1:-0}"
            local phase="${2:-unknown}"
            local archive_copied="${3:-unknown}"
            local log_copied="${4:-unknown}"
            local meta_copied="${5:-unknown}"
            local status_file
            status_file="$(mktemp)"

            {
              printf 'runId=%s\n' "$GITHUB_RUN_ID"
              printf 'runAttempt=%s\n' "$GITHUB_RUN_ATTEMPT"
              printf 'savedAt=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              printf 'phase=%s\n' "$phase"
              printf 'exitStatus=%s\n' "$exit_status"
              printf 'remoteRoot=%s\n' "$remote_root"
              printf 'archivePresent=%s\n' "$(test -s "$archive_path" && echo yes || echo no)"
              printf 'archiveCopied=%s\n' "$archive_copied"
              printf 'logPresent=%s\n' "$(test -s "$enrollment_log" && echo yes || echo no)"
              printf 'logCopied=%s\n' "$log_copied"
              printf 'downloadMetaPresent=%s\n' "$(test -s "$download_meta" && echo yes || echo no)"
              printf 'downloadMetaCopied=%s\n' "$meta_copied"
              printf 'firefoxSnapshotCount=%s\n' "$(find "$firefox_state_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
            } > "$status_file"

            cp "$status_file" "$early_mirror_status_path"
            remote_write_from_file "$status_file" "$remote_root/mirror-status.txt" \
              && verify_remote_file_copy "$status_file" "$remote_root/mirror-status.txt"
            rm -f "$status_file"
          }

          mirror_linux_enrollment_diagnostics() {
            local exit_status="${1:-0}"
            local archive_copied="no"
            local log_copied="no"
            local meta_copied="no"

            if [ -z "${PRODUCTION_SMOKE_SSH_PORT:-}" ] || [ -z "${PRODUCTION_SMOKE_SSH_USER:-}" ] || [ -z "${PRODUCTION_SMOKE_SSH_IP:-}" ]; then
              printf 'phase=skipped\nreason=missing-ssh-context\nexitStatus=%s\n' "$exit_status" > "$early_mirror_status_path"
              return 0
            fi

            if ! github_actions_remote_ssh \
              "$key_path" \
              "$PRODUCTION_SMOKE_SSH_PORT" \
              "$PRODUCTION_SMOKE_SSH_USER" \
              "$PRODUCTION_SMOKE_SSH_IP" \
              "mkdir -p '$remote_root'"
            then
              printf 'phase=mkdir-failed\nremoteRoot=%s\nexitStatus=%s\n' "$remote_root" "$exit_status" > "$early_mirror_status_path"
              return 0
            fi

            if ! write_remote_mirror_status "$exit_status" "starting" "$archive_copied" "$log_copied" "$meta_copied"; then
              printf 'phase=marker-write-failed\nremoteRoot=%s\nexitStatus=%s\n' "$remote_root" "$exit_status" > "$early_mirror_status_path"
              return 0
            fi

            if remote_write_from_file "$archive_path" "$remote_root/production-linux-enrollment-diagnostics.tar.gz" \
              && verify_remote_file_copy "$archive_path" "$remote_root/production-linux-enrollment-diagnostics.tar.gz"; then
              archive_copied="yes"
            fi

            if remote_write_from_file "$enrollment_log" "$remote_root/production-linux-enrollment.log" \
              && verify_remote_file_copy "$enrollment_log" "$remote_root/production-linux-enrollment.log"; then
              log_copied="yes"
            fi

            if remote_write_from_file "$download_meta" "$remote_root/production-linux-enrollment-download.json" \
              && verify_remote_file_copy "$download_meta" "$remote_root/production-linux-enrollment-download.json"; then
              meta_copied="yes"
            fi

            write_remote_mirror_status "$exit_status" "complete" "$archive_copied" "$log_copied" "$meta_copied" || true
          }

          cleanup_linux_enrollment() {
            local exit_status=$?
            set +e
            collect_firefox_state "$exit_status"
            ensure_local_enrollment_diagnostics
            mirror_linux_enrollment_diagnostics "$exit_status"
            return "$exit_status"
          }

          trap cleanup_linux_enrollment EXIT

          http_status="$(
            curl -sS -L \
              -D "$download_headers" \
              -o "$download_body" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $ENROLLMENT_TOKEN" \
              "$PRODUCTION_BASE_URL/api/enroll/$CLASSROOM_ID"
          )"

          node -e '
            const fs = require("node:fs");
            const [status, headersPath, bodyPath, outputPath] = process.argv.slice(1);
            const headers = fs.existsSync(headersPath) ? fs.readFileSync(headersPath, "utf8") : "";
            const body = fs.existsSync(bodyPath) ? fs.readFileSync(bodyPath, "utf8") : "";
            fs.writeFileSync(outputPath, `${JSON.stringify({
              status: Number(status),
              headers,
              bodyPreview: body.slice(0, 4000)
            }, null, 2)}\n`);
          ' "$http_status" "$download_headers" "$download_body" "$download_meta"

          if [ "$http_status" != "200" ]; then
            echo "::error::Linux enrollment script download returned HTTP $http_status"
            cat "$download_meta"
            exit 1
          fi

          cp "$download_body" "$enroll_script"
          test -s "$enroll_script"
          head -n 1 "$enroll_script" | grep -Eq '^#!.*bash'
          grep -F "LINUX_AGENT_VERSION=" "$enroll_script"
          grep -F "$OPENPATH_LINUX_AGENT_VERSION" "$enroll_script"

          chmod 700 "$enroll_script"
          enrollment_status=1
          for attempt in 1 2 3; do
            echo "===== Linux enrollment attempt $attempt =====" | tee -a "$enrollment_log"
            if sudo timeout --kill-after=30s 10m bash "$enroll_script" 2>&1 | tee -a "$enrollment_log"; then
              enrollment_status=0
              break
            else
              enrollment_status="${PIPESTATUS[0]}"
            fi

            collect_firefox_state "$enrollment_status" "attempt-$attempt" || true
            echo "::warning::Linux enrollment attempt $attempt failed with status $enrollment_status" | tee -a "$enrollment_log"
            if [ "$attempt" != "3" ]; then
              sleep "$((attempt * 10))"
            fi
          done

          if [ "$enrollment_status" -ne 0 ]; then
            echo "::error::Linux enrollment failed or timed out with status $enrollment_status" | tee -a "$enrollment_log"
            {
              echo "===== Linux enrollment diagnostics ====="
              echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "openpath binary: $(command -v openpath || true)"
              if command -v openpath >/dev/null 2>&1; then
                openpath status || true
                openpath health || true
              fi
              systemctl status dnsmasq --no-pager || true
              systemctl status openpath-dnsmasq.timer --no-pager || true
              systemctl status dnsmasq-watchdog.timer --no-pager || true
              ip route || true
              cat /etc/resolv.conf || true
            } 2>&1 | tee -a "$enrollment_log"
            exit "$enrollment_status"
          fi

      - name: Ensure Linux enrollment diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          enrollment_log_path="$RUNNER_TEMP/production-linux-enrollment.log"
          if [ ! -f "$enrollment_log_path" ]; then
            printf '%s\n' 'Linux enrollment log was not created before artifact upload.' > "$enrollment_log_path"
          fi

          enrollment_download_meta_path="$RUNNER_TEMP/production-linux-enrollment-download.json"
          if [ ! -f "$enrollment_download_meta_path" ]; then
            printf '%s\n' '{"status":null,"headers":"","bodyPreview":"Linux enrollment download diagnostics were not created before artifact upload."}' > "$enrollment_download_meta_path"
          fi

          enrollment_download_headers_path="$RUNNER_TEMP/production-linux-enrollment-download.headers"
          if [ ! -f "$enrollment_download_headers_path" ]; then
            printf '%s\n' 'Linux enrollment download headers were not created before artifact upload.' > "$enrollment_download_headers_path"
          fi

          enrollment_download_body_path="$RUNNER_TEMP/production-linux-enrollment-download.body"
          if [ ! -f "$enrollment_download_body_path" ]; then
            printf '%s\n' 'Linux enrollment download body was not created before artifact upload.' > "$enrollment_download_body_path"
          fi

          firefox_state_dir="$RUNNER_TEMP/production-linux-firefox-state"
          mkdir -p "$firefox_state_dir"
          if [ -z "$(find "$firefox_state_dir" -mindepth 1 -print -quit)" ]; then
            printf '%s\n' 'Firefox state snapshots were not created before artifact upload.' > "$firefox_state_dir/placeholder.txt"
          fi

          archive_path="production-linux-enrollment-diagnostics.tar.gz"
          rm -f "$archive_path"
          tar -czf "$archive_path" \
            -C "$RUNNER_TEMP" \
            production-linux-enrollment.log \
            production-linux-enrollment-download.json \
            production-linux-enrollment-download.headers \
            production-linux-enrollment-download.body \
            production-linux-firefox-state

          if [ ! -s "$archive_path" ]; then
            echo "::error::Required Linux enrollment diagnostic archive was not created: $archive_path"
            exit 1
          fi

      - name: Restore Linux runner network after failed enrollment
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if command -v openpath >/dev/null 2>&1; then
            sudo openpath disable || true
          fi

          sudo systemctl stop dnsmasq || true
          sudo systemctl stop openpath-dnsmasq.timer || true
          sudo systemctl stop dnsmasq-watchdog.timer || true

          if command -v resolvectl >/dev/null 2>&1 && systemctl is-active --quiet systemd-resolved; then
            default_interface="$(ip route show default 2>/dev/null | awk '{print $5; exit}')"
            if [ -n "$default_interface" ]; then
              sudo resolvectl dns "$default_interface" 1.1.1.1 8.8.8.8 || true
            fi
            sudo resolvectl flush-caches || true
          else
            printf '%s\n' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf >/dev/null || true
          fi

      - name: Upload Linux enrollment diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: production-linux-enrollment-diagnostics
          path: production-linux-enrollment-diagnostics.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Mirror Linux enrollment diagnostics to production release state
        id: mirror-linux-enrollment-diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          PRODUCTION_SMOKE_SSH_PORT: ${{ steps.resolve-production.outputs.port }}
          PRODUCTION_SMOKE_SSH_USER: ${{ steps.resolve-production.outputs.user }}
          PRODUCTION_SMOKE_SSH_IP: ${{ steps.resolve-production.outputs.ip }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh

          key_path="$HOME/.ssh/classroompath-production-smoke"
          remote_root="/opt/classroompath/release-state/production-smoke-diagnostics/${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}"
          archive_sha="$(sha256sum production-linux-enrollment-diagnostics.tar.gz | awk '{print $1}')"
          saved_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mirror_status="success"
          mirror_failure_detail=""

          remote_write_from_file() {
            local local_path="$1"
            local remote_path="$2"

            github_actions_remote_ssh \
              "$key_path" \
              "$PRODUCTION_SMOKE_SSH_PORT" \
              "$PRODUCTION_SMOKE_SSH_USER" \
              "$PRODUCTION_SMOKE_SSH_IP" \
              "cat > '$remote_path'" < "$local_path"
          }

          verify_remote_file_copy() {
            local local_path="$1"
            local remote_path="$2"
            local local_size=""
            local remote_size=""
            local local_sha=""
            local remote_sha=""

            [ -s "$local_path" ] || return 1

            local_size="$(wc -c < "$local_path" | tr -d ' ')"
            remote_size="$(
              github_actions_remote_file_size \
                "$key_path" \
                "$PRODUCTION_SMOKE_SSH_PORT" \
                "$PRODUCTION_SMOKE_SSH_USER" \
                "$PRODUCTION_SMOKE_SSH_IP" \
                "$remote_path" 2>/dev/null || true
            )"
            [ -n "$remote_size" ] || return 1
            [ "$remote_size" = "$local_size" ] || return 1

            local_sha="$(sha256sum "$local_path" | awk '{print $1}')"
            remote_sha="$(
              github_actions_remote_sha256_file \
                "$key_path" \
                "$PRODUCTION_SMOKE_SSH_PORT" \
                "$PRODUCTION_SMOKE_SSH_USER" \
                "$PRODUCTION_SMOKE_SSH_IP" \
                "$remote_path" 2>/dev/null || true
            )"
            [ -n "$remote_sha" ] || return 1
            [ "$remote_sha" = "$local_sha" ]
          }

          if ! github_actions_remote_ssh \
            "$key_path" \
            "$PRODUCTION_SMOKE_SSH_PORT" \
            "$PRODUCTION_SMOKE_SSH_USER" \
            "$PRODUCTION_SMOKE_SSH_IP" \
            "mkdir -p '$remote_root'"
          then
            mirror_status="failure"
            mirror_failure_detail="mkdir"
          fi

          if [ "$mirror_status" = "success" ] && ! remote_write_from_file \
            production-linux-enrollment-diagnostics.tar.gz \
            "$remote_root/production-linux-enrollment-diagnostics.tar.gz"
          then
            mirror_status="failure"
            mirror_failure_detail="archive"
          elif [ "$mirror_status" = "success" ] && ! verify_remote_file_copy \
            production-linux-enrollment-diagnostics.tar.gz \
            "$remote_root/production-linux-enrollment-diagnostics.tar.gz"
          then
            mirror_status="failure"
            mirror_failure_detail="archive-verify"
          fi

          if [ "$mirror_status" = "success" ] && ! remote_write_from_file \
            "$RUNNER_TEMP/production-linux-enrollment.log" \
            "$remote_root/production-linux-enrollment.log"
          then
            mirror_status="failure"
            mirror_failure_detail="log"
          elif [ "$mirror_status" = "success" ] && ! verify_remote_file_copy \
            "$RUNNER_TEMP/production-linux-enrollment.log" \
            "$remote_root/production-linux-enrollment.log"
          then
            mirror_status="failure"
            mirror_failure_detail="log-verify"
          fi

          if [ "$mirror_status" = "success" ] && ! remote_write_from_file \
            "$RUNNER_TEMP/production-linux-enrollment-download.json" \
            "$remote_root/production-linux-enrollment-download.json"
          then
            mirror_status="failure"
            mirror_failure_detail="download-meta"
          elif [ "$mirror_status" = "success" ] && ! verify_remote_file_copy \
            "$RUNNER_TEMP/production-linux-enrollment-download.json" \
            "$remote_root/production-linux-enrollment-download.json"
          then
            mirror_status="failure"
            mirror_failure_detail="download-meta-verify"
          fi

          if [ "$mirror_status" = "success" ]; then
            manifest_file="$(mktemp)"
            cat > "$manifest_file" <<EOF
            runId=$GITHUB_RUN_ID
            runAttempt=$GITHUB_RUN_ATTEMPT
            savedAt=$saved_at
            archive=production-linux-enrollment-diagnostics.tar.gz
            archiveSha256=$archive_sha
            enrollmentLog=production-linux-enrollment.log
            enrollmentDownloadMeta=production-linux-enrollment-download.json
            EOF

            if ! remote_write_from_file "$manifest_file" "$remote_root/manifest.txt"; then
              mirror_status="failure"
              mirror_failure_detail="manifest"
            elif ! verify_remote_file_copy "$manifest_file" "$remote_root/manifest.txt"; then
              mirror_status="failure"
              mirror_failure_detail="manifest-verify"
            fi

            rm -f "$manifest_file"
          fi

          echo "remote_path=$remote_root" >> "$GITHUB_OUTPUT"
          echo "mirror_status=$mirror_status" >> "$GITHUB_OUTPUT"
          echo "mirror_failure_detail=$mirror_failure_detail" >> "$GITHUB_OUTPUT"

          if [ "$mirror_status" != "success" ]; then
            echo "::warning::Linux enrollment diagnostics remote mirror failed at $mirror_failure_detail (target: $remote_root)"
            exit 1
          fi

      - name: Summarize Linux enrollment diagnostics
        if: always()
        shell: bash
        env:
          MIRRORED_REMOTE_PATH: ${{ steps.mirror-linux-enrollment-diagnostics.outputs.remote_path }}
          MIRROR_STATUS: ${{ steps.mirror-linux-enrollment-diagnostics.outputs.mirror_status }}
          MIRROR_FAILURE_DETAIL: ${{ steps.mirror-linux-enrollment-diagnostics.outputs.mirror_failure_detail }}
        run: |
          set -euo pipefail

          archive_path="production-linux-enrollment-diagnostics.tar.gz"
          download_meta_path="$RUNNER_TEMP/production-linux-enrollment-download.json"
          enrollment_log_path="$RUNNER_TEMP/production-linux-enrollment.log"
          firefox_state_dir="$RUNNER_TEMP/production-linux-firefox-state"
          archive_sha="$(sha256sum "$archive_path" | awk '{print $1}')"
          latest_firefox_snapshot="$(find "$firefox_state_dir" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1 || true)"

          {
            echo "## Production Linux enrollment diagnostics"
            echo
            echo "- Workflow run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Archive: \`$archive_path\`"
            echo "- Archive sha256: \`$archive_sha\`"
            echo "- Remote mirror status: \`${MIRROR_STATUS:-unknown}\`"
            if [ -n "$MIRROR_FAILURE_DETAIL" ]; then
              echo "- Remote mirror failure detail: \`$MIRROR_FAILURE_DETAIL\`"
            fi
            if [ -n "$MIRRORED_REMOTE_PATH" ] && [ "${MIRROR_STATUS:-}" = "success" ]; then
              echo "- Mirrored remote path: \`$MIRRORED_REMOTE_PATH\`"
            else
              echo "- Mirrored remote path: unavailable"
            fi
            echo
            echo "### Archive contents"
            echo '```text'
            tar -tzf production-linux-enrollment-diagnostics.tar.gz | sed -n '1,120p'
            echo '```'
            echo
            echo "### Download metadata"
            echo '```json'
            sed -n '1,160p' "$download_meta_path"
            echo '```'
            echo
            echo "### Enrollment log tail"
            echo '```text'
            tail -n 120 "$enrollment_log_path"
            echo '```'
            if [ -n "$latest_firefox_snapshot" ] && [ -f "$latest_firefox_snapshot/summary.txt" ]; then
              echo
              echo "### Firefox snapshot summary"
              echo '```text'
              sed -n '1,160p' "$latest_firefox_snapshot/summary.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== Linux enrollment diagnostics summary ====="
          echo "Archive sha256: $archive_sha"
          echo "Remote mirror status: ${MIRROR_STATUS:-unknown}"
          if [ -n "$MIRROR_FAILURE_DETAIL" ]; then
            echo "Remote mirror failure detail: $MIRROR_FAILURE_DETAIL"
          fi
          if [ -n "$MIRRORED_REMOTE_PATH" ] && [ "${MIRROR_STATUS:-}" = "success" ]; then
            echo "Mirrored remote path: $MIRRORED_REMOTE_PATH"
          else
            echo "Mirrored remote path: unavailable"
          fi
          echo "--- Download metadata ---"
          sed -n '1,120p' "$download_meta_path"
          echo "--- Enrollment log tail ---"
          tail -n 80 "$enrollment_log_path"
          if [ -n "$latest_firefox_snapshot" ] && [ -f "$latest_firefox_snapshot/summary.txt" ]; then
            echo "--- Firefox snapshot summary ---"
            sed -n '1,120p' "$latest_firefox_snapshot/summary.txt"
          fi

      - name: Verify production Linux Firefox blocked page canary
        shell: bash
        env:
          EXPECTED_EXTENSION_ID: ${{ steps.provision-enrollment.outputs.extension_id }}
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_URL: https://www.mozilla.org/
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_OUTPUT: production-linux-firefox-block-page-canary.json
          LINUX_FIREFOX_BLOCK_PAGE_CANARY_DIAGNOSTICS_DIR: ${{ runner.temp }}/production-linux-firefox-block-page-canary
        run: |
          set -euo pipefail

          block_page_log="$RUNNER_TEMP/production-linux-firefox-block-page-canary.log"
          : > "$block_page_log"

          set +e
          timeout --kill-after=30s 3m node scripts/linux-firefox-block-page-canary.mjs 2>&1 | tee "$block_page_log"
          canary_status="${PIPESTATUS[0]}"
          set -e

          if [ "$canary_status" -ne 0 ]; then
            if [ "$canary_status" -eq 124 ] || [ "$canary_status" -eq 137 ]; then
              printf '%s\n' '{"status":"failed","error":"Linux Firefox blocked-page canary timed out"}' > production-linux-firefox-block-page-canary.json
              echo "::error title=Linux Firefox blocked-page canary::Timed out after 3 minutes"
            fi
            exit "$canary_status"
          fi

          test -f production-linux-firefox-block-page-canary.json

      - name: Restore Linux runner DNS after production Firefox canary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if command -v openpath >/dev/null 2>&1; then
            sudo openpath disable || true
          fi

          sudo systemctl stop dnsmasq || true
          sudo systemctl stop openpath-dnsmasq.timer || true
          sudo systemctl stop dnsmasq-watchdog.timer || true

          if command -v resolvectl >/dev/null 2>&1 && systemctl is-active --quiet systemd-resolved; then
            default_interface="$(ip route show default 2>/dev/null | awk '{print $5; exit}')"
            if [ -n "$default_interface" ]; then
              sudo resolvectl dns "$default_interface" 1.1.1.1 8.8.8.8 || true
            fi
            sudo resolvectl flush-caches || true
          else
            printf '%s\n' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf >/dev/null || true
          fi

      - name: Upload smoke test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-production
          path: |
            smoke-results.txt
            production-linux-enrollment-diagnostics.tar.gz
            production-linux-firefox-block-page-canary.json
            ${{ runner.temp }}/production-linux-enrollment-download.json
            ${{ runner.temp }}/production-linux-enrollment-download.headers
            ${{ runner.temp }}/production-linux-enrollment-download.body
            ${{ runner.temp }}/production-linux-enrollment.log
            ${{ runner.temp }}/production-linux-firefox-state
            ${{ runner.temp }}/production-linux-firefox-block-page-canary.log
            ${{ runner.temp }}/production-linux-firefox-block-page-canary
          retention-days: 7

      - name: Report smoke test failure
        if: failure()
        run: |
          echo "::error::PRODUCTION smoke tests FAILED! The deployment may be broken."
          echo "::error::Check the smoke test results for details."
          echo ""
          echo "Common issues:"
          echo "  - NPM reverse proxy stripping /api/ prefix"
          echo "  - CORS_ORIGINS not including production domain"
          echo "  - Container health check passed but service not fully ready"
          echo ""
          echo "Debug commands (run on production server):"
          echo "  curl -i ${{ needs.resolve-release-images.outputs.production_gateway_health_url }}"
          echo "  curl -i ${{ needs.resolve-release-images.outputs.production_ready_url }}"
          echo "  docker logs classroompath-api --tail 50"

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    needs:
      [
        verify-openpath-upstream,
        resolve-release-images,
        verify-staging-release-state,
        windows-firefox-canary,
        deploy-production,
        smoke-test-production,
        rollback-production,
      ]
    if: always() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Load staging deploy target
        id: staging-target
        run: node scripts/deploy-targets.mjs outputs staging >> "$GITHUB_OUTPUT"

      - name: Load production deploy target
        id: production-target
        run: node scripts/deploy-targets.mjs outputs production >> "$GITHUB_OUTPUT"

      - name: Generate release evidence
        run: |
          cat > release-evidence-input.json <<'EOF'
          {
            "GITHUB_REPOSITORY": "${{ github.repository }}",
            "GITHUB_RUN_ID": "${{ github.run_id }}",
            "GITHUB_SERVER_URL": "${{ github.server_url }}",
            "TAG_NAME": "${{ github.ref_name }}",
            "APP_SHA": "${{ github.sha }}",
            "OPENPATH_SHA": "${{ needs.verify-openpath-upstream.outputs.openpath_sha }}",
            "STAGING_URL": "${{ steps.staging-target.outputs.public_url }}",
            "STAGING_GATEWAY_HEALTH_URL": "${{ steps.staging-target.outputs.gateway_health_url }}",
            "STAGING_READY_URL": "${{ steps.staging-target.outputs.ready_url }}",
            "STAGING_API_CONFIG_URL": "${{ steps.staging-target.outputs.api_config_url }}",
            "PRODUCTION_URL": "${{ steps.production-target.outputs.public_url }}",
            "PRODUCTION_GATEWAY_HEALTH_URL": "${{ steps.production-target.outputs.gateway_health_url }}",
            "PRODUCTION_READY_URL": "${{ steps.production-target.outputs.ready_url }}",
            "PRODUCTION_API_CONFIG_URL": "${{ steps.production-target.outputs.api_config_url }}",
            "VERIFY_OPENPATH_RESULT": "${{ needs.verify-openpath-upstream.result }}",
            "RESOLVE_IMAGES_RESULT": "${{ needs.resolve-release-images.result }}",
            "VERIFY_STAGING_RESULT": "${{ needs.verify-staging-release-state.result }}",
            "PROMOTION_ELIGIBLE": "${{ needs.verify-staging-release-state.outputs.promotion_eligible }}",
            "PROMOTION_DEPLOYMENT_MODE": "${{ needs.verify-staging-release-state.outputs.promotion_deployment_mode }}",
            "STAGING_SMOKE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_smoke_result }}",
            "STAGING_SMOKE_STATUS": "${{ needs.verify-staging-release-state.outputs.staging_smoke_status }}",
            "STAGING_RELEASE_GATE_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_release_gate_result }}",
            "STAGING_WINDOWS_FIREFOX_HIGH_RISK": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_high_risk }}",
            "STAGING_EMAIL_DELIVERY_HIGH_RISK": "${{ needs.verify-staging-release-state.outputs.staging_email_delivery_high_risk }}",
            "STAGING_WINDOWS_FIREFOX_RISK_BASE_REF": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_risk_base_ref }}",
            "STAGING_WINDOWS_FIREFOX_RISK_BASE_SOURCE": "${{ needs.verify-staging-release-state.outputs.staging_windows_firefox_risk_base_source }}",
            "STAGING_WINDOWS_BOOTSTRAP_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_windows_bootstrap_result }}",
            "STAGING_FIREFOX_POLICY_RESULT": "${{ needs.verify-staging-release-state.outputs.staging_firefox_policy_result }}",
            "STAGING_FIREFOX_EXTENSION_ID": "${{ needs.verify-staging-release-state.outputs.staging_firefox_extension_id }}",
            "STAGING_FIREFOX_RELEASE_VERSION": "${{ needs.verify-staging-release-state.outputs.staging_firefox_release_version }}",
            "STAGING_FIREFOX_METADATA_SHA256": "${{ needs.verify-staging-release-state.outputs.staging_firefox_metadata_sha256 }}",
            "STAGING_FIREFOX_XPI_SHA256": "${{ needs.verify-staging-release-state.outputs.staging_firefox_xpi_sha256 }}",
            "STAGING_VERIFIED_AT": "${{ needs.verify-staging-release-state.outputs.staging_verified_at }}",
            "WINDOWS_FIREFOX_CANARY_RESULT": "${{ needs.windows-firefox-canary.outputs.canary_result || needs.windows-firefox-canary.result }}",
            "DEPLOY_RESULT": "${{ needs.deploy-production.result }}",
            "PRODUCTION_SMOKE_RESULT": "${{ needs.smoke-test-production.result }}",
            "ROLLBACK_RESULT": "${{ needs.rollback-production.result }}",
            "GATEWAY_IMAGE": "${{ needs.resolve-release-images.outputs.gateway_image }}",
            "MIGRATIONS_IMAGE": "${{ needs.resolve-release-images.outputs.migrations_image }}",
            "OPENPATH_API_IMAGE": "${{ needs.resolve-release-images.outputs.openpath_api_image }}",
            "SPA_IMAGE": "${{ needs.resolve-release-images.outputs.spa_image }}",
            "VERIFIER_IMAGE": "${{ needs.resolve-release-images.outputs.verifier_image }}"
          }
          EOF
          RELEASE_EVIDENCE_INPUT_PATH=release-evidence-input.json node scripts/write-release-evidence.mjs
          cat release-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            release-evidence.json
            release-evidence.md
          retention-days: 14

  rollback-production:
    name: Roll Back Production
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-test-production, resolve-release-images]
    if: always() && (needs.deploy-production.result == 'failure' || needs.smoke-test-production.result == 'failure')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy host
        id: resolve
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "" \
            "rollback" >> "$GITHUB_OUTPUT"

      - name: Roll back via SSH
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_CONTAINER_PLATFORM: ${{ needs.resolve-release-images.outputs.production_container_platform }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ steps.resolve.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.resolve.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN,PRODUCTION_CONTAINER_PLATFORM
          script_path: scripts/rollback-production-remote.sh
