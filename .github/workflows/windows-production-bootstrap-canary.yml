name: Windows Production Bootstrap Canary

on:
  workflow_call:
    outputs:
      canary_result:
        description: Production Windows bootstrap and AJAX auto-allow canary result.
        value: ${{ jobs.windows-production-bootstrap-canary.outputs.canary_result }}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-production-bootstrap-canary
  cancel-in-progress: false

jobs:
  windows-production-bootstrap-canary:
    name: Windows Production Bootstrap Canary
    runs-on: [self-hosted, Windows, X64, proxmox, classroompath]
    timeout-minutes: 30
    outputs:
      canary_result: ${{ steps.result.outputs.canary_result }}
    env:
      PRODUCTION_BASE_URL: https://classroompath.eu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Reset persistent Windows canary state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $openPathRoot = 'C:\OpenPath'
          $uninstallPath = Join-Path $openPathRoot 'Uninstall-OpenPath.ps1'
          if (Test-Path $uninstallPath) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstallPath
          }

          Get-ScheduledTask -TaskName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $acrylicService = Get-Service -Name 'AcrylicDNSProxySvc' -ErrorAction SilentlyContinue
          if ($acrylicService) {
            Stop-Service -Name $acrylicService.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $acrylicService.Name | Out-Null
          }

          foreach ($acrylicPath in @(
            (Join-Path ${env:ProgramFiles(x86)} 'Acrylic DNS Proxy'),
            (Join-Path ${env:ProgramFiles} 'Acrylic DNS Proxy')
          )) {
            $acrylicServicePath = Join-Path $acrylicPath 'AcrylicService.exe'
            if (Test-Path $acrylicServicePath) {
              & $acrylicServicePath /UNINSTALL 2>$null
            }
            Remove-Item -LiteralPath $acrylicPath -Recurse -Force -ErrorAction SilentlyContinue
          }

          foreach ($policyPath in @(
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\distribution\policies.json'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\distribution\policies.json')
          )) {
            Remove-Item -LiteralPath $policyPath -Force -ErrorAction SilentlyContinue
          }

          Remove-Item -LiteralPath 'C:\OpenPath' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Resolve production host
        id: resolve-production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_require_values \
            "production canaries" \
            DEPLOY_HOST "$DEPLOY_HOST" \
            DEPLOY_USER "$DEPLOY_USER" \
            DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          github_actions_remote_write_resolved_host_outputs \
            "$DEPLOY_HOST" \
            "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER" \
            "production canaries" >> "$GITHUB_OUTPUT"

      - name: Install production SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          github_actions_remote_install_ssh_key "$DEPLOY_SSH_KEY" ~/.ssh/classroompath-production-release

      - name: Read production billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read production client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing on production"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read production Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            ~/.ssh/classroompath-production-release \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing on production"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment canary
        id: provision
        shell: bash
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL: ${{ env.PRODUCTION_BASE_URL }}
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download and run live windows.ps1 enrollment script
        shell: pwsh
        env:
          CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision.outputs.enrollment_token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'GitHub Actions runner is not elevated enough to execute windows.ps1'
          }

          $workspace = Join-Path $env:RUNNER_TEMP 'windows-production-bootstrap-canary'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $headers = @{ Authorization = "Bearer $env:ENROLLMENT_TOKEN" }
          $windowsScriptUrl = "$env:PRODUCTION_BASE_URL/api/enroll/$env:CLASSROOM_ID/windows.ps1"
          $windowsScriptPath = Join-Path $workspace 'windows.ps1'

          Invoke-WebRequest -Uri $windowsScriptUrl -Headers $headers -OutFile $windowsScriptPath
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $windowsScriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "windows.ps1 exited with code $LASTEXITCODE"
          }

      - name: Re-run Update-OpenPath.ps1 and validate Firefox managed install
        shell: pwsh
        env:
          EXPECTED_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          EXPECTED_EXTENSION_VERSION: ${{ steps.provision.outputs.extension_version }}
          EXPECTED_PUBLIC_XPI_URL: ${{ steps.provision.outputs.public_firefox_xpi_url }}
        run: |
          $ErrorActionPreference = 'Stop'

          $openPathRoot = 'C:\OpenPath'
          $browserPolicySpecPath = Join-Path $openPathRoot 'lib\browser-policy-spec.json'
          if (-not (Test-Path $browserPolicySpecPath)) {
            throw 'browser-policy-spec.json was not installed to C:\OpenPath\lib'
          }

          $browserPolicySpec = Get-Content $browserPolicySpecPath -Raw | ConvertFrom-Json
          if (-not $browserPolicySpec.firefox -or -not $browserPolicySpec.chromium) {
            throw 'browser-policy-spec.json is incomplete after enrollment'
          }

          $firefoxCandidates = @((
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\firefox.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\firefox.exe')
          ) | Where-Object { $_ -and (Test-Path $_) })

          if ($firefoxCandidates.Count -eq 0) {
            Write-Host 'Firefox Release is not preinstalled on the runner; installing via winget'
            & winget install --exact --id Mozilla.Firefox --accept-package-agreements --accept-source-agreements --silent

            if ($LASTEXITCODE -ne 0) {
              throw "winget failed to install Firefox Release with exit code $LASTEXITCODE"
            }

            $firefoxCandidates = @((
              (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\firefox.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\firefox.exe')
            ) | Where-Object { $_ -and (Test-Path $_) })
          }

          if ($firefoxCandidates.Count -eq 0) {
            throw 'Firefox Release could not be installed on the runner'
          }

          $whitelistEtagPath = Join-Path $openPathRoot 'data\whitelist.etag'
          if (Test-Path $whitelistEtagPath) {
            Remove-Item $whitelistEtagPath -Force
          }

          $updateLogPath = Join-Path $env:RUNNER_TEMP 'Update-OpenPath.log'
          Remove-Item $updateLogPath -ErrorAction SilentlyContinue

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $openPathRoot 'scripts\Update-OpenPath.ps1') *>&1 |
            Tee-Object -FilePath $updateLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "Update-OpenPath.ps1 exited with code $LASTEXITCODE"
          }

          $updateLog = Get-Content $updateLogPath -Raw
          if ($updateLog -match 'Browser policy spec not found') {
            throw 'Browser policy spec not found'
          }

          if ($updateLog -match 'disabled=True' -or $updateLog -match 'DEACTIVATION FLAG detected') {
            throw 'Update-OpenPath.ps1 resolved a disabled whitelist and entered fail-open mode'
          }

          Write-Host 'Resolved whitelist state: active policy payload applied'

          $policiesCandidates = @((
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\distribution\policies.json'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\distribution\policies.json')
          ) | Where-Object { $_ -and (Test-Path $_) })

          if ($policiesCandidates.Count -eq 0) {
            throw 'Firefox policies.json was not created by the installed client'
          }

          $policiesPath = $policiesCandidates[0]
          $policies = Get-Content $policiesPath -Raw | ConvertFrom-Json
          $policyEntry = $policies.policies.ExtensionSettings.$env:EXPECTED_EXTENSION_ID

          if (-not $policyEntry) {
            throw "policies.json does not contain the expected extension id $env:EXPECTED_EXTENSION_ID"
          }

          if ($policyEntry.installation_mode -ne 'force_installed') {
            throw 'policies.json did not request force_installed'
          }

          if ($env:EXPECTED_PUBLIC_XPI_URL -and $policyEntry.install_url -ne $env:EXPECTED_PUBLIC_XPI_URL) {
            throw "Unexpected install_url in policies.json: $($policyEntry.install_url)"
          }

          $profileDir = Join-Path $env:RUNNER_TEMP 'windows-production-bootstrap-firefox-profile'
          $profileExtensionsDir = Join-Path $profileDir 'extensions'
          $extensionsRegistryPath = Join-Path $profileDir 'extensions.json'
          $firefoxLogPath = Join-Path $env:RUNNER_TEMP 'windows-production-bootstrap-firefox.log'

          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          Remove-Item $firefoxLogPath -ErrorAction SilentlyContinue

          $env:MOZ_LOG = 'EnterprisePolicies:5'
          $env:MOZ_LOG_FILE = $firefoxLogPath

          $process = Start-Process -FilePath $firefoxCandidates[0] -ArgumentList '-headless', '-profile', $profileDir, 'about:blank' -PassThru
          Start-Sleep -Seconds 20
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

          $profileExtensionPath = Join-Path $profileExtensionsDir "$($env:EXPECTED_EXTENSION_ID).xpi"
          $registryAddon = $null

          if (Test-Path $extensionsRegistryPath) {
            $registry = Get-Content $extensionsRegistryPath -Raw | ConvertFrom-Json
            $registryAddon = @($registry.addons) | Where-Object { $_.id -eq $env:EXPECTED_EXTENSION_ID } | Select-Object -First 1
          }

          $extensionInstalled = $null -ne $registryAddon -or (Test-Path $profileExtensionPath)
          $firefoxLog = if (Test-Path $firefoxLogPath) { Get-Content $firefoxLogPath -Raw } else { '' }

          if (-not $extensionInstalled -and -not $firefoxLog) {
            throw 'Firefox neither registered the force-installed extension nor emitted enterprise policy logs'
          }

          if ($firefoxLog -match 'policies\.json.*(error|failed|invalid)' -or $firefoxLog -match 'Enterprise Policies.*(error|failed|invalid)') {
            throw 'Firefox reported a policies.json parse error'
          }

          if (-not $extensionInstalled -and $firefoxLog -notmatch [regex]::Escape($env:EXPECTED_EXTENSION_ID)) {
            throw "Firefox did not register or report the extension id $env:EXPECTED_EXTENSION_ID"
          }

          if ($registryAddon -and $registryAddon.active -eq $false) {
            throw "Firefox registered $env:EXPECTED_EXTENSION_ID but did not activate it"
          }

          if (
            $registryAddon -and
            $env:EXPECTED_EXTENSION_VERSION -and
            $registryAddon.version -and
            $registryAddon.version -ne $env:EXPECTED_EXTENSION_VERSION
          ) {
            throw "Firefox installed version $($registryAddon.version) instead of $env:EXPECTED_EXTENSION_VERSION"
          }

      - name: Verify Windows AJAX auto-allow canary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/windows-ajax-auto-allow-canary.mjs

      - name: Record canary result
        id: result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          result=success
          if [ "$JOB_STATUS" != "success" ]; then
            result=failure
          fi
          echo "canary_result=$result" >> "$GITHUB_OUTPUT"

      - name: Verify production bootstrap canary evidence artifacts
        if: steps.result.outputs.canary_result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for required_artifact in \
            production-windows-bootstrap-canary.json \
            production-windows-ajax-auto-allow-canary.json
          do
            if [ ! -s "$required_artifact" ]; then
              echo "::error::$required_artifact is missing or empty after a successful canary"
              exit 1
            fi
          done

      - name: Upload production bootstrap canary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-production-bootstrap-canary
          path: |
            production-windows-bootstrap-canary.json
            production-windows-ajax-auto-allow-canary.json
            ${{ runner.temp }}/Update-OpenPath.log
            ${{ runner.temp }}/windows-production-bootstrap-firefox.log
          if-no-files-found: error
