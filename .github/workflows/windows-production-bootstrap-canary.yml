name: Windows Production Bootstrap Canary

on:
  workflow_call:
    inputs:
      target_environment:
        description: Target environment to exercise.
        required: true
        type: string
      base_url:
        description: Public base URL for the target environment.
        required: true
        type: string
      diagnostic_mode:
        description: Whether this run is diagnostic-only.
        required: false
        default: 'false'
        type: string
    outputs:
      canary_result:
        description: Production Windows bootstrap and AJAX auto-allow canary result.
        value: ${{ jobs.windows-production-bootstrap-canary.outputs.canary_result }}
      failure_boundary_id:
        description: Diagnostic failure boundary id for the Windows AJAX bootstrap canary.
        value: ${{ jobs.windows-production-bootstrap-canary.outputs.failure_boundary_id }}
      failure_boundary_message:
        description: Diagnostic failure boundary message for the Windows AJAX bootstrap canary.
        value: ${{ jobs.windows-production-bootstrap-canary.outputs.failure_boundary_message }}
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment to exercise.
        default: staging
        required: false
        type: choice
        options:
          - staging
          - production
      base_url:
        description: Optional public base URL override.
        required: false
        type: string
      diagnostic_mode:
        description: Mark this manual run as diagnostic-only.
        default: 'true'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-production-bootstrap-canary
  cancel-in-progress: false

jobs:
  windows-production-bootstrap-canary:
    name: Windows Production Bootstrap Canary
    runs-on: [self-hosted, Windows, X64, proxmox, classroompath]
    timeout-minutes: 30
    outputs:
      canary_result: ${{ steps.result.outputs.canary_result }}
      failure_boundary_id: ${{ steps.result.outputs.failure_boundary_id }}
      failure_boundary_message: ${{ steps.result.outputs.failure_boundary_message }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'staging' }}
      PRODUCTION_BASE_URL: ${{ inputs.base_url }}
      RUNNER_DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode || 'false' }}

    steps:
      - name: Restore Windows runner DNS before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $dnsServers = @('1.1.1.1', '8.8.8.8')
          $activeAdapters = @(Get-NetAdapter -ErrorAction SilentlyContinue |
            Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -notlike '*Loopback*' })

          foreach ($adapter in $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          if (-not $activeAdapters) {
            Set-DnsClientServerAddress -InterfaceAlias 'Ethernet' -ServerAddresses $dnsServers -ErrorAction SilentlyContinue
          }

          Clear-DnsClientCache -ErrorAction SilentlyContinue
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          "RUNNER_DNS_BEFORE_RESET=$runnerDnsServersJson" >> $env:GITHUB_ENV

          $githubProbe = Test-NetConnection github.com -Port 443 -WarningAction SilentlyContinue
          if (-not $githubProbe.NameResolutionSucceeded -or -not $githubProbe.TcpTestSucceeded) {
            throw "GitHub connectivity failed before checkout. NameResolution=$($githubProbe.NameResolutionSucceeded) Tcp443=$($githubProbe.TcpTestSucceeded)"
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          enable-cache: false
          cache-dependency-path: package-lock.json

      - name: Install Windows AJAX canary dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node -e "Promise.all([import('selenium-webdriver'), import('selenium-webdriver/firefox.js')])"

      - name: Resolve diagnostic target
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TARGET_ENVIRONMENT" != "staging" ] && [ "$TARGET_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported TARGET_ENVIRONMENT: $TARGET_ENVIRONMENT"
            exit 1
          fi

          base_url="$PRODUCTION_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="$(node scripts/deploy-targets.mjs get "$TARGET_ENVIRONMENT" publicUrl)"
          fi

          echo "PRODUCTION_BASE_URL=${base_url%/}" >> "$GITHUB_ENV"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_URL=${base_url%/}" >> "$GITHUB_ENV"
          echo "WINDOWS_AJAX_AUTO_ALLOW_CANARY_API_URL=${base_url%/}" >> "$GITHUB_ENV"
          firefox_install_base_url="$base_url"
          echo "firefox_install_url=${firefox_install_base_url%/}/api/extensions/firefox/openpath.xpi" >> "$GITHUB_OUTPUT"
          echo "Resolved $TARGET_ENVIRONMENT diagnostic target: ${base_url%/}"
          if [ "$RUNNER_DIAGNOSTIC_MODE" = "true" ]; then
            echo "Diagnostic-only runner canary; this run is not production release evidence."
          fi

      - name: Initialize Windows canary evidence files
        shell: bash
        run: |
          set -euo pipefail
          cat > production-windows-bootstrap-canary.json <<'JSON'
          {
            "success": false,
            "failureBoundary": {
              "id": "canary-not-started",
              "message": "Windows bootstrap canary did not reach the provisioning step."
            }
          }
          JSON
          cat > production-windows-ajax-auto-allow-canary.json <<'JSON'
          {
            "success": false,
            "failureBoundary": {
              "id": "canary-not-started",
              "message": "Windows AJAX auto-allow canary did not start."
            },
            "diagnosticPhases": [
              {
                "id": "artifact-written",
                "status": "failed"
              }
            ]
          }
          JSON
          cat > production-windows-runner-health.json <<'JSON'
          {
            "phase": "canary-not-started",
            "failureBoundary": {
              "id": "canary-not-started",
              "message": "Windows runner health evidence was initialized before risky canary steps."
            }
          }
          JSON

      - name: Assert destructive Windows runner is available
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-destructive-runner-available.mjs

      - name: Record Windows runner health before reset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-runner-health-evidence.mjs \
            --artifact production-windows-runner-health.json \
            --phase pre-reset \
            --dns-servers-json "${RUNNER_DNS_BEFORE_RESET:-[]}" \
            --target-url "$PRODUCTION_BASE_URL"

      - name: Reset persistent Windows canary state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $openPathRoot = 'C:\OpenPath'
          $uninstallPath = Join-Path $openPathRoot 'Uninstall-OpenPath.ps1'
          if (Test-Path $uninstallPath) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstallPath
          }

          Get-ScheduledTask -TaskName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'OpenPath-*' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $acrylicService = Get-Service -Name 'AcrylicDNSProxySvc' -ErrorAction SilentlyContinue
          if ($acrylicService) {
            Stop-Service -Name $acrylicService.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $acrylicService.Name | Out-Null
          }

          foreach ($acrylicPath in @(
            (Join-Path ${env:ProgramFiles(x86)} 'Acrylic DNS Proxy'),
            (Join-Path ${env:ProgramFiles} 'Acrylic DNS Proxy')
          )) {
            $acrylicServicePath = Join-Path $acrylicPath 'AcrylicService.exe'
            if (Test-Path $acrylicServicePath) {
              & $acrylicServicePath /UNINSTALL 2>$null
            }
            Remove-Item -LiteralPath $acrylicPath -Recurse -Force -ErrorAction SilentlyContinue
          }

          foreach ($policyPath in @(
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\distribution\policies.json'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\distribution\policies.json')
          )) {
            Remove-Item -LiteralPath $policyPath -Force -ErrorAction SilentlyContinue
          }

          Remove-Item -LiteralPath 'C:\OpenPath' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore Windows runner DNS after reset
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Record Windows runner health after reset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          node scripts/write-runner-health-evidence.mjs `
            --artifact production-windows-runner-health.json `
            --phase post-reset `
            --dns-servers-json "$runnerDnsServersJson" `
            --target-url "$env:PRODUCTION_BASE_URL"

      - name: Resolve target host
        id: resolve-production
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ env.TARGET_ENVIRONMENT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_LAN_HOST: 192.168.1.114
          STAGING_DEPLOY_LAN_PORT: 22
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            target_host="$DEPLOY_HOST"
            target_port="${DEPLOY_PORT:-22}"
            target_user="$DEPLOY_USER"
            target_key="$DEPLOY_SSH_KEY"
          elif [ "$TARGET_ENVIRONMENT" = "staging" ]; then
            target_host="$STAGING_DEPLOY_HOST"
            target_port="${STAGING_DEPLOY_PORT:-22}"
            target_user="$STAGING_DEPLOY_USER"
            target_key="$STAGING_DEPLOY_SSH_KEY"
            if [ "$RUNNER_ENVIRONMENT_CONTEXT" = "self-hosted" ]; then
              target_host="$STAGING_DEPLOY_LAN_HOST"
              target_port="$STAGING_DEPLOY_LAN_PORT"
            fi
          else
            echo "::error::Unsupported TARGET_ENVIRONMENT: $TARGET_ENVIRONMENT"
            exit 1
          fi

          github_actions_remote_require_values \
            "$TARGET_ENVIRONMENT canaries" \
            TARGET_HOST "$target_host" \
            TARGET_USER "$target_user" \
            TARGET_SSH_KEY "$target_key"

          github_actions_remote_install_ssh_key "$target_key" ~/.ssh/classroompath-bootstrap-canary
          echo "TARGET_SSH_KEY_PATH=$HOME/.ssh/classroompath-bootstrap-canary" >> "$GITHUB_ENV"

          github_actions_remote_write_resolved_host_outputs \
            "$target_host" \
            "$target_port" \
            "$target_user" \
            "$TARGET_ENVIRONMENT canaries" >> "$GITHUB_OUTPUT"

      - name: Read target billing mode
        id: read-billing-mode
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          billing_mode="$(github_actions_remote_read_env_key \
            "$TARGET_SSH_KEY_PATH" \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_BILLING_MODE)"

          if [ -z "$billing_mode" ]; then
            billing_mode="manual_only"
          fi

          echo "billing_mode=$billing_mode" >> "$GITHUB_OUTPUT"

      - name: Read target client canary admin token
        if: steps.read-billing-mode.outputs.billing_mode == 'manual_only'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          client_canary_admin_token="$(github_actions_remote_read_env_key \
            "$TARGET_SSH_KEY_PATH" \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            CP_CLIENT_CANARY_ADMIN_TOKEN)"

          if [ -z "$client_canary_admin_token" ]; then
            echo "::error::CP_CLIENT_CANARY_ADMIN_TOKEN is missing for $TARGET_ENVIRONMENT"
            exit 1
          fi

          echo "::add-mask::$client_canary_admin_token"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN=$client_canary_admin_token" >> "$GITHUB_ENV"

      - name: Read target Stripe webhook secret
        if: steps.read-billing-mode.outputs.billing_mode == 'stripe'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-actions-remote.sh
          stripe_webhook_secret="$(github_actions_remote_read_env_key \
            "$TARGET_SSH_KEY_PATH" \
            "${{ steps.resolve-production.outputs.port }}" \
            "${{ steps.resolve-production.outputs.user }}" \
            "${{ steps.resolve-production.outputs.ip }}" \
            STRIPE_WEBHOOK_SECRET)"

          if [ -z "$stripe_webhook_secret" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is missing for $TARGET_ENVIRONMENT"
            exit 1
          fi

          echo "::add-mask::$stripe_webhook_secret"
          echo "PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_STRIPE_WEBHOOK_SECRET=$stripe_webhook_secret" >> "$GITHUB_ENV"

      - name: Provision production enrollment canary
        id: provision
        shell: bash
        env:
          PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_BILLING_MODE: ${{ steps.read-billing-mode.outputs.billing_mode }}
        run: node scripts/create-production-windows-bootstrap-canary.mjs

      - name: Download and run live windows.ps1 enrollment script
        shell: pwsh
        env:
          CLASSROOM_ID: ${{ steps.provision.outputs.classroom_id }}
          ENROLLMENT_TOKEN: ${{ steps.provision.outputs.enrollment_token }}
          OPENPATH_FIREFOX_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          OPENPATH_FIREFOX_EXTENSION_INSTALL_URL: ${{ steps.inputs.outputs.firefox_install_url }}
        run: |
          $ErrorActionPreference = 'Stop'

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'GitHub Actions runner is not elevated enough to execute windows.ps1'
          }

          $workspace = Join-Path $env:RUNNER_TEMP 'windows-production-bootstrap-canary'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $headers = @{ Authorization = "Bearer $env:ENROLLMENT_TOKEN" }
          $windowsScriptUrl = "$env:PRODUCTION_BASE_URL/api/enroll/$env:CLASSROOM_ID/windows.ps1"
          $windowsScriptPath = Join-Path $workspace 'windows.ps1'

          Invoke-WebRequest -Uri $windowsScriptUrl -Headers $headers -OutFile $windowsScriptPath
          if (-not $env:OPENPATH_FIREFOX_EXTENSION_ID -or -not $env:OPENPATH_FIREFOX_EXTENSION_INSTALL_URL) {
            throw 'Expected Firefox extension id and install URL are required before executing windows.ps1'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $windowsScriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "windows.ps1 exited with code $LASTEXITCODE"
          }

      - name: Re-run Update-OpenPath.ps1 and validate Firefox managed install
        shell: pwsh
        env:
          EXPECTED_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
          EXPECTED_EXTENSION_VERSION: ${{ steps.provision.outputs.extension_version }}
          EXPECTED_PUBLIC_XPI_URL: ${{ steps.inputs.outputs.firefox_install_url }}
        run: |
          $ErrorActionPreference = 'Stop'

          $openPathRoot = 'C:\OpenPath'
          $browserPolicySpecPath = Join-Path $openPathRoot 'lib\browser-policy-spec.json'
          if (-not (Test-Path $browserPolicySpecPath)) {
            throw 'browser-policy-spec.json was not installed to C:\OpenPath\lib'
          }

          $browserPolicySpec = Get-Content $browserPolicySpecPath -Raw | ConvertFrom-Json
          if (-not $browserPolicySpec.firefox -or -not $browserPolicySpec.chromium) {
            throw 'browser-policy-spec.json is incomplete after enrollment'
          }

          $firefoxCandidates = @((
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\firefox.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\firefox.exe')
          ) | Where-Object { $_ -and (Test-Path $_) })

          if ($firefoxCandidates.Count -eq 0) {
            Write-Host 'Firefox Release is not preinstalled on the runner; installing via winget'
            & winget install --exact --id Mozilla.Firefox --accept-package-agreements --accept-source-agreements --silent

            if ($LASTEXITCODE -ne 0) {
              throw "winget failed to install Firefox Release with exit code $LASTEXITCODE"
            }

            $firefoxCandidates = @((
              (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\firefox.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\firefox.exe')
            ) | Where-Object { $_ -and (Test-Path $_) })
          }

          if ($firefoxCandidates.Count -eq 0) {
            throw 'Firefox Release could not be installed on the runner'
          }

          $whitelistEtagPath = Join-Path $openPathRoot 'data\whitelist.etag'
          if (Test-Path $whitelistEtagPath) {
            Remove-Item $whitelistEtagPath -Force
          }

          $updateLogPath = Join-Path $env:RUNNER_TEMP 'Update-OpenPath.log'
          Remove-Item $updateLogPath -ErrorAction SilentlyContinue

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $openPathRoot 'scripts\Update-OpenPath.ps1') *>&1 |
            Tee-Object -FilePath $updateLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "Update-OpenPath.ps1 exited with code $LASTEXITCODE"
          }

          $updateLog = Get-Content $updateLogPath -Raw
          if ($updateLog -match 'Browser policy spec not found') {
            throw 'Browser policy spec not found'
          }

          if ($updateLog -match 'disabled=True' -or $updateLog -match 'DEACTIVATION FLAG detected') {
            throw 'Update-OpenPath.ps1 resolved a disabled whitelist and entered fail-open mode'
          }

          Write-Host 'Resolved whitelist state: active policy payload applied'

          $policiesCandidates = @((
            (Join-Path ${env:ProgramFiles} 'Mozilla Firefox\distribution\policies.json'),
            (Join-Path ${env:ProgramFiles(x86)} 'Mozilla Firefox\distribution\policies.json')
          ) | Where-Object { $_ -and (Test-Path $_) })

          if ($policiesCandidates.Count -eq 0) {
            throw 'Firefox policies.json was not created by the installed client'
          }

          $policiesPath = $policiesCandidates[0]
          $policies = Get-Content $policiesPath -Raw | ConvertFrom-Json
          $policyEntry = $policies.policies.ExtensionSettings.$env:EXPECTED_EXTENSION_ID

          if (-not $policyEntry) {
            throw "policies.json does not contain the expected extension id $env:EXPECTED_EXTENSION_ID"
          }

          if ($policyEntry.installation_mode -ne 'force_installed') {
            throw 'policies.json did not request force_installed'
          }

          if ($env:EXPECTED_PUBLIC_XPI_URL -and $policyEntry.install_url -ne $env:EXPECTED_PUBLIC_XPI_URL) {
            throw "Unexpected install_url in policies.json: $($policyEntry.install_url)"
          }

          $openPathStatus = @{
            configVersion = $browserPolicySpec.version
            firefoxPolicyPath = $policiesPath
            extensionId = $env:EXPECTED_EXTENSION_ID
            extensionInstalled = $null
            extensionActive = $null
            scheduledTasks = @(Get-ScheduledTask -TaskName 'OpenPath-*' -ErrorAction SilentlyContinue | ForEach-Object { $_.TaskName })
            services = @(Get-Service -Name 'AcrylicDNSProxySvc' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Status)" })
          }
          $openPathStatusJson = ConvertTo-Json -Compress -Depth 6 -InputObject $openPathStatus
          "OPENPATH_STATUS_JSON=$openPathStatusJson" >> $env:GITHUB_ENV

      - name: Record Windows runner health after OpenPath update
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-runner-health-evidence.mjs \
            --artifact production-windows-runner-health.json \
            --phase post-install \
            --openpath-status-json "${OPENPATH_STATUS_JSON:-{}}" \
            --target-url "$PRODUCTION_BASE_URL"

      - name: Verify Windows AJAX auto-allow canary
        shell: pwsh
        env:
          WINDOWS_AJAX_AUTO_ALLOW_CANARY_GROUP_ID: ${{ steps.provision.outputs.group_id }}
          WINDOWS_AJAX_AUTO_ALLOW_CANARY_ADMIN_TOKEN: ${{ env.PRODUCTION_WINDOWS_BOOTSTRAP_CANARY_ADMIN_TOKEN }}
          WINDOWS_AJAX_AUTO_ALLOW_FIREFOX_MODE: selenium
          EXPECTED_EXTENSION_ID: ${{ steps.provision.outputs.extension_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/windows-ajax-auto-allow-canary.mjs

      - name: Summarize Windows AJAX auto-allow evidence
        id: ajax-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/summarize-windows-ajax-auto-allow-evidence.mjs \
            --artifact production-windows-ajax-auto-allow-canary.json

      - name: Verify production bootstrap canary evidence artifacts
        id: verify-artifacts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.ajax-summary.outputs.canary_result }}" != "success" ]; then
            echo "Skipping artifact completeness check because the functional canary failed."
            exit 0
          fi
          for required_artifact in \
            production-windows-bootstrap-canary.json \
            production-windows-ajax-auto-allow-canary.json
          do
            if [ ! -s "$required_artifact" ]; then
              echo "::error::$required_artifact is missing or empty after a successful canary"
              exit 1
            fi
          done

      - name: Restore Windows runner DNS before artifact upload
        if: always()
        continue-on-error: true
        uses: ./.github/actions/restore-windows-runner-dns

      - name: Record Windows runner health before artifact upload
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          FAILURE_BOUNDARY_ID: ${{ steps.ajax-summary.outputs.failure_boundary_id || 'artifact-written' }}
          FAILURE_BOUNDARY_MESSAGE: ${{ steps.ajax-summary.outputs.failure_boundary_message || 'Windows AJAX evidence artifact was not written.' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $runnerDnsServers = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.ServerAddresses } |
            ForEach-Object { $_.ServerAddresses } |
            Sort-Object -Unique)
          $runnerDnsServersJson = ConvertTo-Json -Compress -InputObject @($runnerDnsServers)
          $artifactProbe = Test-NetConnection pipelines.actions.githubusercontent.com -Port 443 -WarningAction SilentlyContinue
          $artifactReachable = ($artifactProbe.NameResolutionSucceeded -and $artifactProbe.TcpTestSucceeded).ToString().ToLowerInvariant()
          node scripts/write-runner-health-evidence.mjs `
            --artifact production-windows-runner-health.json `
            --phase pre-upload `
            --dns-servers-json "$runnerDnsServersJson" `
            --artifact-endpoint-reachable "$artifactReachable" `
            --failure-boundary-id "$env:FAILURE_BOUNDARY_ID" `
            --failure-boundary-message "$env:FAILURE_BOUNDARY_MESSAGE" `
            --target-url "$env:PRODUCTION_BASE_URL"

      - name: Upload production bootstrap canary artifacts
        id: upload-artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-production-bootstrap-canary
          path: |
            production-windows-bootstrap-canary.json
            production-windows-ajax-auto-allow-canary.json
            production-windows-runner-health.json
            ${{ runner.temp }}/Update-OpenPath.log
            ${{ runner.temp }}/windows-production-bootstrap-firefox.log
          if-no-files-found: error
          retention-days: 14

      - name: Record canary result
        id: result
        if: always()
        shell: bash
        env:
          FUNCTIONAL_RESULT: ${{ steps.ajax-summary.outputs.canary_result || 'failure' }}
          FUNCTIONAL_BOUNDARY_ID: ${{ steps.ajax-summary.outputs.failure_boundary_id || 'artifact-written' }}
          FUNCTIONAL_BOUNDARY_MESSAGE: ${{ steps.ajax-summary.outputs.failure_boundary_message || 'Windows AJAX evidence artifact was not written.' }}
          VERIFY_ARTIFACTS_OUTCOME: ${{ steps.verify-artifacts.outcome }}
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.upload-artifacts.outcome }}
        run: |
          set -euo pipefail

          # ARTIFACT_UPLOAD_OUTCOME comes from steps.upload-artifacts.outcome.
          result="$FUNCTIONAL_RESULT"
          failure_boundary_id="$FUNCTIONAL_BOUNDARY_ID"
          failure_boundary_message="$FUNCTIONAL_BOUNDARY_MESSAGE"

          if [ "$ARTIFACT_UPLOAD_OUTCOME" != "success" ]; then
            result=failure
            failure_boundary_id=artifact-upload
            failure_boundary_message='Functional canary evidence was produced but GitHub artifact upload failed.'
          elif [ "$VERIFY_ARTIFACTS_OUTCOME" != "success" ]; then
            result=failure
            failure_boundary_id=artifact-written
            failure_boundary_message='Functional canary reported success but required evidence artifacts were missing or empty.'
          elif [ "$FUNCTIONAL_RESULT" = "success" ]; then
            failure_boundary_id=none
            failure_boundary_message='Windows AJAX auto-allow canary completed successfully.'
          fi

          echo "canary_result=$result" >> "$GITHUB_OUTPUT"
          echo "failure_boundary_id=$failure_boundary_id" >> "$GITHUB_OUTPUT"
          echo "failure_boundary_message=$failure_boundary_message" >> "$GITHUB_OUTPUT"

          {
            echo "## Windows Bootstrap Canary Boundary"
            echo ""
            echo "- Result: \`$result\`"
            echo "- Failure boundary: \`$failure_boundary_id\`"
            echo "- Message: $failure_boundary_message"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" != "success" ]; then
            echo "::error::$failure_boundary_message"
            exit 1
          fi
