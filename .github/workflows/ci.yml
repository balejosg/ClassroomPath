name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  detect-relevant-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      ci_relevant: ${{ steps.filter.outputs.ci_relevant }}
      domain_owners: ${{ steps.filter.outputs.domain_owners }}
      release_gates: ${{ steps.filter.outputs.release_gates }}
      required_approvals: ${{ steps.filter.outputs.required_approvals }}
      reviewers: ${{ steps.filter.outputs.reviewers }}
      product_validation: ${{ steps.filter.outputs.product_validation }}
      ops_regression: ${{ steps.filter.outputs.ops_regression }}
      release_automation: ${{ steps.filter.outputs.release_automation }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            echo "$changed_files"
          else
            echo "(none)"
          fi

          changed_files_file="$RUNNER_TEMP/classroompath-changed-files.txt"
          printf '%s\n' "$changed_files" > "$changed_files_file"
          node scripts/detect-ci-relevant-changes.mjs "$changed_files_file" >> "$GITHUB_OUTPUT"

  product-validation:
    name: Product Validation
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.product_validation == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            package-lock.json
            upstream/openpath/package-lock.json

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Install OpenPath submodule dependencies
        working-directory: upstream/openpath
        run: npm ci

      - name: Build ClassroomPath
        run: npm run build

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  ops-regression:
    name: Ops Regression
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.ops_regression == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Run fresh named-volume installer smoke
        run: npm run test:windows-offline-installer:volumes

      - name: Run ops regression tests
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ops-regression-report.json"
          npm run test:ci-regression

      - name: Summarize verification report
        if: always()
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ops-regression-report.json"
          if [ -f "$VERIFY_REPORT_FILE" ]; then
            node scripts/print-verify-report-summary.mjs "$VERIFY_REPORT_FILE"
          else
            echo "No verification report found at $VERIFY_REPORT_FILE"
          fi

      - name: Upload verification report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classroompath-ops-regression-report
          path: ${{ runner.temp }}/classroompath-ops-regression-report.json
          if-no-files-found: warn

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  release-automation:
    name: Release Automation Regression
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.release_automation == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Run release automation regression tests
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-release-automation-report.json"
          npm run test:release-automation

      - name: Summarize verification report
        if: always()
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-release-automation-report.json"
          if [ -f "$VERIFY_REPORT_FILE" ]; then
            node scripts/print-verify-report-summary.mjs "$VERIFY_REPORT_FILE"
          else
            echo "No verification report found at $VERIFY_REPORT_FILE"
          fi

      - name: Upload verification report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classroompath-release-automation-report
          path: ${{ runner.temp }}/classroompath-release-automation-report.json
          if-no-files-found: warn

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  typecheck-ratchet:
    name: Typecheck Ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Run typecheck ratchet
        run: npm run verify:scripts-types

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        detect-relevant-changes,
        product-validation,
        ops-regression,
        release-automation,
        typecheck-ratchet,
      ]
    if: always()

    steps:
      - name: Capture CI timing metadata
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          report_dir="$RUNNER_TEMP/classroompath-ci-timing"
          jobs_json="$report_dir/jobs.json"
          report_md="$report_dir/ci-timing-measurement.md"
          mkdir -p "$report_dir"

          if gh run view "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,jobs \
            > "$jobs_json"; then
            {
              echo "# ClassroomPath CI Timing Metadata for run $GITHUB_RUN_ID"
              echo
              echo "Raw GitHub job metadata was captured in \`jobs.json\`."
              echo
              echo "Render the full cache/timing report after the run completes:"
              echo
              echo "\`\`\`bash"
              echo "gh run view $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --json name,jobs > jobs.json"
              echo "node scripts/measure-ci-cache.mjs --jobs-json jobs.json --format markdown"
              echo "\`\`\`"
              echo
              echo "Policy: do not add Playwright cache, Turbo cache, or new cache policy from this same-run metadata. Collect repeated CI samples first."
              echo
              if command -v jq >/dev/null 2>&1; then
                echo "## Job timestamp snapshot"
                echo
                jq -r '.jobs[]? | "- \(.name): \(.conclusion // "unknown") (\(.startedAt // "n/a") -> \(.completedAt // "n/a"))"' "$jobs_json"
              fi
            } > "$report_md"
          else
            {
              echo "# ClassroomPath CI Timing Metadata for run $GITHUB_RUN_ID"
              echo
              echo "GitHub job metadata was not available during this run, so CI produced a safe placeholder instead of failing the workflow."
              echo
              echo "Generate the measurement after the run completes:"
              echo
              echo "\`\`\`bash"
              echo "gh run view $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --json name,jobs > jobs.json"
              echo "node scripts/measure-ci-cache.mjs --jobs-json jobs.json --format markdown"
              echo "\`\`\`"
              echo
              echo "Policy: do not add Playwright cache, Turbo cache, or new cache policy from this placeholder. Collect repeated CI samples first."
            } > "$report_md"
          fi

          cat "$report_md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI timing metadata artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classroompath-ci-timing-measurement
          path: ${{ runner.temp }}/classroompath-ci-timing/
          if-no-files-found: warn

      - name: Check all jobs
        run: |
          echo "CI relevant: ${{ needs.detect-relevant-changes.outputs.ci_relevant }}"
          echo "Product validation: ${{ needs.product-validation.result }}"
          echo "Ops regression: ${{ needs.ops-regression.result }}"
          echo "Release automation: ${{ needs.release-automation.result }}"
          echo "Typecheck ratchet: ${{ needs.typecheck-ratchet.result }}"

          if [[ "${{ needs.product-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.product-validation.result }}" == "cancelled" ]] || \
             [[ "${{ needs.ops-regression.result }}" == "failure" ]] || \
             [[ "${{ needs.ops-regression.result }}" == "cancelled" ]] || \
             [[ "${{ needs.release-automation.result }}" == "failure" ]] || \
             [[ "${{ needs.release-automation.result }}" == "cancelled" ]] || \
             [[ "${{ needs.typecheck-ratchet.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck-ratchet.result }}" == "cancelled" ]]; then
            echo "CI failed"
            exit 1
          fi

          if [[ "${{ needs.detect-relevant-changes.outputs.ci_relevant }}" != "true" ]]; then
            echo "All validation skipped: no relevant changes"
          fi

          echo "All CI checks passed"
