name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-spa:
    name: SPA Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run SPA tests
        run: npm run test --workspace=@classroompath/react-spa

  test-integration:
    name: API Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath_dev
          POSTGRES_DB: openpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: |
          npm run db:push --workspace=@classroompath/api
          npm run db:push --workspace=@openpath/api
        env:
          DATABASE_URL: postgres://openpath:openpath_dev@localhost:5432/openpath
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: openpath
          DB_USER: openpath
          DB_PASSWORD: openpath_dev

      - name: Run API integration tests
        run: npm run test:integration --workspace=@classroompath/api
        env:
          DATABASE_URL: postgres://openpath:openpath_dev@localhost:5432/openpath
          JWT_SECRET: test-jwt-secret

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-spa, test-integration]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath_dev
          POSTGRES_DB: openpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build workspaces
        run: npm run build

      - name: Run DB migrations
        run: |
          npm run db:push --workspace=@classroompath/api
          npm run db:push --workspace=@openpath/api
        env:
          DATABASE_URL: postgres://openpath:openpath_dev@localhost:5432/openpath
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: openpath
          DB_USER: openpath
          DB_PASSWORD: openpath_dev

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          DATABASE_URL: postgres://openpath:openpath_dev@localhost:5432/openpath
          JWT_SECRET: test-jwt-secret
