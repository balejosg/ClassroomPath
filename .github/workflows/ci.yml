name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-relevant-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      ci_relevant: ${{ steps.filter.outputs.ci_relevant }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            echo "$changed_files"
          else
            echo "(none)"
          fi

          ci_relevant=false

          if echo "$changed_files" | grep -Eq '^(api/|react-spa/|docker/|scripts/|tests/|config/|\.github/workflows/|package\.json$|package-lock\.json$|upstream/openpath$|\.gitmodules$)'; then
            ci_relevant=true
          fi

          echo "ci_relevant=$ci_relevant" >> "$GITHUB_OUTPUT"

  build-and-validate:
    name: Build And Validate ClassroomPath
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.ci_relevant == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            package-lock.json
            upstream/openpath/package-lock.json

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Install OpenPath submodule dependencies
        working-directory: upstream/openpath
        run: npm ci

      - name: Build ClassroomPath
        run: npm run build

      - name: Run CI regression tests
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ci-regression-report.json"
          npm run test:ci-regression

      - name: Summarize verification report
        if: always()
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ci-regression-report.json"
          if [ -f "$VERIFY_REPORT_FILE" ]; then
            node scripts/print-verify-report-summary.mjs "$VERIFY_REPORT_FILE"
          else
            echo "No verification report found at $VERIFY_REPORT_FILE"
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-relevant-changes, build-and-validate]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "CI relevant: ${{ needs.detect-relevant-changes.outputs.ci_relevant }}"

          if [[ "${{ needs.build-and-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-validate.result }}" == "cancelled" ]]; then
            echo "CI failed"
            exit 1
          fi

          if [[ "${{ needs.build-and-validate.result }}" == "skipped" ]]; then
            echo "Build and validation skipped: no relevant changes"
          fi

          echo "All CI checks passed"
