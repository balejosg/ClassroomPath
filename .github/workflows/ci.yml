name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-relevant-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      ci_relevant: ${{ steps.filter.outputs.ci_relevant }}
      domain_owners: ${{ steps.filter.outputs.domain_owners }}
      release_gates: ${{ steps.filter.outputs.release_gates }}
      required_approvals: ${{ steps.filter.outputs.required_approvals }}
      reviewers: ${{ steps.filter.outputs.reviewers }}
      product_validation: ${{ steps.filter.outputs.product_validation }}
      ops_regression: ${{ steps.filter.outputs.ops_regression }}
      release_automation: ${{ steps.filter.outputs.release_automation }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            echo "$changed_files"
          else
            echo "(none)"
          fi

          changed_files_file="$RUNNER_TEMP/classroompath-changed-files.txt"
          printf '%s\n' "$changed_files" > "$changed_files_file"
          node scripts/detect-ci-relevant-changes.mjs "$changed_files_file" >> "$GITHUB_OUTPUT"

  product-validation:
    name: Product Validation
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.product_validation == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            package-lock.json
            upstream/openpath/package-lock.json

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Install OpenPath submodule dependencies
        working-directory: upstream/openpath
        run: npm ci

      - name: Build ClassroomPath
        run: npm run build

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  ops-regression:
    name: Ops Regression
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.ops_regression == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Run ops regression tests
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ops-regression-report.json"
          npm run test:ci-regression

      - name: Summarize verification report
        if: always()
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-ops-regression-report.json"
          if [ -f "$VERIFY_REPORT_FILE" ]; then
            node scripts/print-verify-report-summary.mjs "$VERIFY_REPORT_FILE"
          else
            echo "No verification report found at $VERIFY_REPORT_FILE"
          fi

      - name: Upload verification report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classroompath-ops-regression-report
          path: ${{ runner.temp }}/classroompath-ops-regression-report.json
          if-no-files-found: warn

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  release-automation:
    name: Release Automation Regression
    runs-on: ubuntu-latest
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.release_automation == 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install ClassroomPath dependencies
        run: npm ci

      - name: Run release automation regression tests
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-release-automation-report.json"
          npm run test:release-automation

      - name: Summarize verification report
        if: always()
        run: |
          export VERIFY_REPORT_FILE="$RUNNER_TEMP/classroompath-release-automation-report.json"
          if [ -f "$VERIFY_REPORT_FILE" ]; then
            node scripts/print-verify-report-summary.mjs "$VERIFY_REPORT_FILE"
          else
            echo "No verification report found at $VERIFY_REPORT_FILE"
          fi

      - name: Upload verification report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classroompath-release-automation-report
          path: ${{ runner.temp }}/classroompath-release-automation-report.json
          if-no-files-found: warn

      - name: Show verification owners
        if: always()
        run: |
          echo "Domain owners: ${{ needs.detect-relevant-changes.outputs.domain_owners || 'none' }}"
          echo "Reviewers: ${{ needs.detect-relevant-changes.outputs.reviewers || 'none' }}"
          echo "Required approvals: ${{ needs.detect-relevant-changes.outputs.required_approvals || 'none' }}"
          echo "Release gates: ${{ needs.detect-relevant-changes.outputs.release_gates || 'none' }}"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-relevant-changes, product-validation, ops-regression, release-automation]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "CI relevant: ${{ needs.detect-relevant-changes.outputs.ci_relevant }}"
          echo "Product validation: ${{ needs.product-validation.result }}"
          echo "Ops regression: ${{ needs.ops-regression.result }}"
          echo "Release automation: ${{ needs.release-automation.result }}"

          if [[ "${{ needs.product-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.product-validation.result }}" == "cancelled" ]] || \
             [[ "${{ needs.ops-regression.result }}" == "failure" ]] || \
             [[ "${{ needs.ops-regression.result }}" == "cancelled" ]] || \
             [[ "${{ needs.release-automation.result }}" == "failure" ]] || \
             [[ "${{ needs.release-automation.result }}" == "cancelled" ]]; then
            echo "CI failed"
            exit 1
          fi

          if [[ "${{ needs.detect-relevant-changes.outputs.ci_relevant }}" != "true" ]]; then
            echo "All validation skipped: no relevant changes"
          fi

          echo "All CI checks passed"
