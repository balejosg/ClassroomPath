services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openpath
      POSTGRES_PASSWORD: openpath_dev
      POSTGRES_DB: openpath
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpath -d openpath']
      interval: 5s
      timeout: 5s
      retries: 10
