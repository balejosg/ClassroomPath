# ClassroomPath Docker Compose
# API + SPA containers for use with Nginx Proxy Manager

services:
  # API server (Node.js)
  api:
    build:
      context: ../upstream/openpath
      dockerfile: ../../docker/Dockerfile.api
    container_name: classroompath-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../config/.env
    volumes:
      - api-data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SPA static server (nginx)
  # SPA static server (nginx)
  spa:
    build:
      context: ../upstream/openpath
      dockerfile: ../../docker/Dockerfile.spa
    container_name: classroompath-spa
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./spa-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  api-data:
