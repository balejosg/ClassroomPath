# ClassroomPath Docker Compose
# Gateway API + OpenPath API + SPA

name: ${COMPOSE_PROJECT_NAME:-classroompath-production}

networks:
  openpath_default:
    driver: bridge

services:
  # ClassroomPath Gateway API (handles multi-tenancy)
  # The gateway is the public-facing entry point. The upstream SSL proxy
  # forwards to host port 3000, so the gateway MUST be mapped there.
  gateway:
    image: ${CLASSROOMPATH_GATEWAY_IMAGE:-classroompath-gateway:local}
    platform: ${CLASSROOMPATH_CONTAINER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: docker/Dockerfile.cp-api
    container_name: classroompath-gateway
    restart: unless-stopped
    ports:
      - '3000:3001'
      - '3001:3001'
    env_file:
      - ../config/.env
    environment:
      - CP_PORT=3001
      - OPENPATH_API_URL=http://api:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /srv/classroompath/downloads:/app/react-spa/dist/downloads:ro
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3001/cp/ready']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - openpath_default
    security_opt:
      - no-new-privileges:true

  # OpenPath owns template provisioning. The gateway never sees the template
  # or personalized artifact volume.
  windows-offline-installer-provision:
    image: ${OPENPATH_API_IMAGE:-classroompath-api:local}
    platform: ${CLASSROOMPATH_CONTAINER_PLATFORM:-linux/amd64}
    build:
      context: ../upstream/openpath
      dockerfile: ../../docker/Dockerfile.api
    container_name: classroompath-openpath-windows-offline-installer-provision
    restart: 'no'
    env_file:
      - ../config/.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_DIR=/app/var/windows-offline-installer/templates
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACTS_DIR=/app/var/windows-offline-installer/artifacts
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256 is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG is required}
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS=${OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS:-24}
      - OPENPATH_GITHUB_REPO=${OPENPATH_GITHUB_REPO:-balejosg/openpath}
    command:
      - sh
      - -ec
      - |
        node dist/scripts/provision-windows-offline-installer.js
        node dist/scripts/provision-windows-offline-installer.js --verify-only
    volumes:
      - windows_offline_installer_templates:/app/var/windows-offline-installer/templates
    networks:
      - openpath_default
    security_opt:
      - no-new-privileges:true

  # OpenPath API (core functionality)
  # Internal only - accessed by gateway via Docker network (http://api:3000)
  api:
    image: ${OPENPATH_API_IMAGE:-classroompath-api:local}
    platform: ${CLASSROOMPATH_CONTAINER_PLATFORM:-linux/amd64}
    build:
      context: ../upstream/openpath
      dockerfile: ../../docker/Dockerfile.api
    container_name: classroompath-api
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - ../config/.env
    environment:
      # OpenPath runs behind the ClassroomPath gateway; trust one proxy hop.
      - TRUST_PROXY=1
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-24h}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-30d}
      - OPENPATH_FIREFOX_RELEASE_ROOT=/openpath-firefox-release
      - OPENPATH_FIREFOX_EXTENSION_INSTALL_URL=${OPENPATH_FIREFOX_EXTENSION_INSTALL_URL:-}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_DIR=/app/var/windows-offline-installer/templates
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACTS_DIR=/app/var/windows-offline-installer/artifacts
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256 is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG is required}
      - OPENPATH_WINDOWS_OFFLINE_TOKEN_TTL_HOURS=${OPENPATH_WINDOWS_OFFLINE_TOKEN_TTL_HOURS:-2}
      - OPENPATH_WINDOWS_OFFLINE_DOWNLOAD_TTL_MINUTES=${OPENPATH_WINDOWS_OFFLINE_DOWNLOAD_TTL_MINUTES:-10}
      - OPENPATH_WINDOWS_OFFLINE_DOWNLOAD_MAX_ATTEMPTS=${OPENPATH_WINDOWS_OFFLINE_DOWNLOAD_MAX_ATTEMPTS:-3}
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS=${OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS:-24}
      - OPENPATH_GITHUB_REPO=${OPENPATH_GITHUB_REPO:-balejosg/openpath}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - api-data:/app/data
      - ${OPENPATH_FIREFOX_RELEASE_DIR:-/srv/classroompath/openpath-firefox-release/current}:/openpath-firefox-release:ro
      - windows_offline_installer_templates:/app/var/windows-offline-installer/templates:ro
      - windows_offline_installer_artifacts:/app/var/windows-offline-installer/artifacts:rw
    depends_on:
      windows-offline-installer-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - openpath_default
    security_opt:
      - no-new-privileges:true

  # SPA static server (nginx)
  spa:
    image: ${CLASSROOMPATH_SPA_IMAGE:-classroompath-spa:local}
    platform: ${CLASSROOMPATH_CONTAINER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: docker/Dockerfile.spa
    container_name: classroompath-spa
    restart: unless-stopped
    ports:
      - '8081:8080'
    volumes:
      - ./spa-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - gateway
    networks:
      - openpath_default
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
  windows_offline_installer_templates:
  windows_offline_installer_artifacts:
