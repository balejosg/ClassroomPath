server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # NOTE: API routes (/api/, /trpc/, /cp/, /w/, /health) are handled by
    # Nginx Proxy Manager (NPM) at the host level BEFORE reaching this container.
    # NPM forwards those directly to the API/Gateway containers.
    # This nginx only serves the static SPA files.

    # SPA fallback - serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
